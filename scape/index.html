<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>造境 · SCAPE — 程序化声景</title>
<style>
  html { color-scheme: dark; }
  :root {
    --dock: rgba(10,14,20,0.88);
    --line: rgba(255,255,255,0.3);
    --txt: #f4f7fa;
    --dim: rgba(244,247,250,0.75);
    --gold: #f0c886;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC","STSong","SimSun","Noto Serif SC",Georgia,serif;
    background: #0a0e14; color: var(--txt);
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .masthead { position: fixed; top: 24px; left: 30px; z-index: 5; pointer-events: none; }
  .masthead h1 { font-size: clamp(26px,3.6vw,40px); font-weight: 700; letter-spacing: 0.16em; text-shadow: 0 2px 18px rgba(0,0,0,0.6); }
  .masthead h1 .en { font-size: 0.55em; font-style: italic; color: var(--gold); margin-left: 0.5em; }
  .masthead .clock { margin-top: 4px; font-size: 15px; letter-spacing: 0.3em; color: var(--dim); }
  .topright { position: fixed; top: 24px; right: 28px; z-index: 6; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: 1.5px solid var(--line); background: var(--dock); backdrop-filter: blur(10px);
    color: var(--txt); font-family: inherit; font-size: 13px; letter-spacing: 0.1em;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600;
    transition: color .2s, border-color .2s;
  }
  .btn:hover { color: var(--gold); border-color: var(--gold); }
  .btn.on { background: var(--gold); color: #14100a; border-color: var(--gold); }
  .dock {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 10px; align-items: center;
    max-width: min(96vw, 900px);
  }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    border: 1.5px solid var(--line); background: var(--dock); backdrop-filter: blur(10px);
    color: var(--txt); font-family: inherit; font-size: 13px; letter-spacing: 0.12em;
    padding: 8px 18px; border-radius: 999px; cursor: pointer; font-weight: 600;
  }
  .chip:hover, .chip.on { color: #14100a; background: var(--gold); border-color: var(--gold); }
  .board {
    display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; justify-content: center;
    padding: 14px 16px 12px; border: 1.5px solid var(--line); border-radius: 16px;
    background: var(--dock); backdrop-filter: blur(14px);
    box-shadow: 0 12px 44px rgba(0,0,0,0.55);
  }
  .ch { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 82px; padding: 4px 2px; }
  .ch .nm { font-size: 12px; letter-spacing: 0.18em; color: var(--dim); font-weight: 600; white-space: nowrap; }
  .ch input[type=range] {
    -webkit-appearance: none; appearance: none; width: 70px; height: 3px;
    background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; cursor: pointer;
  }
  .ch input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--gold); cursor: grab; border: 2px solid #0a0e14;
  }
  .timecol { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px; }
  .timecol .nm { font-size: 12px; letter-spacing: 0.18em; color: var(--dim); font-weight: 600; }
  .timecol input[type=range] {
    -webkit-appearance: none; appearance: none; width: 84px; height: 3px;
    background: linear-gradient(90deg,#1a2340,#7fb0e8,#f5d9a0,#e88d5a,#2a2a55,#141a30);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .timecol input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid var(--gold); cursor: grab;
  }
  .home-link {
    position: fixed; left: 26px; bottom: 26px; z-index: 7;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4);
    color: rgba(255,255,255,0.7); display: grid; place-items: center;
    font-size: 16px; text-decoration: none; transition: color .2s, border-color .2s;
  }
  .home-link:hover { color: var(--gold); border-color: var(--gold); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  @media (max-width: 720px) {
    .board { gap: 2px; padding: 8px 6px 6px; }
    .ch { width: 68px; }
    .ch input[type=range] { width: 58px; }
    .masthead { top: 12px; left: 14px; }
    .topright { top: 12px; right: 12px; gap: 4px; }
    .btn { font-size: 11px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<header class="masthead">
  <h1>造境<span class="en">SCAPE</span></h1>
  <div class="clock" id="clock">14:00</div>
</header>
<div class="topright">
  <button class="btn" id="themeBtn">⛰ 山</button>
  <button class="btn" id="moodBtn">✦ 心境</button>
  <button class="btn" id="sndBtn">♪ 声</button>
  <button class="btn" id="langBtn">EN</button>
</div>
<div class="dock">
  <div class="presets" id="presets"></div>
  <div class="board" id="board"></div>
</div>
<a class="home-link" href="../index.html" title="拾遗 · 序">序</a>
<script>
'use strict';
/* ================================================================
   造境 · SCAPE v5 — 程序化声景（从 mini 架构重建）
   ================================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, time = 14;

/* ---------- 工具 ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- 场景数据 ---------- */
const S = { rain: 0, wind: 0.35, fire: 0, stream: 0.3, cricket: 0, thunder: 0, birds: 0.4, bell: 0, snow: 0 };
const CH = ['rain','wind','fire','stream','cricket','thunder','birds','bell','snow'];
const CH_ZH = { rain:'雨', wind:'风', fire:'篝火', stream:'溪流', cricket:'夜虫', thunder:'雷', birds:'鸟鸣', bell:'远钟', snow:'雪' };
const CH_EN = { rain:'RAIN', wind:'WIND', fire:'FIRE', stream:'STREAM', cricket:'CRICKETS', thunder:'THUNDER', birds:'BIRDS', bell:'BELL', snow:'SNOW' };
let lang = localStorage.getItem('scape-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
let theme = 0; // 0山 1海 2城
let sndOn = true;

/* ---------- 天空 ---------- */
const SKY = [
  { t: 0,  top: [8,10,24],   mid: [14,18,38],   hor: [24,28,52] },
  { t: 4.5,top: [10,12,30],  mid: [22,24,52],   hor: [56,42,60] },
  { t: 6,  top: [46,58,96],  mid: [176,120,108],hor: [244,168,110] },
  { t: 8,  top: [96,148,200],mid: [156,196,228],hor: [232,214,178] },
  { t: 12, top: [88,142,208],mid: [150,194,232],hor: [214,226,224] },
  { t: 16, top: [92,138,198],mid: [168,186,216],hor: [238,208,158] },
  { t: 18.4,top:[70,82,140], mid: [216,130,104],hor: [248,158,92] },
  { t: 20, top: [24,26,58],  mid: [66,48,84],   hor: [140,84,78] },
  { t: 22, top: [10,12,28],  mid: [16,20,42],   hor: [28,30,54] },
  { t: 24, top: [8,10,24],   mid: [14,18,38],   hor: [24,28,52] }
];
function lerp(a, b, t) { return a + (b - a) * t; }
function skyAt(t) {
  let i = 0;
  while (i < SKY.length - 1 && SKY[i + 1].t < t) i++;
  const a = SKY[i], b = SKY[Math.min(i + 1, SKY.length - 1)];
  const f = b.t === a.t ? 0 : (t - a.t) / (b.t - a.t);
  return {
    top: [0,1,2].map(j => Math.round(lerp(a.top[j], b.top[j], f))),
    mid: [0,1,2].map(j => Math.round(lerp(a.mid[j], b.mid[j], f))),
    hor: [0,1,2].map(j => Math.round(lerp(a.hor[j], b.hor[j], f))),
    L: (a.L || 0.5) + ((b.L || 0.5) - (a.L || 0.5)) * f
  };
}

/* ---------- 山脊 ---------- */
let ridges = [];
function makeRidge(w, h, seed, yBase, amp, color) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w); c.height = Math.max(1, h);
  const g2 = c.getContext('2d');
  const rnd = mulberry32(seed);
  g2.fillStyle = color;
  g2.beginPath();
  g2.moveTo(0, h);
  const pts = [];
  for (let i = 0; i <= 8; i++) pts.push([w * i / 8, yBase + (rnd() - 0.5) * amp]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let s = 0; s <= 6; s++) {
      const t2 = s / 6;
      const x = 0.5 * ((2*p1[0]) + (-p0[0]+p2[0])*t2 + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t2*t2*t2);
      const y = 0.5 * ((2*p1[1]) + (-p0[1]+p2[1])*t2 + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t2*t2*t2);
      g2.lineTo(x, y);
    }
  }
  g2.lineTo(w, h); g2.closePath(); g2.fill();
  return c;
}
function rebuildScenery() {
  ridges = [
    makeRidge(W, H, 71, H * 0.52, H * 0.09, 'rgba(0,0,0,0.24)'),
    makeRidge(W, H, 72, H * 0.62, H * 0.10, 'rgba(0,0,0,0.42)'),
    makeRidge(W, H, 73, H * 0.74, H * 0.08, 'rgba(0,0,0,0.66)')
  ];
}
function resize() {
  W = innerWidth; H = innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rebuildScenery();
}
resize();
window.addEventListener('resize', resize);

/* ---------- 粒子 ---------- */
let stars = [], clouds = [], raindrops = [], snowflakes = [], petals = [], embers = [];
function initParticles() {
  const rnd = mulberry32(99);
  stars = [];
  for (let i = 0; i < 130; i++)
    stars.push({ x: rnd() * W, y: rnd() * H * 0.55, r: rnd() * 1.3 + 0.3, p: rnd() * Math.PI * 2 });
  clouds = [];
  for (let i = 0; i < 7; i++) {
    const puffs = [];
    for (let j = 0; j < 5; j++) puffs.push({ dx: (rnd() - 0.5) * 160, dy: (rnd() - 0.5) * 34, r: 34 + rnd() * 46 });
    clouds.push({ x: rnd() * W, y: H * (0.1 + rnd() * 0.26), v: 4 + rnd() * 9, puffs });
  }
  raindrops = [];
  for (let i = 0; i < 240; i++)
    raindrops.push({ x: rnd() * W * 1.2 - W * 0.1, y: rnd() * H, v: 620 + rnd() * 380 });
  snowflakes = [];
  for (let i = 0; i < 190; i++)
    snowflakes.push({ x: rnd() * W, y: rnd() * H, v: 26 + rnd() * 52, r: 1 + rnd() * 2.4, p: rnd() * Math.PI * 2 });
  petals = [];
  for (let i = 0; i < 90; i++)
    petals.push({ x: rnd() * W, y: rnd() * H, v: 18 + rnd() * 30, s: 2.5 + rnd() * 3, p: rnd() * Math.PI * 2 });
  embers = [];
}
initParticles();

/* ---------- 音频 ---------- */
let AC = null, master = null;
const audioNodes = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6;
  master = AC.createGain(); master.gain.value = 0.6;
  master.connect(comp); comp.connect(AC.destination);
  // 生成噪声缓冲
  const len = AC.sampleRate * 2;
  const white = AC.createBuffer(1, len, AC.sampleRate);
  const brown = AC.createBuffer(1, len, AC.sampleRate);
  const wd = white.getChannelData(0), bd = brown.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    wd[i] = Math.random() * 2 - 1;
    last = (last + 0.02 * wd[i]) / 1.02;
    bd[i] = last * 3.5;
  }
  // 各声道
  function makeChannel(buf, filterType, freq, gain) {
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
    const g = AC.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(master); src.start();
    return { f, g };
  }
  audioNodes.rain = makeChannel(white, 'lowpass', 900, 0);
  audioNodes.wind = makeChannel(brown, 'lowpass', 300, 0);
  audioNodes.fire = makeChannel(brown, 'lowpass', 380, 0);
  audioNodes.stream = makeChannel(white, 'bandpass', 720, 0);
  updateAudio(0);
}
function updateAudio(smooth = 0.5) {
  if (!AC || !master) return;
  const t = AC.currentTime;
  const set = (p, v) => p.setTargetAtTime(v, t, smooth);
  if (audioNodes.rain) {
    set(audioNodes.rain.g.gain, S.rain * 0.42);
    set(audioNodes.rain.f.frequency, 500 + S.rain * 2800);
  }
  if (audioNodes.wind) set(audioNodes.wind.g.gain, S.wind * 0.5);
  if (audioNodes.fire) set(audioNodes.fire.g.gain, S.fire * 0.3);
  if (audioNodes.stream) set(audioNodes.stream.g.gain, S.stream * 0.26);
}

/* ---------- 绘制 ---------- */
let frameTime = 0;
function draw(dt) {
  frameTime += dt;
  const sky = skyAt(S.time || time);
  const L = sky.L || 0.9;

  // 天空
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.8);
  g.addColorStop(0, `rgb(${sky.top.join(',')})`);
  g.addColorStop(0.62, `rgb(${sky.mid.join(',')})`);
  g.addColorStop(1, `rgb(${sky.hor.join(',')})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 星（夜间）
  const starA = Math.max(0, 1 - L * 1.8);
  if (starA > 0.01) {
    for (const st of stars) {
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(frameTime * 1.4 + st.p));
      ctx.fillStyle = `rgba(240,244,255,${(starA * tw * 0.85).toFixed(3)})`;
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
  }

  // 日月
  const isDay = S.time > 6 && S.time < 18;
  {
    const ang = (S.time - (isDay ? 12 : 0)) / 12 * Math.PI;
    const ox2 = W / 2 + Math.sin(ang) * W * 0.42;
    const oy2 = H * 0.62 - Math.cos(ang) * H * 0.5;
    if (oy2 < H * 0.72) {
      const r = isDay ? 30 : 22;
      const glow = ctx.createRadialGradient(ox2, oy2, 0, ox2, oy2, r * 5);
      glow.addColorStop(0, isDay ? 'rgba(255,232,170,0.7)' : 'rgba(225,236,255,0.4)');
      glow.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(ox2 - r * 5, oy2 - r * 5, r * 10, r * 10);
      ctx.fillStyle = isDay ? '#fff3cf' : '#eef2fb';
      ctx.beginPath(); ctx.arc(ox2, oy2, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 云
  const cloudA = 0.3 + S.rain * 0.45;
  for (const cl of clouds) {
    cl.x += cl.v * (0.4 + S.wind * 2.4) * dt;
    if (cl.x - 260 > W) cl.x = -260;
    ctx.fillStyle = `rgba(200,204,214,${(cloudA * 0.5).toFixed(3)})`;
    for (const p of cl.puffs) {
      ctx.beginPath(); ctx.arc(cl.x + p.dx, cl.y + p.dy, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 山脊
  for (const r of ridges) ctx.drawImage(r, 0, 0);

  // 主题：海
  if (theme === 1) {
    const hor = H * 0.56;
    const wg = ctx.createLinearGradient(0, hor, 0, H);
    wg.addColorStop(0, `rgb(${sky.hor.map(v => Math.round(v * 0.9)).join(',')})`);
    wg.addColorStop(1, `rgb(${sky.top.map(v => Math.round(v * 0.4)).join(',')})`);
    ctx.fillStyle = wg;
    ctx.fillRect(0, hor, W, H - hor);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    for (let i = 0; i < 9; i++) {
      const y = hor + 8 + (i / 9) * (H - hor) * 0.85;
      const x = ((frameTime * (10 + i * 5)) % (W + 200)) - 100;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 40, y - 2, x + 90, y); ctx.stroke();
    }
  }

  // 主题：城
  if (theme === 2) {
    const nightW = Math.max(0, 1 - L * 1.6);
    const rnd2 = mulberry32(5150);
    for (let layer = 0; layer < 2; layer++) {
      const base = H * (layer ? 0.94 : 0.88);
      const shade = layer ? 'rgba(10,14,22,0.88)' : 'rgba(18,24,36,0.72)';
      let x = -20;
      while (x < W + 40) {
        const bw = 34 + rnd2() * 66;
        const bh = H * (0.16 + rnd2() * 0.2) * (layer ? 1.35 : 1);
        const top = base - bh;
        ctx.fillStyle = shade;
        ctx.fillRect(x, top, bw, bh + 40);
        // 窗
        const cols = Math.max(1, Math.floor(bw / 15));
        const rowsN = Math.max(2, Math.floor(bh / 20));
        const wa = 0.06 + nightW * 0.75;
        for (let c = 0; c < cols; c++) for (let r2 = 0; r2 < rowsN; r2++) {
          if (rnd2() < 0.34) {
            ctx.fillStyle = `rgba(255,214,140,${(wa * (0.85 + 0.15 * Math.sin(frameTime * 0.7 + c + r2))).toFixed(3)})`;
            ctx.fillRect(x + 5 + c * 15, top + 8 + r2 * 20, 6, 9);
          }
        }
        x += bw + 6 + rnd2() * 26;
      }
    }
  }

  // 雨
  if (S.rain > 0.02) {
    const count = Math.round(raindrops.length * S.rain);
    const windX = S.wind * 260 + Math.sin(frameTime * 0.8) * S.wind * 60;
    ctx.strokeStyle = `rgba(200,214,230,${(0.14 + S.rain * 0.3).toFixed(3)})`;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const d = raindrops[i];
      d.y += d.v * dt;
      d.x += windX * dt;
      if (d.y > H) { d.y = -20; d.x = Math.random() * W * 1.2 - W * 0.1; }
      if (d.x > W * 1.1) d.x -= W * 1.2;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - (windX / d.v) * 12, d.y - 12);
    }
    ctx.stroke();
  }

  // 雪
  if (S.snow > 0.02) {
    const count = Math.round(snowflakes.length * S.snow);
    ctx.fillStyle = 'rgba(240,246,255,0.85)';
    for (let i = 0; i < count; i++) {
      const f = snowflakes[i];
      f.y += f.v * dt * (0.5 + S.snow * 0.7);
      f.x += Math.sin(frameTime * 0.9 + f.p) * 16 * dt + S.wind * 90 * dt;
      if (f.y > H + 4) { f.y = -6; f.x = Math.random() * W; }
      if (f.x > W + 6) f.x -= W + 12;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 篝火
  if (S.fire > 0.03) {
    const fx = W * 0.82, fy = H * 0.9;
    const flick = 0.75 + 0.25 * Math.sin(frameTime * 9.3) * Math.sin(frameTime * 4.1);
    const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, 150 * S.fire * flick + 40);
    fg.addColorStop(0, `rgba(255,168,84,${(0.4 * S.fire * flick).toFixed(3)})`);
    fg.addColorStop(1, 'rgba(255,100,40,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(fx - 260, fy - 260, 520, 520);
    ctx.fillStyle = '#2a1c14';
    ctx.beginPath(); ctx.ellipse(fx, fy + 8, 34, 10, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 3; i++) {
      const fl = (0.8 + 0.2 * Math.sin(frameTime * 8 + i * 2.4)) * S.fire;
      const h = 34 * fl + 14;
      ctx.fillStyle = `hsl(${28 - i * 8},95%,${58 - i * 8}%)`;
      ctx.beginPath();
      ctx.moveTo(fx - (16 - i * 4), fy);
      ctx.quadraticCurveTo(fx - 6 + Math.sin(frameTime * 7 + i) * 5, fy - h * 0.6, fx + Math.sin(frameTime * 5.5 + i * 2) * 4, fy - h);
      ctx.quadraticCurveTo(fx + 8, fy - h * 0.5, fx + (16 - i * 4), fy);
      ctx.closePath(); ctx.fill();
    }
    if (Math.random() < 0.3 + S.fire * 0.5) embers.push({ x: fx + (Math.random() - 0.5) * 22, y: fy - 24, vy: -40 - Math.random() * 60, vx: (Math.random() - 0.5) * 26, life: 1 });
    ctx.fillStyle = 'rgba(255,190,110,0.9)';
    for (const em of embers) {
      em.life -= dt * 0.7; em.y += em.vy * dt; em.x += em.vx * dt;
      if (em.life > 0) { ctx.globalAlpha = em.life; ctx.fillRect(em.x, em.y, 2, 2); }
    }
    ctx.globalAlpha = 1;
    embers = embers.filter(e => e.life > 0).slice(-90);
  }

  // 暗角
  const vg = ctx.createRadialGradient(W / 2, H * 0.44, Math.min(W, H) * 0.36, W / 2, H * 0.5, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(4,6,10,0.46)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- UI ---------- */
const PRESETS = {
  rainy:   { rain: 0.65, wind: 0.18, fire: 0, stream: 0, cricket: 0, thunder: 0.35, birds: 0, bell: 0, snow: 0, time: 22 },
  morning: { rain: 0, wind: 0.12, fire: 0, stream: 0.6, cricket: 0.35, thunder: 0, birds: 0.4, bell: 0, snow: 0, time: 6.2 },
  fireside:{ rain: 0.3, wind: 0.28, fire: 0.75, stream: 0, cricket: 0.2, thunder: 0, birds: 0, bell: 0.15, snow: 0, time: 20.5 },
  valley:  { rain: 0, wind: 0.38, fire: 0, stream: 0.32, cricket: 0, thunder: 0, birds: 0.5, bell: 0, snow: 0, time: 14 },
  winter:  { rain: 0, wind: 0.22, fire: 0.55, stream: 0, cricket: 0, thunder: 0, birds: 0, bell: 0.3, snow: 0.85, time: 21.5 }
};
const PRESET_ZH = { rainy: '雨夜读书', morning: '山涧清晨', fireside: '炉边听风', valley: '午后山谷', winter: '冬夜围炉' };
const PRESET_EN = { rainy: 'Rainy Night', morning: 'Dawn', fireside: 'Fireside', valley: 'Valley', winter: 'Winter' };

function buildUI() {
  // 预设
  const pr = document.getElementById('presets');
  pr.innerHTML = '';
  Object.keys(PRESETS).forEach(key => {
    const b = document.createElement('button');
    b.className = 'chip' + (key === 'valley' ? ' on' : '');
    b.textContent = lang === 'zh' ? PRESET_ZH[key] : PRESET_EN[key];
    b.addEventListener('click', () => {
      Object.assign(S, PRESETS[key]);
      time = S[key] !== undefined ? S[key].time || S.time : S.time;
      time = PRESETS[key].time;
      initAudio(); updateAudio(1.2); buildBoard(); updateClock();
      pr.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
    });
    pr.appendChild(b);
  });
  // 声道滑杆
  const bd = document.getElementById('board');
  bd.innerHTML = '';
  for (const k of CH) {
    const d = document.createElement('div');
    d.className = 'ch';
    d.innerHTML = `<div class="nm">${lang === 'zh' ? CH_ZH[k] : CH_EN[k]}</div>
      <input type="range" min="0" max="1" step="0.01" value="${S[k]}" aria-label="${k}">`;
    const inp = d.querySelector('input');
    inp.addEventListener('input', () => {
      S[k] = +inp.value;
      initAudio(); updateAudio();
    });
    bd.appendChild(d);
  }
  // 时间滑杆
  const tc = document.createElement('div');
  tc.className = 'timecol';
  tc.innerHTML = `<div class="nm">${lang === 'zh' ? '时刻' : 'HOUR'}</div>
    <input type="range" id="timeR" min="0" max="24" step="0.1" value="${time}">`;
  tc.querySelector('input').addEventListener('input', function() {
    time = +this.value;
    updateClock();
  });
  bd.appendChild(tc);
}

function updateClock() {
  const h = Math.floor(time) % 24, m = Math.floor((time % 1) * 60);
  document.getElementById('clock').textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
}

/* 主题按钮 */
const themeBtn = document.getElementById('themeBtn');
const THEMES = ['⛰ 山', '🌊 海', '🏙 城'];
const THEMES_EN = ['⛰ MTN', '🌊 SEA', '🏙 CITY'];
function updTheme() { themeBtn.textContent = lang === 'zh' ? THEMES[theme] : THEMES_EN[theme]; }
themeBtn.addEventListener('click', () => { theme = (theme + 1) % 3; updTheme(); });

/* 心境 */
const MOODS = ['山雨欲来', '雪夜炉火', '城市黄昏', '海雾清晨', '樱花午后', '极夜深城'];
document.getElementById('moodBtn').addEventListener('click', () => {
  const m = MOODS[Math.floor(Math.random() * MOODS.length)];
  const map = { '山雨欲来': {rain:.5,wind:.4,thunder:.3,time:16,theme:0}, '雪夜炉火': {fire:.8,snow:.9,time:21.5,theme:0},
    '城市黄昏': {rain:0,wind:.2,birds:.3,time:18.2,theme:2}, '海雾清晨': {rain:.15,wind:.3,stream:.5,birds:.4,time:6.5,theme:1},
    '樱花午后': {rain:0,wind:.25,stream:.3,birds:.5,time:14,theme:0}, '极夜深城': {rain:.3,wind:.3,snow:.8,bell:.3,time:23,theme:2} };
  const s = map[m] || {};
  CH.forEach(c => S[c] = s[c] !== undefined ? s[c] : 0);
  time = s.time || 14;
  theme = s.theme || 0;
  updTheme(); buildUI(); updateClock();
  initAudio(); updateAudio(1);
});

/* 声音 */
const sndBtn = document.getElementById('sndBtn');
function updSnd() { sndBtn.textContent = lang === 'zh' ? (sndOn ? '♪ 声' : '♪ 静') : (sndOn ? '♪ SND' : '♪ MUTE'); }
sndBtn.addEventListener('click', () => {
  sndOn = !sndOn;
  if (master) master.gain.setTargetAtTime(sndOn ? 0.6 : 0, AC.currentTime, 0.3);
  updSnd();
});

/* 语言 */
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('scape-lang', lang);
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  updTheme(); updSnd(); buildUI();
});

/* ---------- 主循环 ---------- */
let prev = performance.now();
let pageHidden = false;
document.addEventListener('visibilitychange', () => {
  pageHidden = document.hidden;
  if (!pageHidden) prev = performance.now();
});
function loop(now) {
  requestAnimationFrame(loop);
  if (pageHidden) return;
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  draw(dt);
  // 时间自动流转（可选）
  updateAudio(2);
}

/* ---------- 启动 ---------- */
document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
updTheme(); updSnd(); buildUI(); updateClock();
requestAnimationFrame(loop);
</script>
