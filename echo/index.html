<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2307090d'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23e8c07a'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%238fa5c4' stroke-width='2.5' opacity='.85'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%238fa5c4' stroke-width='2' opacity='.45'/%3E%3C/svg%3E">
<meta property="og:title" content="回声 · ECHO — 无光迷宫">
<meta property="og:description" content="沉没之城里你只有声音：回声涟漪照亮墙壁，凭记忆走向天光。十二层 + 造井编辑器">
<meta property="og:type" content="website">
<title>回声 · ECHO — 回声定位迷宫</title>
<style>
  html { color-scheme: dark; }
  :root {
    --bg: #07090d;
    --wall: #5d6b85;
    --ember: #e8c07a;
    --pale: #9db0c9;
    --cyan: #7fd8d0;
    --gold: #e8c07a;
    --hairline: rgba(157,176,201,0.22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", Georgia, serif;
    background: var(--bg); color: var(--pale);
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    z-index: 5; display: flex; gap: 22px; align-items: baseline;
    font-size: 14px; letter-spacing: 0.22em; color: var(--pale);
    text-shadow: 0 0 12px rgba(157,176,201,0.35);
    pointer-events: none; white-space: nowrap;
  }
  .hud b { color: var(--ember); font-weight: 600; }
  .hud .sep { color: var(--hairline); }

  .topbar { position: fixed; top: 20px; right: 24px; z-index: 6; display: flex; gap: 8px; }
  .btn-ghost {
    border: 1px solid var(--hairline); background: rgba(7,9,13,0.55);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px); color: var(--pale);
    font-family: inherit; font-size: 12.5px; letter-spacing: 0.14em;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .2s, opacity .2s;
  }
  .btn-ghost:hover { color: var(--ember); border-color: var(--ember); }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column; align-items: center; justify-content: flex-start;
    background: radial-gradient(ellipse at 50% 42%, rgba(20,26,38,0.88), rgba(7,9,13,0.97));
    text-align: center; padding: 30px; overflow-y: auto; overscroll-behavior: contain;
  }
  /* 安全居中：内容超高时顶边不裁、可回滚（替代 justify-content:center 的 flex 溢出缺陷） */
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay.show { display: flex; }
  .ov-title { font-size: clamp(40px, 8vw, 76px); font-weight: 600; letter-spacing: 0.22em; color: var(--pale); text-shadow: 0 0 34px rgba(157,176,201,0.45); }
  .ov-title .en { display: block; font-size: 0.28em; letter-spacing: 0.55em; color: var(--ember); margin-top: 10px; font-style: italic; }
  .ov-sub { margin-top: 18px; font-size: 15px; line-height: 2.1; letter-spacing: 0.12em; color: var(--pale); max-width: 520px; }
  .ov-actions { margin-top: 34px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn-main {
    border: 1px solid var(--ember); background: none; color: var(--ember);
    font-family: inherit; font-size: 15px; letter-spacing: 0.3em;
    padding: 13px 34px; border-radius: 2px; cursor: pointer;
    transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .btn-main:hover { background: var(--ember); color: #0a0c10; box-shadow: 0 0 30px rgba(232,192,122,0.4); }
  .btn-sub {
    border: 1px solid var(--hairline); background: none; color: var(--pale);
    font-family: inherit; font-size: 13.5px; letter-spacing: 0.22em;
    padding: 12px 26px; border-radius: 2px; cursor: pointer;
    transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .btn-sub:hover { border-color: var(--pale); }

  /* 关卡选择 */
  .levels { margin-top: 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .lv {
    border: 1px solid var(--hairline); background: rgba(20,26,38,0.5);
    color: var(--pale); font-family: inherit; cursor: pointer;
    padding: 14px 10px; border-radius: 4px; min-width: 108px;
    transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .2s, opacity .2s; text-align: center;
  }
  .lv:hover:not(:disabled) { border-color: var(--ember); color: var(--ember); }
  .lv:disabled { opacity: 0.32; cursor: not-allowed; }
  .lv .n { font-size: 17px; letter-spacing: 0.1em; }
  .lv .t { font-size: 11px; letter-spacing: 0.28em; margin-top: 6px; color: var(--cyan); }
  .lv .b { font-size: 11px; margin-top: 6px; color: var(--pale); opacity: 0.75; }

  /* 每日挑战入口 */
  .daily-row { margin-top: 20px; }
  .well-chip {
    border: 1px solid rgba(232,192,122,0.35); background: rgba(26,20,12,0.6);
    color: var(--gold); font-family: inherit; font-size: 12.5px; letter-spacing: 0.2em;
    padding: 9px 20px; border-radius: 999px; cursor: pointer;
    transition: color .25s, border-color .25s, box-shadow .25s, opacity .25s;
  }
  .well-chip:hover { box-shadow: 0 0 18px rgba(232,192,122,0.2); }
  .well-chip small { opacity: 0.65; font-size: 10.5px; margin-left: 6px; letter-spacing: 0.1em; }
  .daily-chip {
    border: 1px solid rgba(127,216,208,0.4); background: rgba(10,16,18,0.6);
    color: var(--cyan); font-family: inherit; font-size: 13px; letter-spacing: 0.24em;
    padding: 10px 26px; border-radius: 999px; cursor: pointer;
    transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .daily-chip:hover { box-shadow: 0 0 22px rgba(127,216,208,0.25); }
  .daily-chip.done { opacity: 0.5; }

  /* 成就墙 */
  .ach-wall { margin-top: 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 560px; }
  .ach {
    border: 1px solid var(--hairline); border-radius: 5px; padding: 10px 8px;
    font-size: 11px; letter-spacing: 0.12em; line-height: 1.7; color: rgba(157,176,201,0.4);
    text-align: center; background: rgba(14,18,26,0.5); min-width: 118px;
    transition: color .3s, border-color .3s, box-shadow .3s, opacity .3s;
  }
  .ach .ico { font-size: 17px; display: block; margin-bottom: 4px; filter: grayscale(1); opacity: 0.5; }
  .ach.got { color: var(--gold); border-color: rgba(232,192,122,0.45); box-shadow: 0 0 14px rgba(232,192,122,0.12) inset; }
  .ach.got .ico { filter: none; opacity: 1; }

  /* 过关面板 */
  .panel { border: 1px solid var(--hairline); background: rgba(14,18,26,0.85); padding: 34px 44px; border-radius: 6px; max-width: 560px; }
  .panel h2 { font-size: 26px; letter-spacing: 0.3em; color: var(--ember); font-weight: 600; }
  .panel .stats { margin-top: 18px; font-size: 14.5px; line-height: 2.2; letter-spacing: 0.1em; }
  .lanterns { font-size: 22px; letter-spacing: 0.4em; margin-top: 8px; color: var(--ember); }
  .lanterns .off { opacity: 0.18; }

  /* 剧情碎片弹现 */
  .frag {
    position: fixed; left: 50%; bottom: 15%; transform: translateX(-50%) translateY(14px);
    z-index: 8; max-width: min(86vw, 560px); padding: 16px 28px;
    border: 1px solid rgba(127,216,208,0.4); border-radius: 4px;
    background: rgba(10,16,18,0.92); color: var(--cyan);
    font-size: 15px; line-height: 1.9; letter-spacing: 0.1em; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .6s, transform .6s;
    text-shadow: 0 0 14px rgba(127,216,208,0.4);
  }
  .frag.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 关卡开场卡 */
  .levelcard {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
    z-index: 8; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .8s;
  }
  .levelcard.show { opacity: 1; }
  .levelcard .no { font-size: 13px; letter-spacing: 0.6em; color: var(--cyan); text-indent: 0.6em; }
  .levelcard .nm { font-size: clamp(30px, 5vw, 44px); letter-spacing: 0.3em; color: var(--pale); margin-top: 10px; text-shadow: 0 0 26px rgba(157,176,201,0.4); }
  .levelcard .sb { font-size: 13.5px; letter-spacing: 0.2em; color: rgba(157,176,201,0.75); margin-top: 14px; }

  /* 成就 toast */
  .ach-toast {
    position: fixed; right: 26px; top: 84px; z-index: 9;
    display: flex; gap: 12px; align-items: center;
    border: 1px solid rgba(232,192,122,0.5); border-radius: 6px;
    background: rgba(24,20,12,0.94); padding: 13px 18px;
    opacity: 0; transform: translateX(18px); pointer-events: none;
    transition: opacity .5s, transform .5s;
  }
  .ach-toast.show { opacity: 1; transform: none; }
  .ach-toast .ico { font-size: 24px; }
  .ach-toast .tx { text-align: left; }
  .ach-toast .tx .n { font-size: 14.5px; letter-spacing: 0.2em; color: var(--gold); }
  .ach-toast .tx .d { font-size: 11.5px; letter-spacing: 0.1em; color: var(--pale); margin-top: 3px; }

  /* 结局诗 */
  .poem { margin-top: 26px; font-size: 15.5px; line-height: 2.4; letter-spacing: 0.14em; color: var(--pale); max-width: 560px; }
  .poem .miss { color: rgba(157,176,201,0.3); }

  .kbd-hint { margin-top: 26px; font-size: 12.5px; letter-spacing: 0.18em; color: rgba(157,176,201,0.6); }
  .kbd-hint span { border: 1px solid var(--hairline); border-radius: 3px; padding: 2px 7px; margin: 0 2px; }

  #errbox { position: fixed; inset: auto 0 0 0; z-index: 99; background: #401414; color: #ffb4b4; font-size: 12px; padding: 8px 12px; display: none; }

  /* ---------- 造井编辑器 ---------- */
  .ed-bar {
    position: fixed; left: 50%; top: 20px; transform: translateX(-50%);
    z-index: 7; display: none; flex-direction: column; gap: 8px; align-items: center;
    padding: 12px 16px; border: 1px solid var(--hairline); border-radius: 14px;
    background: rgba(14,18,26,0.9); -webkit-backdrop-filter: blur(10px);
 backdrop-filter: blur(10px);
    max-width: min(96vw, 720px);
  }
  .ed-bar.show { display: flex; }
  .ed-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .ed-row .lbl { font-size: 11.5px; letter-spacing: 0.24em; color: var(--dim, rgba(157,176,201,0.6)); margin: 0 4px; }
  .ed-t {
    border: 1px solid var(--hairline); background: none; color: var(--pale);
    font-family: inherit; font-size: 12px; letter-spacing: 0.12em;
    padding: 6px 13px; border-radius: 999px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s;
  }
  .ed-t.on { background: var(--pale); color: #0a0e14; border-color: var(--pale); }
  .ed-t.go { border-color: var(--ember); color: var(--ember); }
  .ed-t.go:hover { background: var(--ember); color: #0a0e14; }
  .ed-note { font-size: 11px; letter-spacing: 0.2em; color: rgba(157,176,201,0.55); }

  .ed-share {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(4,6,10,0.85);
    padding: 24px;
  }
  .ed-share.show { display: flex; }
  .ed-share .box {
    width: min(560px, 94vw); border: 1px solid var(--hairline); border-radius: 10px;
    background: rgba(14,18,26,0.97); padding: 24px; text-align: center;
  }
  .ed-share textarea {
    width: 100%; height: 110px; margin-top: 14px; resize: none;
    background: rgba(7,9,13,0.8); color: var(--pale); border: 1px solid var(--hairline);
    border-radius: 6px; font-family: Georgia, monospace; font-size: 11px; padding: 10px; outline: none;
  }
  .ed-share textarea:focus { border-color: var(--ember); }

  .home-link {
    position: fixed; left: 26px; bottom: 26px; z-index: 6;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--hairline); background: rgba(7,9,13,0.55); -webkit-backdrop-filter: blur(6px);
 backdrop-filter: blur(6px);
    color: var(--pale); display: grid; place-items: center;
    font-size: 16px; text-decoration: none; transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .home-link:hover { color: var(--ember); border-color: var(--ember); transform: translateY(-3px); }

  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  @media (max-width: 640px) {
    .hud { gap: 12px; font-size: 13.5px; letter-spacing: 0.14em; top: 14px; flex-wrap: wrap; white-space: normal; }
    .topbar { top: 12px; right: 12px; }
    .levels { grid-template-columns: repeat(2, 1fr); }
    .ach-wall { grid-template-columns: repeat(2, 1fr); }
    .ed-bar { top: 10px; padding: 8px 8px; gap: 5px; max-width: 97vw; }
    .ed-row { gap: 4px; }
    .ed-t { font-size: 11px; padding: 5px 9px; letter-spacing: 0.06em; }
    .ed-row .lbl { font-size: 10px; letter-spacing: 0.14em; margin: 0 2px; }
    .ed-note { font-size: 9.5px; letter-spacing: 0.1em; }
    .well-chip { font-size: 11.5px; padding: 7px 13px; }
    .well-chip small { display: block; margin: 2px 0 0; }
    #minimap { transform: scale(0.75); transform-origin: bottom right; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="minimap" width="140" height="100" style="position:fixed;right:16px;bottom:16px;z-index:4;opacity:0.82;pointer-events:none;border-radius:6px"></canvas>

<div class="hud" id="hud" style="display:none">
  <span id="hudLevel"></span><span class="sep">·</span>
  <span id="hudSteps"></span><span class="sep">·</span>
  <span id="hudPings"></span><span class="sep">·</span>
  <span id="hudTime"></span><span class="sep" id="hudLostSep" style="display:none">·</span>
  <span id="hudLost" style="display:none"></span>
</div>

<div class="topbar" id="topbar" style="display:none">
  <button class="btn-ghost" id="menuBtn"></button>
  <button class="btn-ghost" id="sndBtn"></button>
  <button class="btn-ghost" id="recallBtn"></button>
  <button class="btn-ghost" id="langBtn">EN</button>
</div>

<div class="overlay show" id="menuOv">
  <div class="ov-title">回声<span class="en">E C H O</span></div>
  <div class="ov-sub" data-t="menuSub"></div>
  <div class="ov-actions">
    <button class="btn-main" id="startBtn" data-t="start"></button>
    <button class="btn-sub" id="editBtn" style="border-color:rgba(127,216,208,0.4); color:var(--cyan)">造 井</button>
  </div>
  <div class="daily-row">
    <button class="daily-chip" id="dailyBtn"></button>
  </div>
  <div class="daily-row" id="wellRow" style="margin-top:12px"></div>
  <div class="levels" id="levels"></div>
  <div class="ach-wall" id="achWall"></div>
  <div class="kbd-hint" data-t="kbd"></div>
</div>

<div class="overlay" id="clearOv">
  <div class="panel">
    <h2 id="clearTitle"></h2>
    <div class="lanterns" id="lanterns"></div>
    <div class="stats" id="clearStats"></div>
    <div style="margin-top:16px;font-size:11px;letter-spacing:0.34em;color:rgba(157,176,201,0.6)" id="heatLbl"></div>
    <canvas id="heatCv" width="420" height="280" style="width:100%;max-width:420px;margin-top:8px;border:1px solid var(--hairline);border-radius:5px"></canvas>
    <div class="ov-actions" style="margin-top:24px">
      <button class="btn-main" id="nextBtn" data-t="next"></button>
      <button class="btn-sub" id="retryBtn" data-t="retry"></button>
      <button class="btn-sub" id="clearMenuBtn" data-t="toMenu"></button>
    </div>
  </div>
</div>

<div class="overlay" id="endOv">
  <div class="ov-title" style="font-size:clamp(30px,6vw,52px)">天光<span class="en" data-t="endEn"></span></div>
  <div class="ov-sub" data-t="endSub"></div>
  <div class="poem" id="poem"></div>
  <div class="ov-actions">
    <button class="btn-main" id="againBtn" data-t="again"></button>
    <button class="btn-sub" id="endMenuBtn" data-t="toMenu"></button>
  </div>
</div>

<div class="ed-bar" id="edBar">
  <div class="ed-row" id="edTools"><span class="lbl" data-e="tools"></span></div>
  <div class="ed-row">
    <span class="lbl" data-e="size"></span>
    <button class="ed-t edsz" data-w="13" data-h="9">13×9</button>
    <button class="ed-t edsz" data-w="17" data-h="13">17×13</button>
    <button class="ed-t edsz" data-w="21" data-h="15">21×15</button>
    <span class="ed-note" id="edCustomLbl"></span>
    <input type="number" id="edW" min="7" max="31" step="2" style="width:44px;background:rgba(7,9,13,0.8);color:var(--pale);border:1px solid var(--hairline);border-radius:4px;padding:4px 6px;font-family:Georgia,serif;font-size:12px;text-align:center" value="17">×
    <input type="number" id="edH" min="7" max="25" step="2" style="width:44px;background:rgba(7,9,13,0.8);color:var(--pale);border:1px solid var(--hairline);border-radius:4px;padding:4px 6px;font-family:Georgia,serif;font-size:12px;text-align:center" value="13">
    <button class="ed-t" id="edCustomSize">↵</button>
    <span style="width:8px"></span>
    <button class="ed-t" id="edFrags" data-e="fragTxt"></button>
    <span class="ed-note" id="edGhostLbl"></span>
    <select id="edGhosts" style="background:rgba(7,9,13,0.8);color:var(--pale);border:1px solid var(--hairline);border-radius:4px;padding:4px 6px;font-family:inherit;font-size:12px;outline:none">
      <option value="0">👻 0</option><option value="1">👻 1</option><option value="2">👻 2</option><option value="3">👻 3</option>
    </select>
    <button class="ed-t" id="edClear" data-e="clear"></button>
    <button class="ed-t" id="edShare" data-e="share"></button>
  </div>
  <div class="ed-row">
    <button class="ed-t go" id="edPlay" data-e="play"></button>
    <button class="ed-t" id="edExit" data-e="exit"></button>
    <span class="ed-note" id="edNote"></span>
  </div>
</div>

<div class="ed-share" id="edShareOv">
  <div class="box">
    <h3 style="font-size:15px;letter-spacing:0.3em;color:var(--cyan)" id="edShareTitle"></h3>
    <div style="font-size:12px;color:rgba(157,176,201,0.7);margin-top:10px;line-height:1.9" id="edShareTip"></div>
    <textarea id="edCode" spellcheck="false"></textarea>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
      <button class="ed-t go" id="edCopy"></button>
      <button class="ed-t go" id="edImport"></button>
      <button class="ed-t" id="edShareClose"></button>
    </div>
  </div>
</div>

<div class="levelcard" id="levelcard"></div>
<div class="frag" id="frag"></div>
<div class="ach-toast" id="achToast"></div>
<a class="home-link" href="../index.html" title="拾遗 · 序">序</a>
<div id="errbox"></div>

<script>
'use strict';
window.addEventListener('error', e => {
  const b = document.getElementById('errbox');
  b.style.display = 'block'; b.textContent = 'ERR: ' + e.message;
});

/* ================= i18n ================= */
const I18N = {
  zh: {
    menuSub: '无光的深处，唯回声与你同行。<br>以声照路，走出这座沉没之城。', start: '入 井',
    kbd: '<span>方向键 / WASD</span> 移动　<span>空格 / 点击</span> 发出回声',
    steps: '步', pings: '回声', par: '定额', time: '时', lost: '迷失',
    recallOn: '余像 · 开', recallOff: '余像 · 关',

/* ================= 关卡数据 ================= */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* ===================== 关卡生成 v2：房间-走廊 + 验证 ===================== */

/* 生成关卡 v3「加法结构」：从空地开始加策略墙
   比减法（从墙中挖房）更开阔、更少无意义厚墙 */
function genLevel(w, h, rng, style) {
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  // 边界
  for (let x = 0; x < w; x++) { g[0][x] = '#'; g[h-1][x] = '#'; }
  for (let y = 0; y < h; y++) { g[y][0] = '#'; g[y][w-1] = '#'; }

  const wall = (x, y) => { if (x >= 1 && x < w-1 && y >= 1 && y < h-1) g[y][x] = '#'; };
  const clear = (x, y) => { if (x >= 1 && x < w-1 && y >= 1 && y < h-1) g[y][x] = '.'; };

  switch (style) {
    case 'pillars': {
      // 柱阵：随机放置短墙段和孤柱，Ping 反射丰富
      const n = Math.floor(w * h * 0.10);
      for (let i = 0; i < n; i++) {
        const x = 2 + Math.floor(rng() * (w - 4));
        const y = 2 + Math.floor(rng() * (h - 4));
        const len = 1 + Math.floor(rng() * 3);
        const horiz = rng() > 0.5;
        for (let j = 0; j < len; j++) {
          wall(horiz ? x + j : x, horiz ? y : y + j);
        }
      }
      break;
    }
    case 'comb': {
      // 梳齿：交替上下/左右的齿状墙，形成蛇形通道
      const teeth = Math.floor(w / 4);
      for (let i = 1; i <= teeth; i++) {
        const x = 2 + i * 3;
        if (x >= w - 2) break;
        const fromTop = i % 2 === 1;
        const len = Math.floor(h * (0.5 + rng() * 0.25));
        for (let j = 1; j <= len && (fromTop ? j : h - 1 - j) > 0 && (fromTop ? j : h - 1 - j) < h - 1; j++) {
          wall(x, fromTop ? j : h - 1 - j);
        }
      }
      break;
    }
    case 'rooms': {
      // 蜂巢式房间：不规则墙段 + 策略性门 + 房间内柱
      const rw = Math.floor(w / 4), rh = Math.floor(h / 4);
      // 水平墙：不规则间距，部分段缺失
      for (let cy = 1; cy < rh; cy++) {
        const y = cy * 4 + Math.floor(rng() * 2);
        if (y >= h - 1) break;
        let x = 1;
        while (x < w - 1) {
          // 墙段长度随机 2-6
          const segLen = 2 + Math.floor(rng() * 5);
          // 跳过段（门/开口）
          const gapLen = rng() < 0.3 ? 1 + Math.floor(rng() * 2) : 0;
          for (let j = 0; j < segLen && x + j < w - 1; j++) wall(x + j, y);
          x += segLen + gapLen;
        }
      }
      // 垂直墙：类似但更稀疏
      for (let cx = 1; cx < rw; cx++) {
        const x = cx * 4 + Math.floor(rng() * 2);
        if (x >= w - 1) break;
        let y = 1;
        while (y < h - 1) {
          const segLen = 2 + Math.floor(rng() * 4);
          const gapLen = rng() < 0.35 ? 1 + Math.floor(rng() * 2) : 0;
          for (let j = 0; j < segLen && y + j < h - 1; j++) wall(x, y + j);
          y += segLen + gapLen;
        }
      }
      // 房间内柱：在开阔区加 1-3 格孤柱
      const pillarCount = Math.floor(rw * rh * 0.5);
      for (let i = 0; i < pillarCount; i++) {
        const px2 = 3 + Math.floor(rng() * (w - 6));
        const py2 = 3 + Math.floor(rng() * (h - 6));
        wall(px2, py2);
        if (rng() < 0.3) wall(px2 + 1, py2);  // 偶尔双柱
      }
      break;
    }
    case 'spiral': {
      // 螺旋壁：从外向内的弧形墙
      let x0 = 2, y0 = 2, x1 = w - 3, y1 = h - 3;
      let dir = 0; // 0→右 1→下 2→左 3→上
      while (x1 - x0 > 2 && y1 - y0 > 2) {
        if (dir === 0) { for (let x = x0; x <= x1; x++) wall(x, y0); y0 += 3; }
        else if (dir === 1) { for (let y = y0; y <= y1; y++) wall(x1, y); x1 -= 3; }
        else if (dir === 2) { for (let x = x1; x >= x0; x--) wall(x, y1); y1 -= 3; }
        else { for (let y = y1; y >= y0; y--) wall(x0, y); x0 += 3; }
        dir = (dir + 1) % 4;
      }
      // 开门
      for (let i = 0; i < 5; i++) {
        const x = 3 + Math.floor(rng() * (w - 6));
        const y = 3 + Math.floor(rng() * (h - 6));
        clear(x, y); clear(x + 1, y); clear(x, y + 1); clear(x + 1, y + 1);
      }
      break;
    }
    case 'streets': {
      // 街道网格：稀疏的横竖墙形成街区
      for (let cy = 2; cy < h - 2; cy += 4) {
        const gap1 = 2 + Math.floor(rng() * (w - 6));
        const gap2 = 2 + Math.floor(rng() * (w - 6));
        for (let x = 1; x < w - 1; x++) {
          if (Math.abs(x - gap1) > 1 && Math.abs(x - gap2) > 1) wall(x, cy);
        }
      }
      for (let cx = 2; cx < w - 2; cx += 5) {
        const gap1 = 2 + Math.floor(rng() * (h - 6));
        for (let y = 1; y < h - 1; y++) {
          if (Math.abs(y - gap1) > 1) wall(cx, y);
        }
      }
      break;
    }
    case 'random': {
      // 随机散墙：最灵活
      const n = Math.floor(w * h * 0.13);
      for (let i = 0; i < n; i++) {
        const x = 2 + Math.floor(rng() * (w - 4));
        const y = 2 + Math.floor(rng() * (h - 4));
        wall(x, y);
      }
      break;
    }
  }

  // 确保起点和终点周围开阔
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    clear(2 + dx, 2 + dy);
    clear(w - 3 + dx, h - 3 + dy);
  }

  // 加壁龛（死胡同）：在墙边打 1-2 格深的凹槽
  const targetNiches = Math.max(4, Math.floor(w * h * 0.02));
  let nichesAdded = 0, guard = 0;
  while (nichesAdded < targetNiches && guard++ < 300) {
    const x = 2 + Math.floor(rng() * (w - 4));
    const y = 2 + Math.floor(rng() * (h - 4));
    if (g[y][x] !== '.') continue;
    // 找一面墙打开（形成死胡同）
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx > 0 && ny > 0 && nx < w - 1 && ny < h - 1 && g[ny][nx] === '#';
    });
    if (!dirs.length) continue;
    const [dx, dy] = dirs[Math.floor(rng() * dirs.length)];
    const nx = x + dx, ny = y + dy;
    // 确保打开后是死胡同（nx,ny 的其他邻居仍是墙）
    let otherWalls = 0;
    for (const [ddx, ddy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      if (ddx === -dx && ddy === -dy) continue;  // 跳过来方向
      const px = nx + ddx, py = ny + ddy;
      if (px <= 0 || py <= 0 || px >= w - 1 || py >= h - 1 || g[py]?.[px] === '#') otherWalls++;
    }
    if (otherWalls >= 3) {
      g[ny][nx] = '.';
      nichesAdded++;
    }
  }
  return g;
}

/* BFS 距离场 */
function bfsDist(g, sx, sy) {
  const h = g.length, w = g[0].length;
  const dist = Array.from({ length: h }, () => Array(w).fill(-1));
  dist[sy][sx] = 0;
  const q = [[sx, sy]];
  let qi = 0;
  while (qi < q.length) {
    const [x, y] = q[qi++];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h || g[ny][nx] === '#') continue;
      if (dist[ny][nx] === -1) { dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return dist;
}

/* 关卡验证：自动检查可玩性 */
function validateLevel(g, w, h) {
  const issues = [];
  // 找 S 和 G
  let sx = -1, sy = -1, gx = -1, gy = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (g[y][x] === 'S') { sx = x; sy = y; }
    if (g[y][x] === 'G') { gx = x; gy = y; }
  }
  if (sx < 0 || gx < 0) { issues.push('no S/G'); return { valid: false, issues, pathLen: 0, niches: 0, junctions: 0 }; }
  // BFS 路径
  const dist = bfsDist(g, sx, sy);
  const pathLen = dist[gy][gx];
  if (pathLen < 0) issues.push('G unreachable');
  if (pathLen < 12) issues.push('path too short (' + pathLen + ')');
  if (pathLen > w * h * 0.5) issues.push('path too long (' + pathLen + ')');
  // 统计格型
  let junctions = 0, niches = 0, corridors = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    if (g[y][x] === '#') continue;
    let open = 0;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]])
      if (g[y + dy][x + dx] !== '#') open++;
    if (open >= 3) junctions++;
    else if (open === 1) niches++;
    else if (open === 2) corridors++;
  }
  if (junctions < 3) issues.push('too few junctions (' + junctions + ')');
  // 壁龛不强制（梳齿/螺旋结构天然少，靠环路和近距减速保可玩性）
  // 最长走廊段
  let maxRun = 0;
  for (let y = 1; y < h - 1; y++) {
    let run = 0;
    for (let x = 1; x < w - 1; x++) {
      if (g[y][x] !== '#') {
        let open = 0;
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]])
          if (g[y + dy][x + dx] !== '#') open++;
        if (open === 2) run++;
        else { maxRun = Math.max(maxRun, run); run = 0; }
      } else { maxRun = Math.max(maxRun, run); run = 0; }
    }
  }
  if (maxRun > 20) issues.push('corridor too long (' + maxRun + ' cells)');  // 螺旋允许长走廊
  return {
    valid: issues.length === 0,
    issues,
    pathLen,
    niches,
    junctions,
    maxCorridor: maxRun
  };
}

/* 关卡完成器 v3：S 在角落附近、G 在 BFS 最远处（保证路径够长） */
function finishLevel(g) {
  const h = g.length, w = g[0].length;
  // 尝试多个起点，选路径最长的
  let bestS = null, bestG = null, bestLen = 0;
  const corners = [
    [2, 2], [w - 3, 2], [2, h - 3], [w - 3, h - 3],  // 四角
    [Math.floor(w / 2), 2], [2, Math.floor(h / 2)]     // 边中点
  ];
  for (const [cx, cy] of corners) {
    if (cx < 1 || cy < 1 || cx >= w - 1 || cy >= h - 1) continue;
    if (g[cy][cx] === '#') continue;
    const dist = bfsDist(g, cx, cy);
    let fx = cx, fy = cy, maxD = 0;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      if (dist[y][x] > maxD) { maxD = dist[y][x]; fx = x; fy = y; }
    }
    if (maxD > bestLen) {
      bestLen = maxD;
      bestS = [cx, cy];
      bestG = [fx, fy];
    }
  }
  if (!bestS) {
    // 回退：第一个通路格
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++)
      if (g[y][x] !== '#') { bestS = [x, y]; y = h; break; }
    if (!bestS) bestS = [1, 1];
    const dist = bfsDist(g, bestS[0], bestS[1]);
    let maxD = 0; bestG = [bestS[0], bestS[1]];
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++)
      if (dist[y][x] > maxD) { maxD = dist[y][x]; bestG = [x, y]; }
    bestLen = maxD;
  }
  g[bestS[1]][bestS[0]] = 'S';
  g[bestG[1]][bestG[0]] = 'G';
  // 碎片
  const dist = bfsDist(g, bestS[0], bestS[1]);
  const cand = [];
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++)
    if (g[y][x] === '.' && dist[y][x] > bestLen * 0.2 && dist[y][x] > 0) cand.push([x, y, dist[y][x]]);
  cand.sort((a, b) => b[2] - a[2]);
  const picked = [];
  for (const c of cand) {
    if (picked.length >= 3) break;
    if (picked.every(p => Math.abs(p[0] - c[0]) + Math.abs(p[1] - c[1]) > 3)) picked.push(c);
  }
  picked.forEach(([x, y]) => g[y][x] = '*');
  const par = Math.round(bestLen * 1.2) + 4;
  return { par, map: g.map(r => r.join('')) };
}

/* BFS 连通性校验 + 验证报告 */
function validateLevels() {
  LEVELS.forEach((L, li) => {
    const g = L.map;
    const h = g.length, w = g[0].length;
    let start = null, goal = null;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (g[y][x] === 'S') start = [x, y];
      if (g[y][x] === 'G') goal = [x, y];
    }
    if (!start || !goal) throw new Error('level ' + li + ': missing S/G');
    const seen = new Set([start.join(',')]);
    const q = [start];
    while (q.length) {
      const [x, y] = q.shift();
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const c = g[ny][nx];
        if (c === '#') continue;
        const k = nx + ',' + ny;
        if (!seen.has(k)) { seen.add(k); q.push([nx, ny]); }
      }
    }
    if (!seen.has(goal.join(','))) throw new Error('level ' + li + ': goal unreachable');
    // #debug 输出验证报告
    if (location.hash.includes('debug')) {
      const val = validateLevel(g, w, h);
      console.log(`L${li + 1}: path=${val.pathLen} junctions=${val.junctions} niches=${val.niches} maxCorr=${val.maxCorridor} valid=${val.valid}${val.issues.length ? ' ISSUES: ' + val.issues.join('; ') : ''}`);
    }
  });
}

/* ================= 涟漪照明 ================= */
function propagate(dt) {
  for (const rp of ripples) rp.r += 9.5 * dt;
  for (let i = 0; i < lights.length; i++) lights[i] *= Math.exp(-dt * 1.1);
  if (save.recall) {
    // 余像：记录曾经照亮的峰值
    for (let i = 0; i < afterglow.length; i++)
      if (lights[i] > afterglow[i]) afterglow[i] = lights[i];
  }
  for (const rp of ripples) {
    const x0 = Math.max(0, Math.floor(rp.x - rp.r - 1));
    const x1 = Math.min(cols - 1, Math.ceil(rp.x + rp.r + 1));
    const y0 = Math.max(0, Math.floor(rp.y - rp.r - 1));
    const y1 = Math.min(rows - 1, Math.ceil(rp.y + rp.r + 1));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const d = Math.hypot(x + 0.5 - rp.x, y + 0.5 - rp.y);
      if (Math.abs(d - rp.r) < 0.75 && d <= rp.maxR) {
        const inten = (1 - d / rp.maxR) * (rp.soft ? 0.35 : 1) * 0.95;
        const idx = y * cols + x;
        if (inten > lights[idx]) lights[idx] = inten;
        if (!rp.soft && inten > 0.18 && grid[y][x] === '#') litWalls.add(x + ',' + y);
      }
    }
  }
  ripples = ripples.filter(r => r.r < r.maxR + 1.5);
}

/* ================= 渲染 ================= */
let time = 0;
function render(dt) {
  time += dt;
  const W = innerWidth, H = innerHeight;
  ctx.fillStyle = '#07090d';
  ctx.fillRect(0, 0, W, H);
  if (state === 'edit') { renderEditor(); return; }
  if (state !== 'play') return;
  const vgT = lvTheme();
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, `rgba(${vgT.vig[0]},${vgT.vig[1]},${vgT.vig[2]},0.6)`);
  const breathe = 0.85 + Math.sin(time * 2.2) * 0.15;
  const pcx = ox + (px + 0.5) * cell, pcy = oy + (py + 0.5) * cell;

  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (grid[y][x] === '#') {
      const l = lights[y * cols + x];
      const mem = save.recall ? (afterglow ? afterglow[y * cols + x] * 0.14 : 0) : 0;
      const dpx = Math.hypot(x - px, y - py);
      const near = Math.max(0, 1 - dpx / 2.2) * 0.4 * breathe;
      const a = Math.min(1, l + near + mem);
      if (a < 0.015) continue;
      const th = lvTheme();
      ctx.fillStyle = `rgba(${th.wall[0]},${th.wall[1]},${th.wall[2]},${(a * 0.92).toFixed(3)})`;
      ctx.shadowColor = `rgba(${th.glow[0]},${th.glow[1]},${th.glow[2]},0.8)`;
      ctx.shadowBlur = 14 * a;
      roundRectC(x * cell + ox + 1.5, y * cell + oy + 1.5, cell - 3, cell - 3, 3);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // 游魂：暗红微光 + 尾迹粒子
  for (const g of ghosts) {
    const d = Math.hypot(g.x - px, g.y - py);
    const near = Math.max(0, 1 - d / 3.2);
    const lit = lights[g.y * cols + g.x] * 0.9;
    const a = Math.min(1, near * 0.85 + lit);
    // 尾迹：记录路径并渲染渐隐
    if (g.t === 0) {
      g.trail.unshift([g.x, g.y]);
      if (g.trail.length > 6) g.trail.pop();
    }
    // 尾迹粒子
    for (let ti = g.trail.length - 1; ti >= 0; ti--) {
      const [tx2, ty2] = g.trail[ti];
      const fade = (1 - ti / g.trail.length) * a * 0.3;
      if (fade < 0.01) continue;
      const tcx = ox + (tx2 + 0.5) * cell, tcy = oy + (ty2 + 0.5) * cell;
      ctx.fillStyle = `rgba(214,72,72,${fade.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(tcx + Math.sin(time * 4 + ti) * cell * 0.06, tcy, cell * 0.07 * (1 - ti / g.trail.length), 0, Math.PI * 2);
      ctx.fill();
    }
    if (a < 0.02) continue;
    const gcx = ox + (g.x + 0.5) * cell, gcy = oy + (g.y + 0.5) * cell;
    const wob = Math.sin(g.phase * 3.1) * cell * 0.08;
    const gg = ctx.createRadialGradient(gcx, gcy, 0, gcx, gcy, cell * 1.1);
    gg.addColorStop(0, `rgba(214,72,72,${(a * 0.5).toFixed(3)})`);
    gg.addColorStop(1, 'rgba(214,72,72,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(gcx - cell * 1.2, gcy - cell * 1.2, cell * 2.4, cell * 2.4);
    ctx.fillStyle = `rgba(236,110,96,${(a * (0.55 + 0.25 * Math.sin(g.phase * 5))).toFixed(3)})`;
    ctx.shadowColor = 'rgba(214,72,72,0.9)';
    ctx.shadowBlur = 9 * a;
    ctx.beginPath();
    ctx.ellipse(gcx + wob, gcy, cell * 0.14, cell * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  { // 出口
    let gx = 0, gy = 0;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (grid[y][x] === 'G') { gx = x; gy = y; }
    const d = Math.hypot(gx - px, gy - py);
    goalPulse = Math.max(goalPulse * Math.exp(-dt * 0.5), lights[gy * cols + gx]);
    const nearGlow = Math.max(0, 1 - d / 3) * 0.5;
    const ga = Math.min(1, goalPulse + nearGlow + 0.04);
    if (ga > 0.02) {
      const gcx = ox + (gx + 0.5) * cell, gcy = oy + (gy + 0.5) * cell;
      const grad = ctx.createRadialGradient(gcx, gcy, 0, gcx, gcy, cell * 1.1);
      grad.addColorStop(0, `rgba(232,192,122,${(ga * 0.85).toFixed(3)})`);
      grad.addColorStop(1, 'rgba(232,192,122,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(gcx - cell * 1.2, gcy - cell * 1.2, cell * 2.4, cell * 2.4);
      ctx.fillStyle = `rgba(246,226,180,${ga.toFixed(3)})`;
      ctx.font = `${Math.round(cell * 0.52)}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(lang === 'zh' ? '出' : '⌂', gcx, gcy + 1);
    }
  }

  // 壁龛微光：安全格的暗淡凹槽标记
  if (niches && ghosts.length) {
    for (const key of niches) {
      const [nx, ny] = key.split(',').map(Number);
      const d = Math.hypot(nx - px, ny - py);
      const a = Math.max(0.03, 0.4 - d * 0.08);
      const ncx = ox + (nx + 0.5) * cell, ncy = oy + (ny + 0.5) * cell;
      ctx.strokeStyle = `rgba(127,216,208,${a.toFixed(3)})`;
      ctx.lineWidth = 1.2;
      const s = cell * 0.22;
      ctx.beginPath();
      ctx.arc(ncx, ncy, s, Math.PI * 0.15, Math.PI * 0.85);    // 下弧
      ctx.moveTo(ncx - s * 1.3, ncy + s * 0.6);
      ctx.lineTo(ncx - s * 1.3, ncy - s * 0.4);               // 左壁
      ctx.lineTo(ncx + s * 1.3, ncy - s * 0.4);               // 顶
      ctx.lineTo(ncx + s * 1.3, ncy + s * 0.6);               // 右壁
      ctx.stroke();
    }
  }

  for (const [fx, fy] of FRAG_CELLS) {
    if (fragTakenSet.has(fx + ',' + fy)) continue;
    const d = Math.hypot(fx - px, fy - py);
    const twinkle = 0.5 + 0.5 * Math.sin(time * 3 + fx * 2.1 + fy * 1.3);
    const near = Math.max(0, 1 - d / 2.4);
    const lit = lights[fy * cols + fx] * 0.8;
    const a = Math.min(1, near * 0.9 + lit);
    if (a < 0.02) continue;
    const fcx = ox + (fx + 0.5) * cell, fcy = oy + (fy + 0.5) * cell;
    ctx.fillStyle = `rgba(127,216,208,${(a * (0.55 + twinkle * 0.45)).toFixed(3)})`;
    ctx.shadowColor = 'rgba(127,216,208,0.9)';
    ctx.shadowBlur = 10 * a;
    ctx.beginPath();
    const s = cell * 0.12 * (0.8 + twinkle * 0.4);
    ctx.moveTo(fcx, fcy - s * 1.6); ctx.lineTo(fcx + s, fcy); ctx.lineTo(fcx, fcy + s * 1.6); ctx.lineTo(fcx - s, fcy);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (const rp of ripples) {
    const t = rp.r / rp.maxR;
    const a = Math.max(0, (1 - t)) * (rp.soft ? 0.14 : 0.5);
    if (a < 0.01) continue;
    ctx.strokeStyle = `rgba(157,176,201,${a.toFixed(3)})`;
    ctx.lineWidth = rp.soft ? 1 : 1.6;
    ctx.beginPath();
    ctx.arc(ox + rp.x * cell, oy + rp.y * cell, rp.r * cell, 0, Math.PI * 2);
    ctx.stroke();
  }

  const pg = ctx.createRadialGradient(pcx, pcy, 0, pcx, pcy, cell * 1.5);
  pg.addColorStop(0, `rgba(232,192,122,${(0.5 * breathe).toFixed(3)})`);
  pg.addColorStop(1, 'rgba(232,192,122,0)');
  ctx.fillStyle = pg;
  ctx.fillRect(pcx - cell * 1.6, pcy - cell * 1.6, cell * 3.2, cell * 3.2);
  ctx.fillStyle = 'rgba(246,214,150,0.95)';
  ctx.shadowColor = 'rgba(232,192,122,1)';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(pcx, pcy, cell * 0.17, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 通关金色粒子
  for (let i = winParticles.length - 1; i >= 0; i--) {
    const p = winParticles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 80 * dt;  // 重力
    p.life -= dt * 0.8;
    if (p.life <= 0) { winParticles.splice(i, 1); continue; }
    const pa = Math.min(1, p.life * 1.5);
    ctx.fillStyle = `rgba(232,192,122,${pa.toFixed(3)})`;
    ctx.shadowColor = 'rgba(232,192,122,0.9)';
    ctx.shadowBlur = 6 * pa;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // 微型小地图：仅显示已照亮区域
  {
    const mm = document.getElementById('minimap');
    const mctx2 = mm.getContext('2d');
    const th = lvTheme();
    mctx2.fillStyle = `rgba(${th.vig[0]},${th.vig[1]},${th.vig[2]},0.85)`;
    mctx2.fillRect(0, 0, mm.width, mm.height);
    const ms = Math.min(mm.width / cols, mm.height / rows);
    const mox = (mm.width - cols * ms) / 2, moy = (mm.height - rows * ms) / 2;
    mctx2.fillStyle = `rgba(${th.wall[0]},${th.wall[1]},${th.wall[2]},0.65)`;
    for (const key of litWalls) {
      const [wx, wy] = key.split(',').map(Number);
      mctx2.fillRect(mox + wx * ms, moy + wy * ms, ms, ms);
    }
    // 出口（如被照亮过）
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if (grid[y][x] === 'G' && (litWalls.has(x + ',' + y) || goalPulse > 0.1)) {
        mctx2.fillStyle = '#e8c07a';
        mctx2.fillRect(mox + x * ms - 1, moy + y * ms - 1, ms + 2, ms + 2);
      }
    }
    // 玩家
    mctx2.fillStyle = '#f6d696';
    mctx2.beginPath();
    mctx2.arc(mox + (px + 0.5) * ms, moy + (py + 0.5) * ms, Math.max(1.5, ms * 0.5), 0, Math.PI * 2);
    mctx2.fill();
    // 边框
    mctx2.strokeStyle = 'rgba(157,176,201,0.2)';
    mctx2.lineWidth = 1;
    mctx2.strokeRect(0.5, 0.5, mm.width - 1, mm.height - 1);
  }

  // 迷离红闪
  if (ghostFlash > 0) {
    ghostFlash -= dt * 1.8;
    ctx.fillStyle = `rgba(160,30,30,${(Math.max(0, ghostFlash) * 0.32).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function roundRectC(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ================= HUD / 弹层 ================= */
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

  if (state !== 'play') { document.getElementById('hud').style.display = 'none'; return; }

  }
}

/* ================= 成就 ================= */
function award(id) {
  if (save.ach[id]) return;
  const def = T().achs.find(a => a.id === id);
  if (!def) return;
  save.ach[id] = true;
  persist();
  sndAch();
  const t = document.getElementById('achToast');
  t.innerHTML = `<span class="ico">${def.ico}</span><span class="tx"><span class="n">${def.n}</span><span class="d" style="display:block">${def.d}</span></span>`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
  buildAchWall();
}
function checkAchs() {
  if (li === 0 && state === 'play') award('lv1'); // 过关时另计
  const n = save.frags.filter(Boolean).length;
  if (n >= 3) award('frag3');
  if (n >= 6) award('frag6');
}
function buildAchWall() {
  const wall = document.getElementById('achWall');
  wall.innerHTML = `<div style="grid-column:1/-1;font-size:12px;letter-spacing:0.4em;color:var(--dim,#9db0c9);opacity:.7">${T().achTitle}</div>`;
  for (const a of T().achs) {
    const d = document.createElement('div');
    d.className = 'ach' + (save.ach[a.id] ? ' got' : '');
    d.innerHTML = `<span class="ico">${a.ico}</span>${a.n}<br><span style="opacity:.75">${a.d}</span>`;
    wall.appendChild(d);
  }
}

/* ================= 过关 / 结局 ================= */
function levelClear() {
  state = 'clear';
  elapsed = performance.now() - startTime;
  sndWin();
  // 通关金色粒子：从出口迸发
  {
    let gx2 = 1, gy2 = 1;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
      if (grid[y][x] === 'G') { gx2 = x; gy2 = y; }
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.5 + Math.random() * 2;
      winParticles.push({
        x: ox + (gx2 + 0.5) * cell, y: oy + (gy2 + 0.5) * cell,
        vx: Math.cos(a) * sp * 60, vy: Math.sin(a) * sp * 60 - 40,
        life: 1, r: 2 + Math.random() * 3
      });
    }
  }
  if (isCustom) {
    // 自造之井 / 名井：不计主线存档与成就，只展示成绩
    const score = steps <= par ? 3 : steps <= par * 1.5 ? 2 : 1;
    const L = T().lantern;
    if (curWell >= 0) {
      save.wells = save.wells || {};
      const pw = save.wells[curWell];
      if (!pw || steps + pings < pw.s + pw.p) save.wells[curWell] = { s: steps, p: pings, t: Math.round(elapsed) };
      persist();
    }
    document.getElementById('clearTitle').textContent = T().clearTitle;
    document.getElementById('lanterns').innerHTML =
      L.map((c, i) => `<span class="${i < score ? '' : 'off'}">${c}</span>`).join('');
    document.getElementById('clearStats').innerHTML =
      `${T().steps}：${steps}　·　${T().pings}：${pings}　·　${T().time}：${fmtTime(elapsed)}<br>${customName}`;
    document.getElementById('nextBtn').textContent = customFrom === 'editor'
      ? (lang === 'zh' ? '回 到 造 井' : 'BACK TO BUILD')
      : T().toMenu;
    document.getElementById('heatLbl').textContent = T().heatLbl;
    drawHeat();
    document.getElementById('clearOv').classList.add('show');
    return;
  }
  // 跨站统计
  save.statsExt = Object.assign({ clears: 0, dailyClears: 0 }, save.statsExt);
  save.statsExt.clears++;
  if (isDaily) save.statsExt.dailyClears++;
  if (!isDaily) {
    if (li + 1 > save.unlocked) save.unlocked = li + 1;
  } else {
    save.daily = { date: todayKey(), done: true };
  }
  // 探索率
  const exp = Math.round(litWalls.size / Math.max(1, totalWalls) * 100);
  const prev = save.best[keyOf()];
  if (!prev || steps + pings < prev.s + prev.p) save.best[keyOf()] = { s: steps, p: pings, t: Math.round(elapsed), exp };
  else save.best[keyOf()].exp = Math.max(save.best[keyOf()].exp, exp);
  if (!isDaily && li >= LEVELS.length) {
    save.best.endless = save.best.endless || { s: 0 };
    save.best.endless.s = Math.max(save.best.endless.s, li - 5);
  }
  persist();

  const score = steps <= par ? 3 : steps <= par * 1.5 ? 2 : 1;
  if (score === 3) award('par');
  if (steps < par) award('swift');
  if (ghosts.length > 0 && lostCount === 0) award('ghostless');
  save.parStreak = score === 3 ? (save.parStreak || 0) + 1 : 0;
  if (save.parStreak >= 3) award('streak3');
  persist();
  if (isDaily) award('daily');
  if (!isDaily && li === 0) award('lv1');
  if (!isDaily && li === LEVELS.length - 1) award('all');
  const n = save.frags.filter(Boolean).length;
  if (n >= 3) award('frag3');
  if (n >= 6) award('frag6');

  const L = T().lantern;
  document.getElementById('clearTitle').textContent = T().clearTitle;
  document.getElementById('lanterns').innerHTML =
    L.map((c, i) => `<span class="${i < score ? '' : 'off'}">${c}</span>`).join('');
  const nm = isDaily ? T().dailyTitle : lvName(li);
  document.getElementById('clearStats').innerHTML =
    `${T().steps}：${steps}　·　${T().pings}：${pings}　·　${T().time}：${fmtTime(elapsed)}<br>` +
    `${T().exp}：${exp}%　·　${nm}`;
  if (!isDaily && li >= 10) award('abyss');
  document.getElementById('nextBtn').textContent =
    isDaily ? T().toMenu
    : li >= LEVELS.length ? T().next
    : (li + 1 < LEVELS.length ? T().next : (lang === 'zh' ? '归 途 尽 头' : 'THE END'));
  document.getElementById('heatLbl').textContent = T().heatLbl;
  drawHeat();
  document.getElementById('clearOv').classList.add('show');
}
function drawHeat() {
  const hc = document.getElementById('heatCv');
  if (!hc || !visits) return;
  const g2 = hc.getContext('2d');
  const scale = Math.min(hc.width / cols, hc.height / rows);
  const offx = (hc.width - cols * scale) / 2, offy = (hc.height - rows * scale) / 2;
  g2.fillStyle = 'rgba(7,9,13,1)';
  g2.fillRect(0, 0, hc.width, hc.height);
  let maxV = 1;
  for (let i = 0; i < visits.length; i++) if (visits[i] > maxV) maxV = visits[i];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const c = grid[y][x];
    const v = visits[y * cols + x] / maxV;
    if (c === '#') {
      g2.fillStyle = 'rgba(40,48,62,0.55)';
      g2.fillRect(offx + x * scale, offy + y * scale, scale, scale);
    } else if (v > 0) {
      const a = 0.22 + v * 0.78;
      g2.fillStyle = `rgba(232,192,122,${a.toFixed(3)})`;
      g2.fillRect(offx + x * scale + 0.5, offy + y * scale + 0.5, Math.max(1, scale - 1), Math.max(1, scale - 1));
    } else {
      g2.fillStyle = 'rgba(157,176,201,0.05)';
      g2.fillRect(offx + x * scale, offy + y * scale, scale, scale);
    }
  }
}
function keyOf() { return isDaily ? 'daily' : li; }

function showEnding() {
  state = 'end';
  hideAll();
  const poem = document.getElementById('poem');
  const src = lang === 'zh' ? FRAGS.zh : FRAGS.en;
  let html = '';
  src.forEach((line, i) => {
    const got = save.frags[i];
    html += `<div class="${got ? '' : 'miss'}">${got ? line : (lang === 'zh' ? '· · ·' : '· · ·')}</div>`;
  });
  const total = save.frags.filter(Boolean).length;
  document.querySelector('#endOv [data-t="endSub"]').innerHTML =
    T().endSub + `<br><span style="color:var(--cyan)">${T().fragGot} ${total} ${T().of} ${src.length}</span>`;
  poem.innerHTML = html;
  document.getElementById('endOv').classList.add('show');
  document.getElementById('hud').style.display = 'none';
}

/* ================= 菜单 ================= */
function buildLevelGrid() {
  const box = document.getElementById('levels');
  box.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'lv';
    const locked = i > save.unlocked;
    b.disabled = locked;
    const best = save.best[i];
    const parts = T().lvNames[i].split(' · ');
    b.innerHTML = `<div class="n">${parts[0]}</div>
      <div class="t">${locked ? T().locked : parts[1]}</div>
      <div class="b">${best ? `${T().best} ${best.s}${lang === 'zh' ? '步' : 's'} · ${fmtTime(best.t)}` : ''}</div>`;
    if (!locked) b.addEventListener('click', () => loadLevel(i));
    box.appendChild(b);
  });
  // 无尽入口：通关「九 · 门」即解锁（穿门后 10-12 层为登塔终章）
  const eb = document.createElement('button');
  eb.className = 'lv';
  const eLocked = save.unlocked < 9;
  eb.disabled = eLocked;
  eb.innerHTML = `<div class="n">∞</div>
    <div class="t">${eLocked ? T().locked : (lang === 'zh' ? '无底之井' : 'Bottomless')}</div>
    <div class="b">${save.best['endless'] ? `${T().best} ${lang === 'zh' ? '第' : 'D'}${save.best['endless'].s}` : ''}</div>`;
  if (!eLocked) eb.addEventListener('click', () => loadLevel(LEVELS.length));
  box.appendChild(eb);
}
function buildWells() {
  const row = document.getElementById('wellRow');
  row.innerHTML = `<div style="width:100%;text-align:center;font-size:11px;letter-spacing:0.4em;color:rgba(232,192,122,0.55)">${T().wellsLbl}</div>`;
  WELL_PACK.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'well-chip';
    const best = save.wells && save.wells[i];
    b.innerHTML = (lang === 'zh' ? w.name : w.nameEn) +
      (best ? `<small>${best.s <= w.par ? '🏆 ' : ''}${T().wellsBest(best)}</small>` : `<small>par ${w.par}${w.ghosts ? ' · 👻' + w.ghosts : ''}</small>`);
    b.addEventListener('click', () => playWell(i));
    row.appendChild(b);
  });
}
function updateDailyBtn() {
  const b = document.getElementById('dailyBtn');
  const done = save.daily && save.daily.date === todayKey() && save.daily.done;
  b.textContent = done ? T().dailyDone : T().daily;
  b.classList.toggle('done', !!done);
}

/* ================= 输入 ================= */
window.addEventListener('keydown', e => {
  if (e.repeat && state === 'play' && moveCooldown > 0) return;
  const k = e.key;
  const map = { ArrowUp: [0,-1], w: [0,-1], W: [0,-1], ArrowDown: [0,1], s: [0,1], S: [0,1],
                ArrowLeft: [-1,0], a: [-1,0], A: [-1,0], ArrowRight: [1,0], d: [1,0], D: [1,0] };
  if (map[k]) {
    e.preventDefault();
    if (state === 'play') { tryMove(...map[k]); moveCooldown = 0.11; }
  } else if (k === ' ') {
    e.preventDefault();
    ping();
  } else if (k === 'Enter' && state === 'menu') {
    loadLevel(0);
  }
});
window.addEventListener('keyup', () => moveCooldown = 0);

let touchStart = null;
cv.addEventListener('pointerdown', e => {
  if (editor.on) return;
  touchStart = [e.clientX, e.clientY];
});
/* 拖行连走：按住不放拖动，每滑过 26px 走一步（移动端核心操作） */
cv.addEventListener('pointermove', e => {
  if (!touchStart || editor.on || state !== 'play') return;
  const dx = e.clientX - touchStart[0], dy = e.clientY - touchStart[1];
  if (Math.hypot(dx, dy) < 26) return;
  if (Math.abs(dx) > Math.abs(dy)) tryMove(Math.sign(dx), 0);
  else tryMove(0, Math.sign(dy));
  touchStart = [e.clientX, e.clientY];
});
cv.addEventListener('pointerup', e => {
  if (!touchStart || editor.on) return;
  const dx = e.clientX - touchStart[0], dy = e.clientY - touchStart[1];
  const dist = Math.hypot(dx, dy);
  if (state === 'play') {
    if (dist > 30) {
      if (Math.abs(dx) > Math.abs(dy)) tryMove(Math.sign(dx), 0);
      else tryMove(0, Math.sign(dy));
    } else {
      ping((e.clientX - ox) / cell, (e.clientY - oy) / cell);
    }
  }
  touchStart = null;
});

/* ================= 按钮 ================= */
document.getElementById('startBtn').addEventListener('click', () => loadLevel(0));
document.getElementById('dailyBtn').addEventListener('click', () => loadLevel(0, true));
document.getElementById('retryBtn').addEventListener('click', () => {
  if (isCustom) { edPlay(); return; }
  loadLevel(li, isDaily);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (isCustom) {
    isCustom = false;
    if (customFrom === 'editor') edEnter(editor.map.length ? { rows: editor.map.map(r => r.join('')), frags: edFragTexts } : null);
    else document.getElementById('menuBtn').click();
    return;
  }
  if (isDaily) { document.getElementById('menuBtn').click(); return; }
  if (li >= LEVELS.length) { loadLevel(li + 1); return; }   // 无尽继续
  if (li + 1 < LEVELS.length) loadLevel(li + 1);
  else showEnding();
});
document.getElementById('againBtn').addEventListener('click', () => { save.frags = []; persist(); loadLevel(0); });
document.getElementById('menuBtn').addEventListener('click', () => {
  // 造井试玩中「回廊」= 返回编辑器（草稿原地保留），而非主菜单
  if (isCustom && customFrom === 'editor') {
    isCustom = false;
    edEnter(editor.map.length ? { rows: editor.map.map(r => r.join('')), frags: edFragTexts } : null);
    return;
  }
  state = 'menu'; hideAll();
  document.getElementById('hud').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  buildLevelGrid(); buildAchWall(); updateDailyBtn(); buildWells();
  document.getElementById('menuOv').classList.add('show');
});
document.getElementById('clearMenuBtn').addEventListener('click', () => document.getElementById('menuBtn').click());
document.getElementById('endMenuBtn').addEventListener('click', () => document.getElementById('menuBtn').click());
const sndBtn = document.getElementById('sndBtn');
function updSnd() { sndBtn.textContent = save.snd ? T().sndOn : T().sndOff; }
sndBtn.addEventListener('click', () => { save.snd = !save.snd; persist(); updSnd(); });
const recallBtn = document.getElementById('recallBtn');
function updRecall() {
  recallBtn.textContent = save.recall ? T().recallOn : T().recallOff;
  recallBtn.title = T().recallTip;
}
recallBtn.addEventListener('click', () => {
  save.recall = !save.recall; persist(); updRecall();
  if (!save.recall && afterglow) afterglow.fill(0);
});
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('echo-lang', lang);
  applyI18n(); updSnd();
});

/* ================= 主循环 ================= */
let prev = performance.now();
let echoHidden = false;
document.addEventListener('visibilitychange', () => {
  echoHidden = document.hidden;
  if (!echoHidden) prev = performance.now();
});
function frame(now) {
  requestAnimationFrame(frame);
  if (echoHidden) return;
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  if (state === 'play') {
    elapsed = performance.now() - startTime;
    if (Math.floor(elapsed / 1000) % 2 === 0) updateHud();
    propagate(dt);
    updateGhostHum(now);
    moveGhosts(dt);
    if (moveCooldown > 0) moveCooldown -= dt;
  }
  // 仅游玩/编辑时渲染：菜单与结算浮层不透明，其后逐帧重绘纯耗电
  if (state === 'play' || state === 'edit') render(dt);
}

/* ================= 启动 ================= */
applyI18n();
updSnd();
updRecall();
const m = location.hash.match(/^#lv(\d+)/);
if (m) loadLevel(+m[1]);   // N ≥ 12 → 无尽层
// #dbg=daily：无头自检直达每日深潜
if (location.hash.includes('dbg=daily')) loadLevel(0, true);
// #edit 或 #edit=<关卡码> 直达编辑器
const em = location.hash.match(/^#edit(?:=([A-Za-z0-9+/=]+))?$/);
if (em) {
  const dec = em[1] ? edDecode(em[1]) : null;
  if (!em[1] || dec) edEnter(dec);
}
requestAnimationFrame(frame);
</script>
