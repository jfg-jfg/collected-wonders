<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f2e7">

<meta property="og:title" content="墨 · INK — 水墨流体画室">

<meta property="og:type" content="website">
<meta name="description" content="手写 WebGL2 流体力学：缓行则浓，疾书则淡。八色墨、三纸质、题款装裱、朱印带走">
<title>墨 · INK — 水墨流体画室</title>
<style>
  html { color-scheme: light; }
  :root {
    --ink: #2b2b33;
    --ink-light: #55555f;
    --paper: #f6f2e7;
    --seal: #b03a2e;
    --hairline: rgba(43, 43, 51, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { z-index: 1; }
  #overlay { z-index: 2; pointer-events: none; }

  /* ---------- 笔刷预览光标 ---------- */
  #brushCursor {
    position: fixed; z-index: 3; border-radius: 50%;
    border: 1.5px solid rgba(43,43,51,0.5);
    box-shadow: 0 0 0 1px rgba(246,242,231,0.6);
    pointer-events: none; display: none;
    transform: translate(-50%, -50%);
  }
  #brushCursor.water { border-style: dashed; border-color: rgba(90,120,170,0.6); }

  /* ---------- 标题 ---------- */
  .masthead {
    position: fixed; top: 26px; left: 32px; z-index: 5;
    pointer-events: none; line-height: 1.35;
  }
  .masthead h1 {
    font-size: clamp(26px, 3.6vw, 40px);
    font-weight: 600; letter-spacing: 0.12em;
    color: var(--ink);
  }
  .masthead h1 .en { font-family: Georgia, serif; font-weight: 400; font-style: italic; font-size: 0.62em; letter-spacing: 0.08em; color: var(--ink-light); margin-left: 0.4em; }
  .masthead .sub { font-size: 12.5px; color: var(--ink-light); letter-spacing: 0.35em; margin-top: 5px; }
  .masthead .rule { width: 64px; height: 1px; background: var(--hairline); margin-top: 9px; }

  /* ---------- 顶部右侧 ---------- */
  .topright { position: fixed; top: 26px; right: 32px; z-index: 6; display: flex; gap: 10px; align-items: center; }
  .btn-ghost {
    border: 1px solid var(--hairline); background: rgba(246,242,231,0.75);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--ink);
    font-family: inherit; font-size: 13px; letter-spacing: 0.1em;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s;
  }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #langBtn { min-width: 58px; text-align: center; }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 10px;
    padding: 13px 20px 12px; border: 1px solid var(--hairline); border-radius: 16px;
    background: rgba(246,242,231,0.86); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(43,43,51,0.10);
    max-width: min(96vw, 900px);
  }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .grp .lbl { font-size: 12px; letter-spacing: 0.2em; color: var(--ink-light); margin-right: 3px; }
  .vsep { width: 1px; height: 24px; background: var(--hairline); align-self: center; }

  .chip {
    border: 1px solid var(--hairline); background: none; color: var(--ink-light);
    font-family: inherit; font-size: 12.5px; letter-spacing: 0.1em;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s, box-shadow .2s;
  }
  .chip:hover { color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .pig {
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(246,242,231,0.9); outline: 1px solid var(--hairline);
    padding: 0; transition: box-shadow .2s, transform .2s;
  }
  .pig.on { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); transform: scale(1.08); }

  .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl label { font-size: 12px; letter-spacing: 0.2em; color: var(--ink-light); white-space: nowrap; }
  .ctrl input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 104px; height: 2px; background: var(--hairline); border-radius: 2px; outline: none; cursor: pointer;
  }
  .ctrl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--paper);
    box-shadow: 0 1px 4px rgba(43,43,51,0.35); cursor: grab;
  }
  .ctrl input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--paper); cursor: grab;
  }
  .ctrl .val { font-size: 11px; color: var(--ink-light); min-width: 30px; text-align: right; font-family: Georgia, serif; }
  .ctrl input[type=text] {
    border: 1px solid var(--hairline); background: rgba(255,252,244,0.5);
    color: var(--ink); font-family: inherit; font-size: 13px; letter-spacing: 0.12em;
    padding: 5px 10px; border-radius: 6px; outline: none; width: 108px;
  }
  .ctrl input[type=text]:focus { border-color: var(--ink); }

  .btn {
    border: 1px solid transparent; background: none; color: var(--ink);
    font-family: inherit; font-size: 13px; letter-spacing: 0.18em;
    padding: 7px 14px; border-radius: 9px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(43,43,51,0.08); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.seal-on { background: var(--seal); color: #fff; }
  #saveBtn { border-color: var(--hairline); }

  /* ---------- 提示 ---------- */
  .hint {
    position: fixed; left: 50%; bottom: 168px; transform: translateX(-50%);
    z-index: 5; font-size: 13px; letter-spacing: 0.32em; color: var(--ink-light);
    pointer-events: none; opacity: 1; transition: opacity 1.6s ease;
    white-space: nowrap;
  }
  .hint.gone { opacity: 0; }

  /* ---------- 帮助 ---------- */
  .help {
    position: fixed; top: 84px; right: 32px; z-index: 7;
    width: 286px; padding: 18px 20px;
    border: 1px solid var(--hairline); border-radius: 12px;
    background: rgba(246,242,231,0.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 12.5px; line-height: 2.05; color: var(--ink);
    box-shadow: 0 10px 40px rgba(43,43,51,0.12);
    display: none;
  }
  .help.show { display: block; }
  .help h3 { font-size: 12px; letter-spacing: 0.3em; color: var(--ink-light); font-weight: 400; margin-bottom: 6px; }
  .help .k { display: inline-block; min-width: 88px; color: var(--ink-light); }
  .help b { font-weight: 600; }
  .help .sec { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--hairline); }

  body.seal-mode #gl { cursor: crosshair; }
  body.seal-mode #brushCursor { display: none !important; }

  .home-link {
    position: fixed; left: 30px; bottom: 30px; z-index: 6;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--hairline); background: rgba(246,242,231,0.75); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: var(--ink-light); display: grid; place-items: center;
    font-size: 16px; text-decoration: none; transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .home-link:hover { color: var(--ink); border-color: var(--ink); transform: translateY(-3px); }

  /* ---------- 画册 ---------- */
  .album {
    position: fixed; inset: 0; z-index: 12; display: none;
    align-items: center; justify-content: center;
    background: rgba(43,43,51,0.32); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    padding: 20px;
  }
  .album.show { display: flex; }
  .album .box {
    width: min(680px, 94vw); max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
    border: 1px solid var(--hairline); border-radius: 16px;
    background: rgba(246,242,231,0.97); padding: 26px 26px 22px;
    box-shadow: 0 24px 70px rgba(43,43,51,0.35);
  }
  .album h3 { font-size: 14px; letter-spacing: 0.4em; color: var(--ink-light); font-weight: 400; }
  .album .slots { margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .slot {
    position: relative; aspect-ratio: 1.25; border: 1px solid var(--hairline); border-radius: 8px;
    background: rgba(255,252,244,0.5); cursor: pointer; overflow: hidden;
    display: grid; place-items: center;
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .slot:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43,43,51,0.14); }
  .slot img { width: 100%; height: 100%; object-fit: cover; }
  .slot .empty { font-size: 22px; color: rgba(43,43,51,0.25); }
  .slot .ts {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 10px; letter-spacing: 0.08em; color: var(--paper);
    background: rgba(43,43,51,0.55); padding: 3px 6px; text-align: center;
    font-family: Georgia, serif;
  }
  .slot .del {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
    border-radius: 50%; border: none; background: rgba(43,43,51,0.55); color: var(--paper);
    font-size: 11px; line-height: 1; cursor: pointer; display: none;
  }
  .slot:hover .del { display: block; }
  .album .acts { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }

  #fallback {
    position: fixed; inset: 0; z-index: 20; display: none;
    place-items: center; text-align: center; padding: 40px;
    background: var(--paper); font-size: 15px; line-height: 2; letter-spacing: 0.1em;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* 横屏/矮屏：工具栏限高可滚，保住纸面 */
  @media (max-height: 540px) {
    .toolbar { max-height: 52vh; overflow-y: auto; scrollbar-width: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  @media (max-width: 640px) {
    .masthead { top: 14px; left: 14px; }
    .masthead h1 { font-size: 24px; }
    .topright { top: 14px; right: 14px; }
    .toolbar { padding: 8px 8px 7px; gap: 6px; bottom: 10px; border-radius: 12px; }
    /* 每组独占一行、组内横向滑动，替代 8 行堆叠占满画布 */
    .row { gap: 6px; flex-wrap: wrap; }
    .grp { gap: 4px; flex-wrap: nowrap; flex: 0 0 auto; width: 100%; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .grp::-webkit-scrollbar { display: none; }
    .vsep { display: none; }
    .grp .lbl { font-size: 10.5px; letter-spacing: 0.12em; position: sticky; left: 0; background: rgba(246,242,231,0.92); padding-right: 6px; z-index: 1; }
    .chip { font-size: 11px; padding: 4px 8px; letter-spacing: 0.04em; flex: 0 0 auto; }
    .pig { width: 20px; height: 20px; }
    .ctrl label { font-size: 10.5px; letter-spacing: 0.12em; }
    .ctrl input[type=range] { width: 70px; }
    .ctrl input[type=text] { width: 74px; font-size: 11.5px; padding: 4px 7px; }
    .ctrl .val { display: none; }
    .btn { font-size: 11.5px; padding: 6px 9px; letter-spacing: 0.1em; }
    .vsep { display: none; }
    .hint { bottom: 178px; font-size: 11px; letter-spacing: 0.18em; }
    .help { width: min(86vw, 286px); right: 14px; }
    .home-link { left: 14px; bottom: 14px; width: 36px; height: 36px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>
<div id="brushCursor"></div>

<header class="masthead">
  <h1>墨<span class="en">INK</span></h1>
  <div class="sub" data-i18n="subtitle"></div>
  <div class="rule"></div>
</header>

<div class="topright">
  <button class="btn-ghost" id="helpBtn" data-i18n="help">?</button>
  <button class="btn-ghost" id="langBtn">EN</button>
</div>

<div class="help" id="helpPanel">
  <h3 data-i18n="helpTitle"></h3>
  <div><span class="k" data-i18n="hDrawK"></span><span data-i18n="hDraw"></span></div>
  <div><span class="k" data-i18n="hSpeedK"></span><span data-i18n="hSpeed"></span></div>
  <div><span class="k" data-i18n="hBrushK"></span><span data-i18n="hBrush"></span></div>
  <div><span class="k" data-i18n="hWaterK"></span><span data-i18n="hWater"></span></div>
  <div><span class="k" data-i18n="hSealK"></span><span data-i18n="hSeal"></span></div>
  <div class="sec">
    <div><span class="k">[ ]</span><span data-i18n="hSize"></span></div>
    <div><span class="k">1 – 4</span><span data-i18n="hBrushKeys"></span></div>
    <div><span class="k">Z / Ctrl+Z</span><span data-i18n="hUndo"></span></div>
    <div><span class="k">C</span><span data-i18n="hColor"></span></div>
    <div><span class="k" data-i18n="hAutoK"></span><span data-i18n="hAuto"></span></div>
  <div><span class="k" data-i18n="hZoomK"></span><span data-i18n="hZoom"></span></div>
  <div><span class="k">W / S</span><span data-i18n="hWash"></span></div>
  <div><span class="k">E</span><span data-i18n="hEco"></span></div>
  </div>
</div>

<div class="toolbar">
  <div class="row">
    <div class="grp" id="brushGrp"><span class="lbl" data-i18n="brushLbl"></span></div>
    <div class="vsep"></div>
    <div class="grp" id="pigGrp"><span class="lbl" data-i18n="inkLbl"></span></div>
    <div class="vsep"></div>
    <div class="grp" id="paperGrp"><span class="lbl" data-i18n="paperLbl"></span></div>
  </div>
  <div class="row">
    <div class="ctrl">
      <label for="brushSize" data-i18n="brush"></label>
      <input type="range" id="brushSize" min="0.02" max="1.4" step="0.01" value="0.5">
      <span class="val" id="brushSizeVal"></span>
    </div>
    <div class="ctrl">
      <label for="inkDensity" data-i18n="density"></label>
      <input type="range" id="inkDensity" min="0.2" max="1.6" step="0.05" value="0.9">
    </div>
    <div class="vsep"></div>
    <div class="ctrl">
      <label for="inscText" data-i18n="inscLbl"></label>
      <input type="text" id="inscText" maxlength="10" autocomplete="off">
    </div>
    <button class="chip on" id="frameBtn" data-i18n="frame"></button>
    <div class="vsep"></div>
    <button class="btn" id="ecoBtn" data-i18n="eco" title="低算力模式"></button>
    <button class="btn" id="undoBtn" data-i18n="undo"></button>
    <button class="btn" id="washBtn" data-i18n="wash"></button>
    <button class="btn" id="sealBtn" data-i18n="seal"></button>
    <button class="btn" id="sealUpBtn" data-i18n="sealUp"></button>
    <button class="btn" id="sealResetBtn" data-i18n="sealReset" style="display:none"></button>
    <button class="btn" id="saveBtn" data-i18n="save"></button>
    <button class="btn" id="albumBtn" data-i18n="album"></button>
  </div>
</div>

<div class="hint" id="hint" data-i18n="hint"></div>
<input type="file" id="sealUpload" accept="image/*" style="display:none">

<div class="album" id="albumOv">
  <div class="box">
    <h3 id="albumTitle"></h3>
    <div class="slots" id="albumSlots"></div>
    <div class="acts">
      <button class="chip" id="albumSave" style="border-color:var(--ink); color:var(--ink)"></button>
      <button class="chip" id="albumScroll"></button>
      <button class="chip" id="albumClose"></button>
    </div>
  </div>
</div>

<a class="home-link" href="../index.html" title="拾遗 · 序">序</a>

<div id="fallback"><div data-i18n="fallback"></div></div>

<script>
'use strict';
window.addEventListener('error', e => {
  const f = document.getElementById('fallback');
  if (f) { f.style.display = 'grid'; f.textContent = 'ERR: ' + e.message + ' @' + (e.lineno || '?'); }
});

  for (let i = 0; i < 26; i++) {
    const x = rnd() * size, y = rnd() * size, r = 60 + rnd() * 220;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(190,178,150,0.028)');
    g.addColorStop(1, 'rgba(190,178,150,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  return c;
}

/* 纸质档案：影响流体手感与纹理（force = 纸面阻力，越高越吃笔） */

/* ---------------- 墨色 ---------------- */
const INKS = [
  { tint: 0.0 },      // 玄墨
  { tint: 0.145 },    // 花青
  { tint: 0.285 },    // 靛青
  { tint: 0.43 },     // 石绿
  { tint: 0.57 },     // 藤黄
  { tint: 0.715 },    // 赭石
  { tint: 0.855 },    // 紫檀
  { tint: 1.0 }       // 朱砂
];
const INK_CSS = ['#3a3d44', '#3d6a8a', '#4d6794', '#4a8a5a', '#a08a30', '#7f5c3d', '#6a4070', '#a33626'];
let inkIdx = 0;

/* ---------------- 颜料色带 LUT（八驻点，长按色点可自定） ---------------- */
/* 驻点 = 原 GLSL pigment() 的 8 色；tint 值即驻点位置（染料 G/R 混色轴） */
const PIG_STOPS = [
  { t: 0.0,    c: [0.44, 0.46, 0.53] },  // 玄墨
  { t: 0.145,  c: [0.30, 0.50, 0.62] },  // 花青
  { t: 0.285,  c: [0.30, 0.40, 0.58] },  // 靛青
  { t: 0.43,   c: [0.32, 0.52, 0.38] },  // 石绿
  { t: 0.57,   c: [0.62, 0.52, 0.22] },  // 藤黄
  { t: 0.715,  c: [0.50, 0.36, 0.24] },  // 赭石
  { t: 0.855,  c: [0.44, 0.28, 0.48] },  // 紫檀
  { t: 1.0,    c: [0.64, 0.21, 0.15] }   // 朱砂
];
const lutCanvas = document.createElement('canvas');
lutCanvas.width = 256; lutCanvas.height = 1;
const lutTex = gl.createTexture();
function smooth01(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function rebuildLut() {
  const c2 = lutCanvas.getContext('2d');
  const img = c2.createImageData(256, 1);
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    let col = PIG_STOPS[0].c;
    for (let s = 0; s < PIG_STOPS.length - 1; s++) {
      const a = PIG_STOPS[s], b = PIG_STOPS[s + 1];
      if (x >= a.t && x <= b.t) {
        const k = smooth01(a.t, b.t, x);
        col = [a.c[0] + (b.c[0] - a.c[0]) * k, a.c[1] + (b.c[1] - a.c[1]) * k, a.c[2] + (b.c[2] - a.c[2]) * k];
        break;
      }
    }
    img.data[i * 4] = Math.round(col[0] * 255);
    img.data[i * 4 + 1] = Math.round(col[1] * 255);
    img.data[i * 4 + 2] = Math.round(col[2] * 255);
    img.data[i * 4 + 3] = 255;
  }
  c2.putImageData(img, 0, 0);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, lutTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, lutCanvas);
}
/* 自定义墨色持久化：hex 数组（null = 保持默认） */
function hex2rgb(h) {
  return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
}
function applyCustomPalette() {
  let pal = null;
  try { pal = JSON.parse(localStorage.getItem('ink-palette') || 'null'); } catch (e) {}
  if (!Array.isArray(pal)) return;
  pal.forEach((h, i) => {
    if (h && i < PIG_STOPS.length) {
      PIG_STOPS[i].c = hex2rgb(h);
      INK_CSS[i] = h;
    }
  });
}
applyCustomPalette();
rebuildLut();

/* ---------------- 模拟参数 ---------------- */
const config = {
  VELOCITY_DISSIPATION: 0.045,  // 更慢：墨水扩散更渐进
  PRESSURE: 0.8,
  SPLAT_FORCE: 4800,            // 降低推动力：减少飞溅
  idleDrop: true
};
let brushSize = 0.5, inkDensity = 0.9;
let brushType = 0; // 0圆 1硬 2泼 3水
const BRUSHES = [
  { force: 1.0,  radiusMul: 1.0,  dyeMul: 1.0 },
  { force: 0.45, radiusMul: 0.42, dyeMul: 1.35 },
  { force: 0.7,  radiusMul: 1.25, dyeMul: 0.8 },
  { force: 0.85, radiusMul: 1.05, dyeMul: 1.0 }
];
const brushRadius = () => (0.0004 + Math.pow(brushSize, 1.75) * 0.055) * BRUSHES[brushType].radiusMul;
/* 纸面视图：缩放与平移（dye-uv 空间） */
const view = { zoom: 1, cx: 0.5, cy: 0.5 };
function resetView() { view.zoom = 1; view.cx = 0.5; view.cy = 0.5; renderSeals(); }
/* 屏幕 uv → 纸面 uv */
function screenToDye(u, v) {
  return [(u - 0.5) / view.zoom + view.cx, (v - 0.5) / view.zoom + view.cy];
}

/* ---------------- 撤销栈 ---------------- */
const undoStack = [];
function snapshotDye() {
  const t = createFBO(dye.width, dye.height);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, dye.read.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, t.fbo);
  gl.blitFramebuffer(0, 0, dye.width, dye.height, 0, 0, dye.width, dye.height,
                     gl.COLOR_BUFFER_BIT, gl.NEAREST);
  undoStack.push({ tex: t, seals: seals.slice() });   // 印章随染料一并快照
  if (undoStack.length > 8) {
    const old = undoStack.shift();
    gl.deleteTexture(old.tex.texture); gl.deleteFramebuffer(old.tex.fbo);
  }
  updateUndoBtn();
}
function undo() {
  if (!undoStack.length) return;
  const snap = undoStack.pop();
  const t = snap.tex;
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, t.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dye.read.fbo);
  gl.blitFramebuffer(0, 0, dye.width, dye.height, 0, 0, dye.width, dye.height,
                     gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.deleteTexture(t.texture); gl.deleteFramebuffer(t.fbo);
  seals = snap.seals.slice();   // 洗纸清掉的印章，撤销时一并恢复
  renderSeals();
  updateUndoBtn();
}
function updateUndoBtn() {
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
}

/* ---------------- Splat ---------------- */
function splat(x, y, dx, dy, dyeAmt, radiusScale, tint, wet) {
  const r = brushRadius() * (radiusScale || 1);
  const tt = tint === undefined ? INKS[inkIdx].tint : tint;
  const amt = dyeAmt * BRUSHES[brushType].dyeMul;
  const P = PAPERS[paperIdx];
  // 纸面阻力：生宣吃笔最顺（force 大 → 阻力小），熟宣涩，绢本居中
  const paperForce = 1.15 - P.force;
  // 各向异性：硬笔沿运笔方向拉伸 2.4 倍（出锋）
  const aniso = brushType === 1 ? 2.4 : 1.0;
  const dl = Math.hypot(dx, dy);
  const dirX = dl > 1e-6 ? dx / dl : 0;
  const dirY = dl > 1e-6 ? dy / dl : 1;
  gl.useProgram(progSplat.p);
  gl.uniform2f(progSplat.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progSplat.uni.uTarget, velocity.read.attach(0));
  gl.uniform1f(progSplat.uni.aspectRatio, aspect);
  gl.uniform2f(progSplat.uni.point, x, y);
  gl.uniform3f(progSplat.uni.color, dx * BRUSHES[brushType].force * paperForce, dy * BRUSHES[brushType].force * paperForce, 0);
  gl.uniform1f(progSplat.uni.radius, r * 0.6);
  gl.uniform2f(progSplat.uni.uDir, dirX, dirY);
  gl.uniform1f(progSplat.uni.uAniso, aniso);
  blit(velocity.write); velocity.swap();

  gl.uniform2f(progSplat.uni.texelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(progSplat.uni.uTarget, dye.read.attach(0));
  /* B 通道 = 湿度：供显示层做湿边加深与积墨颗粒（随 uWetDecay 蒸发） */
  gl.uniform3f(progSplat.uni.color, amt * P.splatMul, amt * P.splatMul * tt, wet || 0);
  gl.uniform1f(progSplat.uni.radius, r);
  blit(dye.write); dye.swap();
}

/* ---------------- 笔触 ---------------- */
let pointerDown = false, lastX = 0, lastY = 0, lastT = 0;
let strokeLen = 0, strokePhase = 0;   // 笔画累计长度 / 枯笔丝缕的随机相位
let lastInteract = performance.now();
const hintEl = document.getElementById('hint');
const cursorEl = document.getElementById('brushCursor');

function evtPos(e) {
  const r = canvas.getBoundingClientRect();
  const u = (e.clientX - r.left) / r.width;
  const v = 1 - (e.clientY - r.top) / r.height;
  return screenToDye(u, v);
}
function pressureOf(e) {
  return (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
}
/* 画笔倾斜：数位笔 tiltX/tiltY（-90~90）→ 墨偏移向量 */
function tiltOf(e) {
  if (e.tiltX === undefined || e.tiltY === undefined) return [0, 0];
  const tx = (e.tiltX / 90) * 0.003;   // 归一化到墨面偏移
  const ty = (e.tiltY / 90) * 0.003;
  return [tx, ty];
}
/* 泼墨：一簇随机墨点 */
function splashBurst(x, y, scale) {
  const n = 9 + Math.floor(Math.random() * 7);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const rr = Math.random() * brushRadius() * 3.2 + brushRadius() * 0.4;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    const amt = inkDensity * (0.25 + Math.random() * 0.6) * scale;
    splat(px, py,
      Math.cos(a) * (60 + Math.random() * 220) * 0.16,
      Math.sin(a) * (60 + Math.random() * 220) * 0.16 + 55 + Math.random() * 45,   // 沉降：墨点带坠势
      amt, 0.28 + Math.random() * 0.3, undefined, 0.6 * scale);
  }
}
function stats(nStrokes, nSaved) {
  try {
    const s = JSON.parse(localStorage.getItem('ink-stats') || '{"strokes":0,"saved":0}');
    if (nStrokes) s.strokes += nStrokes;
    if (nSaved) s.saved += nSaved;
    localStorage.setItem('ink-stats', JSON.stringify(s));
  } catch (e) { /* 忽略 */ }
}

canvas.addEventListener('pointerdown', e => {
  if (sealMode) { if (!e.shiftKey && e.button !== 1) stampSeal(e.clientX, e.clientY); return; }
  if (e.shiftKey || e.button === 1 || pointers.size > 1) return;
  pointerDown = true;
  const [x, y] = evtPos(e);
  lastX = x; lastY = y; lastT = performance.now();
  strokeLen = 0; strokePhase = Math.random() * 100;
  lastInteract = performance.now();
  hintEl.classList.add('gone');
  snapshotDye();
  stats(1, 0);
  const pr = pressureOf(e);
  if (brushType === 2) {
    splashBurst(x, y, 0.5 + pr * 0.8);
  } else {
    const mul = brushType === 3 ? -0.7 : (brushType === 1 ? 0.8 : 0.55);
    splat(x, y, 0, 0, inkDensity * mul * (0.45 + pr * 1.1), 0.8, undefined,
          brushType === 3 ? 1.0 : 0.5);
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!pointerDown || sealMode) return;
  const [x, y] = evtPos(e);
  const now = performance.now();
  const dt = Math.max((now - lastT) / 1000, 1 / 240);
  const dxUv = x - lastX, dyUv = y - lastY;
  const dist = Math.hypot(dxUv * aspect, dyUv);
  if (dist < 0.0015) return;
  const speed = dist / dt;
  const speedNorm = Math.min(speed / 1.4, 1);
  const pr = pressureOf(e);
  const amt = inkDensity * (1.25 - speedNorm * 1.05) * (0.45 + pr * 1.1);
  /* 提按笔锋：半径随压感与速度起伏——重按则饱、轻提则细、疾书则瘦 */
  const rScale = brushType === 1
    ? 0.5 + pr * 1.05                                   // 硬笔对压感最敏感
    : brushType === 3
      ? 0.9 + pr * 0.25                                 // 水笔保持宽幅
      : 0.62 + pr * 0.5 + (1 - speedNorm) * 0.25;       // 圆笔：压感 + 慢笔更饱
  const taper = Math.min(1, 0.35 + strokeLen / 0.045);  // 起笔渐入（尖锋入纸）
  strokeLen += dist;
  const steps = Math.max(1, Math.ceil(dist / (brushRadius() * 0.55)));
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const m = brushType === 3 ? -0.85 : 1;
    // 飞白：快速运笔时墨量骤降；留白取笔画一维噪声——沿运笔方向连贯成丝缕（枯笔刮丝）
    const flying = speedNorm > 0.45 && brushType !== 3;
    let flyFactor = 1;
    if (flying) {
      const nx = (lastX + dxUv * t) * 137.0 + (lastY + dyUv * t) * 91.7 + strokePhase;
      const streak = 0.5 + 0.5 * Math.sin(nx * 7.13) * Math.sin(nx * 23.7);
      flyFactor = (1 - speedNorm * 0.75) * (streak < 0.3 ? 0.06 : 0.75 + streak * 0.25);
    }
    // 数位笔倾斜偏移
    const [txOff, tyOff] = tiltOf(e);
    splat(lastX + dxUv * t + txOff, lastY + dyUv * t + tyOff,
          dxUv * config.SPLAT_FORCE * dt / steps,
          dyUv * config.SPLAT_FORCE * dt / steps,
          amt * m * flyFactor / steps, rScale * taper,
          undefined, brushType === 3 ? 1.0 : 0.4 + 0.35 * (1 - speedNorm));
    // 飞白散点：速度极高时甩出细小墨丝
    if (flying && speedNorm > 0.7 && Math.random() < 0.15) {
      const perpX = -dyUv / (dist + 1e-6);
      const perpY = dxUv / (dist + 1e-6);
      const off = (Math.random() - 0.5) * brushRadius() * 2.8;
      splat(lastX + dxUv * t + perpX * off,
            lastY + dyUv * t + perpY * off,
            perpX * 60 + (Math.random() - 0.5) * 30,
            perpY * 60 + (Math.random() - 0.5) * 30,
            amt * 0.18, 0.15 + Math.random() * 0.12, undefined, 0.15);
    }
    if (brushType === 2 && Math.random() < 0.22) {
      splat(lastX + dxUv * t + (Math.random() - 0.5) * brushRadius() * 2.4,
            lastY + dyUv * t + (Math.random() - 0.5) * brushRadius() * 2.4,
            (Math.random() - 0.5) * 40, 40 + Math.random() * 60,
            amt * 0.5, 0.3 + Math.random() * 0.25, undefined, 0.5);
    }
  }
  lastX = x; lastY = y; lastT = now;
  lastInteract = now;
});
window.addEventListener('pointerup', () => pointerDown = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* 笔刷预览光标：真实半径可视化（随缩放显示实际落墨范围） */
window.addEventListener('pointermove', e => {
  if (sealMode || e.target !== canvas || pointers.size > 1 || panning) { cursorEl.style.display = 'none'; return; }
  const rPx = 2.4 * Math.sqrt(brushRadius()) * view.zoom * canvas.clientHeight;
  cursorEl.style.display = 'block';
  cursorEl.style.width = cursorEl.style.height = Math.max(5, Math.round(rPx * 2)) + 'px';
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top = e.clientY + 'px';
  cursorEl.classList.toggle('water', brushType === 3);
});
canvas.addEventListener('pointerleave', () => cursorEl.style.display = 'none');

/* ---------------- 纸面缩放平移 ---------------- */
const pointers = new Map();   // 活动触点（双指缩放）
let panning = false, panStart = null;
canvas.addEventListener('wheel', e => {
  if (sealMode) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const u = (e.clientX - r.left) / r.width;
  const v = 1 - (e.clientY - r.top) / r.height;
  const f = Math.exp(-e.deltaY * 0.0016);
  const nz = Math.max(0.5, Math.min(10, view.zoom * f));
  // 光标处纸面点保持不动
  const [dx, dy] = screenToDye(u, v);
  view.cx = dx - (u - 0.5) / nz;
  view.cy = dy - (v - 0.5) / nz;
  view.zoom = nz;
  lastInteract = performance.now();
  renderSeals();
}, { passive: false });
canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) { pointerDown = false; cursorEl.style.display = 'none'; }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prevPt = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {
    // 双指：缩放 + 平移
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (canvas._pinch) {
      const r = canvas.getBoundingClientRect();
      const mu = ((a[0] + b[0]) / 2 - r.left) / r.width;
      const mv = 1 - ((a[1] + b[1]) / 2 - r.top) / r.height;
      const nz = Math.max(0.5, Math.min(10, view.zoom * dist / canvas._pinch));
      const [dx, dy] = screenToDye(mu, mv);
      view.cx = dx - (mu - 0.5) / nz;
      view.cy = dy - (mv - 0.5) / nz;
      view.zoom = nz;
    }
    canvas._pinch = dist;
  } else if (panning && panStart) {
    // Shift/中键 拖拽平移
    view.cx = panStart.cx - (e.clientX - panStart.x) / canvas.clientWidth / view.zoom;
    view.cy = panStart.cy + (e.clientY - panStart.y) / canvas.clientHeight / view.zoom;
    renderSeals();
  }
  if (panning) e.preventDefault?.();
}, { passive: false });
window.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) canvas._pinch = null;
  if (panning) { panning = false; panStart = null; }
});
canvas.addEventListener('pointerdown', e => {
  if (e.shiftKey || e.button === 1) {
    panning = true;
    panStart = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy };
    e.preventDefault();
  }
});

/* 印章三式：方印「拾遗」/ 圆印「墨」/ 引首章「心画」——每次盖章轮换（印笼） */
let sealCycle = 0;
function drawVectorSeal(ctx, size, style) {
  const st = style || 0;
  const red = INKS[inkIdx].tint > 0.9 ? '#2f4a7d' : '#b03a2e';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (st === 1) {
    // 圆印「墨」
    ctx.fillStyle = red;
    ctx.beginPath(); ctx.arc(0, 0, size * 0.46, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(246,242,231,0.85)';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, 0, size * 0.46 - 3.5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#f6f2e7';
    ctx.font = `${Math.round(size * 0.46)}px "KaiTi", "STKaiti", "Songti SC", "SimSun", serif`;
    ctx.fillText('墨', 0, 1);
  } else if (st === 2) {
    // 引首章「心画」：纵长小章
    const w = size * 0.56, h = size * 1.16;
    ctx.fillStyle = red;
    roundRect(ctx, -w / 2, -h / 2, w, h, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(246,242,231,0.8)';
    ctx.lineWidth = 1.1;
    roundRect(ctx, -w / 2 + 3, -h / 2 + 3, w - 6, h - 6, 2);
    ctx.stroke();
    ctx.fillStyle = '#f6f2e7';
    ctx.font = `${Math.round(size * 0.34)}px "KaiTi", "STKaiti", "Songti SC", "SimSun", serif`;
    ctx.fillText('心', 0, -size * 0.22);
    ctx.fillText('画', 0, size * 0.24);
  } else {
    // 方印「拾遗」（默认）
    ctx.fillStyle = red;
    roundRect(ctx, -size / 2, -size / 2, size, size, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(246,242,231,0.85)';
    ctx.lineWidth = 1.4;
    roundRect(ctx, -size / 2 + 4, -size / 2 + 4, size - 8, size - 8, 3);
    ctx.stroke();
    ctx.fillStyle = '#f6f2e7';
    ctx.font = `${Math.round(size * 0.42)}px "KaiTi", "STKaiti", "Songti SC", "SimSun", serif`;
    ctx.fillText('拾', 0, -size * 0.21);
    ctx.fillText('遗', 0, size * 0.21);
  }
  // 印泥残缺（三种印面共用的风化蚀斑）
  ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, r = size * (0.2 + Math.random() * 0.32);
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r, Math.sin(a) * r, Math.random() * 1.8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.25 + Math.random() * 0.5) + ')';
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
/* 把印章重绘到 overlay（dpr 校正 + 视图变换，修复位置不一致） */
function renderSeals() {
  overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
  overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
  const dpr = canvas.clientWidth ? overlay.width / canvas.clientWidth : 1;
  overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const s of seals) {
    const px = ((s.x - view.cx) * view.zoom + 0.5) * canvas.clientWidth;
    const py = (1 - ((s.y - view.cy) * view.zoom + 0.5)) * canvas.clientHeight;
    const size = s.size * view.zoom;
    if (px < -size || py < -size || px > canvas.clientWidth + size || py > canvas.clientHeight + size) continue;
    overlayCtx.save();
    overlayCtx.translate(px, py);
    overlayCtx.rotate(s.rot);
    if (s.img && s.img.complete && s.img.naturalWidth) {
      overlayCtx.drawImage(s.img, -size / 2, -size / 2, size, size);
    } else {
      drawVectorSeal(overlayCtx, size, s.style);
    }
    overlayCtx.restore();
  }
}
function stampSeal(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const u = (clientX - r.left) / r.width;
  const v = 1 - (clientY - r.top) / r.height;
  const [dx, dy] = screenToDye(u, v);
  seals.push({ x: dx, y: dy, size: 56 + Math.random() * 10, rot: (Math.random() - 0.5) * 0.16, img: sealImg,
               style: sealImg ? 0 : ((sealCycle++) % 3) });
  renderSeals();
  lastInteract = performance.now();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let artDirty = false;

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('ink-art', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('art');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(key, val) {
  const db = await idbOpen();
  await new Promise((res, rej) => {
    const tx = db.transaction('art', 'readwrite');
    tx.objectStore('art').put(val, key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction('art').objectStore('art').get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(key) {
  const db = await idbOpen();

    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });

/* 染料降采样快照（供自动存档与画册共用） */
function snapshotDyeSmall() {
  const w = dye.width, h = dye.height;
  const full = new Float32Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dye.read.fbo);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, full);
  const dw = w >> 1, dh = h >> 1;
  const small = new Float32Array(dw * dh * 2);
  for (let y = 0; y < dh; y++) for (let x = 0; x < dw; x++) {
    let r = 0, g = 0;
    for (let oy = 0; oy < 2; oy++) for (let ox = 0; ox < 2; ox++) {
      const i = ((y * 2 + oy) * w + (x * 2 + ox)) * 4;
      r += full[i]; g += full[i + 1];
    }
    const o = (y * dw + x) * 2;
    small[o] = r * 0.25; small[o + 1] = g * 0.25;
  }
  return { w: dw, h: dh, data: small };
}
/* 从快照恢复染料 */
function restoreDye(rec) {
  const dw = rec.w, dh = rec.h, w = dw * 2, h = dh * 2;
  const up = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const s = (Math.min(dh - 1, y >> 1) * dw + Math.min(dw - 1, x >> 1)) * 2;
    const o = (y * w + x) * 4;
    up[o] = rec.data[s]; up[o + 1] = rec.data[s + 1]; up[o + 2] = 0; up[o + 3] = 1;
  }
  /* 尺寸同步：存档分辨率与当前 dye 不一致时（如切换极速档后载入），
     重建 write 侧并同步尺寸记录——否则读写 FBO 错位导致画面 texel 混乱 */
  if (dye.width !== w || dye.height !== h) {
    const nw = createFBO(w, h);
    gl.deleteTexture(dye.write.texture); gl.deleteFramebuffer(dye.write.fbo);
    dye.write = nw;
    dye.width = w; dye.height = h;
    dye.texelSizeX = 1 / w; dye.texelSizeY = 1 / h;
    dye.read.width = w; dye.read.height = h;
    dye.read.texelSizeX = 1 / w; dye.read.texelSizeY = 1 / h;
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.FLOAT, up);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, dye.read.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dye.write.fbo);
  gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
}

const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let nextDrop = 0;
let autoStroke = null;
function idleDrop(now, dt) {
  if (capDemo || ecoMode || !config.idleDrop || REDUCED_MOTION) { autoStroke = null; return; }
  if (now - lastInteract < 8000) { autoStroke = null; return; }
  if (autoStroke) {
    const st = autoStroke;
    st.t += dt * st.speed;
    if (st.t >= 1) {
      autoStroke = null;
      nextDrop = now + 2600 + Math.random() * 2600;
      return;
    }
    const s = Math.sin(st.t * Math.PI);
    const px = st.x0 + st.dx * st.t + st.px * s * st.amp;
    const py = st.y0 + st.dy * st.t + st.py * s * st.amp;
    splat(px, py, st.vx * dt, st.vy * dt, st.dye * dt * 9, 0.85, 0, 0.35);
    return;
  }
  if (now < nextDrop) return;
  // 起一笔：随机弧线
  const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
  const len = 0.22 + Math.random() * 0.3;
  const perp = ang + Math.PI / 2;
  const x0 = 0.2 + Math.random() * 0.6, y0 = 0.75 + Math.random() * 0.15;
  autoStroke = {
    t: 0,
    x0, y0,
    dx: Math.cos(ang) * len, dy: Math.sin(ang) * len,
    px: Math.cos(perp), py: Math.sin(perp),
    amp: 0.05 + Math.random() * 0.1,
    speed: 0.32 + Math.random() * 0.3,
    dye: 0.1 + Math.random() * 0.14,
    vx: Math.cos(ang) * 300, vy: Math.sin(ang) * 300
  };
}

/* ---------------- 步进 ---------------- */
function step(dt) {
  const P = PAPERS[paperIdx];
  gl.disable(gl.BLEND);
  updateQuality(dt);

  // 低配/极速跳过涡度约束（两趟全屏 pass）
  if (!ecoMode && qualityLevel > 0) {
    gl.useProgram(progCurl.p);
    gl.uniform2f(progCurl.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(progCurl.uni.uVelocity, velocity.read.attach(0));
    blit(curl);

    gl.useProgram(progVorticity.p);
    gl.uniform2f(progVorticity.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(progVorticity.uni.uVelocity, velocity.read.attach(0));
    gl.uniform1i(progVorticity.uni.uCurl, curl.attach(1));
    gl.uniform1f(progVorticity.uni.curl, P.curl);
    gl.uniform1f(progVorticity.uni.dt, dt);
    blit(velocity.write); velocity.swap();
  }

  gl.useProgram(progDivergence.p);
  gl.uniform2f(progDivergence.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progDivergence.uni.uVelocity, velocity.read.attach(0));
  blit(divergence);

  gl.useProgram(progClear.p);
  gl.uniform2f(progClear.uni.texelSize, pressure.texelSizeX, pressure.texelSizeY);
  gl.uniform1i(progClear.uni.uTexture, pressure.read.attach(0));
  gl.uniform1f(progClear.uni.value, config.PRESSURE);
  blit(pressure.write); pressure.swap();

  gl.useProgram(progPressure.p);
  gl.uniform2f(progPressure.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progPressure.uni.uDivergence, divergence.attach(1));
  for (let i = 0; i < PRESSURE_ITERS; i++) {
    gl.uniform1i(progPressure.uni.uPressure, pressure.read.attach(0));
    blit(pressure.write); pressure.swap();
  }

  gl.useProgram(progGradient.p);
  gl.uniform2f(progGradient.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progGradient.uni.uPressure, pressure.read.attach(0));
  gl.uniform1i(progGradient.uni.uVelocity, velocity.read.attach(1));
  blit(velocity.write); velocity.swap();

  gl.useProgram(progAdvect.p);
  gl.uniform1f(progAdvect.uni.uWetDecay, 1.1);   // 湿度蒸发速率（半衰期 ~0.6s）
  gl.uniform2f(progAdvect.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform2f(progAdvect.uni.sourceTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progAdvect.uni.uVelocity, velocity.read.attach(0));
  gl.uniform1i(progAdvect.uni.uSource, velocity.read.attach(0));
  gl.uniform1f(progAdvect.uni.dt, dt);
  gl.uniform1f(progAdvect.uni.dissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write); velocity.swap();

  const dyeDiss = washFrames > 0 ? 3.2 : P.dyeDiss;
  gl.uniform2f(progAdvect.uni.sourceTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(progAdvect.uni.uVelocity, velocity.read.attach(0));
  gl.uniform1i(progAdvect.uni.uSource, dye.read.attach(1));
  gl.uniform1f(progAdvect.uni.dissipation, dyeDiss);
  blit(dye.write); dye.swap();
  if (washFrames > 0) washFrames--;
}

function renderFrame(dt, forceFlat) {
  step(dt);
  const P = PAPERS[paperIdx];
  gl.useProgram(progDisplay.p);
  gl.uniform2f(progDisplay.uni.texelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(progDisplay.uni.uDye, dye.read.attach(0));
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, paperTex);
  gl.uniform1i(progDisplay.uni.uPaper, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, lutTex);
  gl.uniform1i(progDisplay.uni.uLut, 2);
  gl.uniform1f(progDisplay.uni.flatPaper, forceFlat || flatPaperNext ? 1.0 : 0.0);
  gl.uniform3f(progDisplay.uni.paperTint, P.tint[0], P.tint[1], P.tint[2]);
  const z = forceFlat || flatPaperNext ? 1 : view.zoom;
  gl.uniform1f(progDisplay.uni.uZoom, z);
  gl.uniform2f(progDisplay.uni.uViewC, forceFlat || flatPaperNext ? 0.5 : view.cx, forceFlat || flatPaperNext ? 0.5 : view.cy);
  blit(null);
}

/* ---------------- #capture：自动演示并录制（约 16 秒 webm） ---------------- */
let capDemo = null;
function startCapture() {
  const st = document.createElement('div');
  st.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99;background:#20242c;color:#fff;font:12px monospace;padding:6px 12px;border-radius:6px';
  st.textContent = 'CAP …';
  document.body.appendChild(st);
  try {
    const stream = canvas.captureStream(30);
    let mime = '';
    for (const m of ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'])
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mime = m; break; }
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime || 'video/webm' });
      const a = document.createElement('a');
      a.download = 'ink-demo.' + ((mime || '').includes('mp4') ? 'mp4' : 'webm');
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      st.textContent = 'CAP saved ✓';
      setTimeout(() => window.close(), 9000);
    };
    rec.start(300);
    capDemo = {
      rec, st, t: 0,
      strokes: [
        { t0: 1.0, t1: 3.8, x0: .34, y0: .76, x1: .365, y1: .30, bow: .05, dye: .40, vmul: .25 },  // 缓行竖——浓
        { t0: 4.2, t1: 5.5, x0: .42, y0: .72, x1: .445, y1: .32, bow: -.07, dye: .30, vmul: 1.0 }, // 疾行竖——淡/飞白
        { t0: 5.9, t1: 8.4, x0: .50, y0: .34, x1: .635, y1: .62, bow: .08, dye: .36, vmul: .35 },  // 硬笔挑——出锋
        { t0: 8.8, t1: 10.3, x0: .665, y0: .60, x1: .71, y1: .38, bow: .04, dye: .32, vmul: .5 },
        { t0: 10.8, t1: 11.6, x0: .57, y0: .50, x1: .585, y1: .485, bow: 0, dye: .9, vmul: .2, rad: 2.4 }, // 泼墨点
        { t0: 12.0, t1: 14.6, x0: .64, y0: .30, x1: .64, y1: .30, bow: 0, dye: .5, vmul: 0, drip: true }  // 悬停滴墨——积聚洇开
      ]
    };
  } catch (e) {
    st.textContent = 'CAP err ' + e.message;
  }
}
function captureTick(dt) {
  if (!capDemo) return;
  capDemo.t += dt;
  for (const k of capDemo.strokes) {
    if (capDemo.t < k.t0 || capDemo.t > k.t1) continue;
    const p = (capDemo.t - k.t0) / (k.t1 - k.t0);
    if (k.drip) {
      // 悬停滴墨镜头：墨滴缓缓积聚洇开（半径随时间长大，湿度高——湿边可见）
      splat(k.x0, k.y0, (Math.random() - .5) * 6, (Math.random() - .5) * 6,
            k.dye * dt * (2.2 + p * 2.5), 1.0 + p * 0.9, 0, 0.85);
      continue;
    }
    const arc = Math.sin(p * Math.PI);
    const x = k.x0 + (k.x1 - k.x0) * p + k.bow * arc;
    const y = k.y0 + (k.y1 - k.y0) * p;
    const dur = k.t1 - k.t0;
    const vx = (k.x1 - k.x0) / dur * 900 * k.vmul;
    const vy = (k.y1 - k.y0) / dur * 900 * k.vmul;
    splat(x, y, vx * dt, vy * dt, k.dye * dt * 9, k.rad || 0.9, 0, 0.4);
  }
  capDemo.st.textContent = 'CAP ' + capDemo.t.toFixed(1) + 's';
  if (capDemo.t > 16) {
    capDemo.rec.stop();
    capDemo = null;
  }
}

/* ---------------- 主循环 ---------------- */
let prevTime = performance.now();
let hidden = false;
document.addEventListener('visibilitychange', () => {
  hidden = document.hidden;
  if (!hidden) prevTime = performance.now();  // 防止累积dt跳帧
});
function frame(now) {
  requestAnimationFrame(frame);
  if (hidden) return;   // 页面不可见时跳过渲染与模拟
  const dt = Math.min((now - prevTime) / 1000, 0.033);
  prevTime = now;
  // #bench：注入负载并统计帧耗（自动 vs 极速），结果写入 DOM 供无头读取
  if (benchOut) {
    splat(0.2 + Math.random() * 0.6, 0.3 + Math.random() * 0.4,
      (Math.random() - 0.5) * 80 * dt, (Math.random() - 0.5) * 80 * dt,
      0.6 * dt, 1.0, 0);
    benchSum += dt * 1000; benchN2++;
    if (benchN2 >= 60) {
      if (benchPhase === 0) {
        benchA = benchSum / benchN2;
        benchOut.textContent = `BENCH auto=${benchA.toFixed(1)}ms — eco…`;
        benchPhase = 1; benchN2 = 0; benchSum = 0;
        setEco(true);
      } else {
        benchOut.textContent = `BENCH auto=${benchA.toFixed(1)}ms eco=${(benchSum / benchN2).toFixed(1)}ms`;
        benchOut = null;
      }
    }
  }
  idleDrop(now, dt);
  captureTick(dt);
  /* 悬停滴墨：按住不动时，墨随时间在笔尖积聚、缓缓洇开（水笔则持续化墨） */
  if (pointerDown && !sealMode && !panning && pointers.size <= 1 && brushType !== 2) {
    const held = now - lastT;
    if (held > 300) {
      const pool = Math.min(1, (held - 300) / 4000);   // 4 秒积满一滴
      const damp = brushType === 3 ? -0.04 : inkDensity * 0.06 * (0.3 + pool);
      splat(lastX, lastY,
            (Math.random() - 0.5) * 7, (Math.random() - 0.5) * 7,
            damp * dt * 6, 1.05 + pool * 0.5,
            undefined, brushType === 3 ? 0.9 : 0.5 * dt * 6);
    }
  }
  // 极速 + 静置：隔帧跳过模拟与绘制（慢扩散减半负载；preserveDrawingBuffer 保持画面）
  frameNo++;
  if (ecoMode && !benchOut && !autoStroke && washFrames <= 0 &&
      now - lastInteract > 6000 && (frameNo & 1)) return;
  renderFrame(dt, false);
}
/* bench 状态 */
const benchOn = location.hash.includes('bench');
let benchOut = null, benchPhase = 0, benchN2 = 0, benchSum = 0, benchA = 0, frameNo = 0;
if (benchOn) {
  benchOut = document.createElement('div');
  benchOut.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99;background:#20242c;color:#fff;font:12px monospace;padding:6px 12px;border-radius:6px';
  benchOut.textContent = 'BENCH auto…';
  document.body.appendChild(benchOut);
}

/* ---------------- resize ---------------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, ecoMode ? 1 : 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    overlay.width = w; overlay.height = h;
    renderSeals();
  }
}
window.addEventListener('resize', resize);

/* ---------------- UI：chips / 快捷键 ---------------- */
function buildChips() {
  const bg = document.getElementById('brushGrp');
  bg.querySelectorAll('.chip').forEach(x => x.remove());
  I18N[lang].brushes.forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === brushType ? ' on' : '');
    b.textContent = name;
    b.addEventListener('click', () => { brushType = i; buildChips(); });
    bg.appendChild(b);
  });
  const pg = document.getElementById('pigGrp');
  pg.querySelectorAll('.pig').forEach(x => x.remove());
  INKS.forEach((ink, i) => {
    const b = document.createElement('button');
    b.className = 'pig' + (i === inkIdx ? ' on' : '');
    b.style.background = INK_CSS[i];
    b.setAttribute('aria-label', I18N[lang].inkNames[i]);
    b.title = I18N[lang].inkNames[i] + ' · ' + I18N[lang].inkCustom;
    b.addEventListener('click', () => { inkIdx = i; buildChips(); });
    b.addEventListener('contextmenu', e => e.preventDefault());
    // 长按 450ms：自定墨色——取色器实时改 LUT 驻点，混色随新色带即刻生效
    let lp = null;
    b.addEventListener('pointerdown', () => {
      lp = setTimeout(() => {
        lp = null;
        const inp = document.createElement('input');
        inp.type = 'color';
        inp.value = INK_CSS[i];
        inp.addEventListener('input', () => {
          PIG_STOPS[i].c = hex2rgb(inp.value);
          INK_CSS[i] = inp.value;
          b.style.background = inp.value;
          rebuildLut();
          try {
            const pal = JSON.parse(localStorage.getItem('ink-palette') || '[]');
            pal[i] = inp.value;
            localStorage.setItem('ink-palette', JSON.stringify(pal));
          } catch (e) {}
        });
        inp.click();
      }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
      b.addEventListener(ev, () => { if (lp) { clearTimeout(lp); lp = null; } }));
    pg.appendChild(b);
  });
  const rg = document.getElementById('paperGrp');
  rg.querySelectorAll('.chip').forEach(x => x.remove());
  I18N[lang].papers.forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === paperIdx ? ' on' : '');
    b.textContent = name;
    b.addEventListener('click', () => {
      paperIdx = i;
      uploadPaper(i);
      buildChips();
    });
    rg.appendChild(b);
  });
}

const brushSizeEl = document.getElementById('brushSize');
const inkDensityEl = document.getElementById('inkDensity');
const brushSizeVal = document.getElementById('brushSizeVal');
function updSizeVal() {
  brushSizeVal.textContent = Math.round(brushSize * 100 / 1.4);
}
brushSizeEl.addEventListener('input', () => { brushSize = +brushSizeEl.value; updSizeVal(); });
inkDensityEl.addEventListener('input', () => inkDensity = +inkDensityEl.value);

document.getElementById('ecoBtn').addEventListener('click', () => setEco(!ecoMode));
document.getElementById('undoBtn').addEventListener('click', undo);
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === '[') { brushSize = Math.max(0.02, brushSize - 0.06); brushSizeEl.value = brushSize; updSizeVal(); }
  else if (k === ']') { brushSize = Math.min(1.4, brushSize + 0.06); brushSizeEl.value = brushSize; updSizeVal(); }
  else if (k === '0') { resetView(); }
  else if (k === '1' || k === '2' || k === '3' || k === '4') { brushType = +k - 1; buildChips(); }
  else if (k === 'z') { undo(); }
  else if (k === 'c') { inkIdx = (inkIdx + 1) % INKS.length; buildChips(); }
  else if (k === 'w') wash();
  else if (k === 'e' || k === 'E') setEco(!ecoMode);
  else if (k === 's') saveArtwork();
});

/* ---------------- 语言 / 帮助 ---------------- */
const langBtn = document.getElementById('langBtn');
langBtn.addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('ink-lang', lang);
  applyI18n();
});
const helpPanel = document.getElementById('helpPanel');
document.getElementById('helpBtn').addEventListener('click', () => helpPanel.classList.toggle('show'));

/* ---------------- 启动 ---------------- */
try { localStorage.setItem('toy-last', JSON.stringify({ s: 'ink', t: Date.now() })); } catch (e) {}
applyI18n();
if (ecoMode) { applyQuality(); const eb2 = document.getElementById('ecoBtn'); if (eb2) eb2.classList.add('on'); }
else if (Math.min(screen.width, screen.height) < 700 && localStorage.getItem('ink-eco') === null && !location.hash.includes('bench') && !location.hash.includes('capture')) {
  // 小屏首访自动极速（不落库；用户手动切换才持久）
  setEco(true);
  try { localStorage.removeItem('ink-eco'); } catch (e) {}
}
updSizeVal();
updateUndoBtn();
updSealUpBtn();
resize();
// 续档：有存档则恢复，无则落开卷三笔
loadArtArchive().then(ok => {
  if (!ok) {
    splat(0.62, 0.68, -160, -320, 0.8, 1.0, 0);
    splat(0.58, 0.62, -90, -220, 0.5, 0.6, 0);
    splat(0.66, 0.74, -220, -140, 0.35, 0.45, 0);
  }
  artDirty = false;
});
requestAnimationFrame(frame);
if (location.hash.includes('capture')) startCapture();
</script>
