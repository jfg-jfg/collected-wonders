<script>
'use strict';
window.addEventListener('error', e => {
  const b = document.getElementById('errbox');
  b.style.display = 'block'; b.textContent = 'ERR: ' + e.message;
});

/* ============ i18n ============ */
const I18N = {
  zh: {
    sub: '分形星球',
    hint: '滚轮缩放 · 拖拽巡游 · 双击俯冲',
    share: '分享坐标', copied: '已复制链接', copyFail: '链接已写入地址栏，请手动复制',
    reset: '回母港', zoom: '倍率', palette: '色',
    tour: '▶ 巡航', tourStop: '■ 停', tourTip: '自动巡航各地名，每处停留 6 秒',
    addSpot: '存此地', delSpot: '长按删除',
    juliaOn: '儒', juliaOff: '曼', shipName: '舰',
    juliaTipOn: '切换到儒利亚集合（以当前中心为 c）', juliaTipOff: '回到曼德博集合',
    palTip: '切换调色板', shot: '存图', shotOk: '✓ 已保存',
    epochs: ['浅海纪', '尘埃纪', '洇墨纪', '灯下纪'],
    enterEpoch: e => `—— 入 ${e} ——`,
    deepest: '灯下',
    badges: [
      { k: 'm3', mag: 1e3, line: '第一千层。浪声退成很远的背景。' },
      { k: 'm6', mag: 1e6, line: '一百万。光走到这里，也要歇一歇。' },
      { k: 'm9', mag: 1e9, line: '十亿。安静得能听见自己在数。' },
      { k: 'm12', mag: 1e12, line: '万亿。像有人在更深处，替你把数续上了。' }
    ],
    badgeTip: '深度手记：1e3 / 1e6 / 1e9 / 1e2'
  },
  en: {
    sub: 'Fractal Planet',
    hint: 'SCROLL TO ZOOM · DRAG TO DRIFT · DOUBLE-CLICK TO DIVE',
    share: 'SHARE SPOT', copied: 'link copied', copyFail: 'link is in the address bar — copy manually',
    reset: 'HOME PORT', zoom: 'mag', palette: 'PAL',
    tour: '▶ TOUR', tourStop: '■ STOP', tourTip: 'auto-cruise named spots, 6s each',
    addSpot: 'MARK SPOT', delSpot: 'long-press to delete',
    juliaOn: 'JULIA', juliaOff: 'MSET', shipName: 'SHIP',
    juliaTipOn: 'switch to the Julia set (c = current center)', juliaTipOff: 'back to the Mandelbrot set',
    palTip: 'cycle palette', shot: 'SHOT', shotOk: '✓ saved',
    epochs: ['Shallows', 'Dust', 'Ink', 'Under the Lamp'],
    enterEpoch: e => `—— INTO THE ${e.toUpperCase()} ——`,
    deepest: 'Under the Lamp',
    badges: [
      { k: 'm3', mag: 1e3, line: 'One thousand deep. The sound of waves recedes into a far background.' },
      { k: 'm6', mag: 1e6, line: 'A million. Even light, coming this far, needs to rest.' },
      { k: 'm9', mag: 1e9, line: 'A billion. Quiet enough to hear yourself counting.' },
      { k: 'm12', mag: 1e12, line: 'A trillion. As if someone deeper down were counting on for you.' }
    ],
    badgeTip: 'depth notes: 1e3 / 1e6 / 1e9 / 1e12'
  }
};
let lang = localStorage.getItem('fold-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
{ const hm = location.hash.match(/lang=(\w{2})/); if (hm) { lang = hm[1] === 'en' ? 'en' : 'zh'; try { localStorage.setItem('fold-lang', lang); } catch (e) {} } }
const T = () => I18N[lang];

/* ============ WebGL ============ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
if (!gl) { document.getElementById('errbox').style.display = 'block'; document.getElementById('errbox').textContent = 'WebGL2 unavailable'; throw new Error('no webgl2'); }
const hasFloatFB = !!gl.getExtension('EXT_color_buffer_float');

const VERT = `#version 300 es
precision highp float;
const vec2 verts[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
void main(){ gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0); }`;

/* ---------- Pass 1：迭代 ----------
   输出数据纹理（编码为 0..1，RGBA8 回退亦可用）：
   R = fract(0.12·t) 逃逸相位 | fract(0.08·i) 内部相位
   G = 条纹平均值（逃逸）| exp(-0.015·i) 内部辉光
   B = fract(0.5·log2(DE/像素)) 褶皱等距线相位（非全纯模式为 0）
   A = exp(-0.03·t) 边界辉光兼逃逸标志（>=0.004 为逃逸） */
const FRAG_ITER = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uCenterX;
uniform vec2 uCenterY;
uniform float uScale;
uniform vec2 uRes;
uniform float uIter;
uniform float uJulia;
uniform vec2 uCx;
uniform vec2 uCy;
uniform float uMode;   /* 0 曼德博 1 儒利亚 2 燃烧之舰 */
uniform float uTier;   /* 0 单精度（浅层提速） 1 df64 */

vec2 ds_add(vec2 a, vec2 b) {
  float t1 = a.x + b.x;
  float e = t1 - a.x;
  float t2 = ((b.x - e) + (a.x - (t1 - e))) + a.y + b.y;
  vec2 r;
  r.x = t1 + t2;
  r.y = t2 - (r.x - t1);
  return r;
}
vec2 ds_mul(vec2 a, vec2 b) {
  const float SPLIT = 8193.0;
  float ca = SPLIT * a.x, cb = SPLIT * b.x;
  float a_hi = ca - (ca - a.x), b_hi = cb - (cb - b.x);
  float a_lo = a.x - a_hi, b_lo = b.x - b_hi;
  float c11 = a_hi * b_hi;
  /* 修正项 = 交叉和 + 低位积（~2^-13 量级）——绝不可乘 SPLIT */
  float c21 = (a_hi * b_lo + a_lo * b_hi) + a_lo * b_lo;
  float t1 = c11 + c21;
  vec2 r;
  r.x = t1;
  r.y = c21 - (t1 - c11);
  return r;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float pix = 2.0 * uScale / uRes.y;
  bool ship = uMode > 1.5;
  bool julia = uJulia > 0.5;
  /* c（df64 构造，两档共用：像素坐标的绝对精度永远走双单） */
  vec2 cxc = ds_add(uCenterX, vec2(uv.x * uScale, 0.0));
  vec2 cyc = ds_add(uCenterY, vec2(uv.y * uScale, 0.0));

  float t = 0.0;         /* 平滑逃逸计数 / 内部计数 */
  float stripe = 0.0;    /* 条纹累加 */
  float gout = 0.0;      /* 内部辉光 */
  float lg = 0.0;        /* log2(DE/pix) */
  bool esc = false;
  float escA = 0.0;

  if (uTier < 0.5) {
    /* ---- 单精度档：浅层（倍率 < 1e5），普通 float 迭代 ---- */
    vec2 z, c;
    vec2 dz = vec2(julia ? 1.0 : 0.0);   /* 复导数（全纯模式） */
    if (julia) { z = vec2(cxc.x, cyc.x); c = vec2(uCx.x, uCy.x); }
    else { z = vec2(0.0); c = vec2(cxc.x, cyc.x); }
    float sum = 0.0, n = 0.0, dd = 0.0;
    for (int k = 0; k < 2048; k++) {
      if (float(k) >= uIter) break;
      if (ship) { z = abs(z); }
      vec2 zn = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
      if (!ship) { dz = vec2(2.0 * (z.x * dz.x - z.y * dz.y) + (julia ? 0.0 : 1.0),
                             2.0 * (z.x * dz.y + z.y * dz.x)); }
      z = zn;
      dd = dot(z, z);
      sum += 0.5 + 0.5 * sin(atan(z.y, z.x) * 3.0);
      n += 1.0;
      if (dd > 65536.0) { t = float(k) + 1.0 - log2(log2(dd) * 0.5); esc = true; break; }
    }
    if (esc) {
      stripe = sum / max(n, 1.0);
      escA = exp(-t * 0.03);
      if (!ship) {
        float az = sqrt(dd);
        float de = az * log(az) / max(length(dz), 1e-30);
        lg = log2(max(de, 1e-30) / pix);
      }
    } else {
      t = n; gout = exp(-n * 0.015);
    }
  } else {
    /* ---- df64 档：深层（1e5 ~ 1e13） ---- */
    vec2 zx, zy, Cx, Cy;
    if (julia) { zx = cxc; zy = cyc; Cx = uCx; Cy = uCy; }
    else { zx = vec2(0.0); zy = vec2(0.0); Cx = cxc; Cy = cyc; }
    vec2 dz = vec2(julia ? 1.0 : 0.0);   /* 复导数走单精度（hi 分量，供 DE 等距线） */
    float sum = 0.0, n = 0.0, dd = 0.0;
    for (int k = 0; k < 2048; k++) {
      if (float(k) >= uIter) break;
      if (ship) {
        zx = vec2(abs(zx.x), abs(zx.y));
        zy = vec2(abs(zy.x), abs(zy.y));
      }
      vec2 xx = ds_mul(zx, zx);
      vec2 yy = ds_mul(zy, zy);
      vec2 xy = ds_mul(zx, zy);
      vec2 nx = ds_add(ds_add(xx, vec2(-yy.x, -yy.y)), Cx);
      vec2 ny = ds_add(ds_add(xy, xy), Cy);
      if (!ship) {
        float zhx = zx.x, zhy = zy.x;
        dz = vec2(2.0 * (zhx * dz.x - zhy * dz.y) + (julia ? 0.0 : 1.0),
                  2.0 * (zhx * dz.y + zhy * dz.x));
      }
      zx = nx; zy = ny;
      dd = zx.x * zx.x + zy.x * zy.x;
      sum += 0.5 + 0.5 * sin(atan(zy.x, zx.x) * 3.0);
      n += 1.0;
      if (dd > 65536.0) { t = float(k) + 1.0 - log2(log2(dd) * 0.5); esc = true; break; }
    }
    if (esc) {
      stripe = sum / max(n, 1.0);
      escA = exp(-t * 0.03);
      if (!ship) {
        float az = sqrt(dd);
        float de = az * log(az) / max(length(dz), 1e-30);
        lg = log2(max(de, 1e-30) / pix);
      }
    } else {
      t = n; gout = exp(-n * 0.015);
    }
  }

  float R, G, B, A;
  if (esc) {
    R = fract(0.12 * t);
    G = clamp(stripe, 0.0, 1.0);
    B = ship ? 0.0 : fract(lg * 0.5);
    A = clamp(escA, 0.0, 1.0);
  } else {
    R = fract(0.08 * t);
    G = clamp(gout, 0.0, 1.0);
    B = 0.0;
    A = 0.0;
  }
  fragColor = vec4(R, G, B, A);
}`;

/* ---------- Pass 2：着色 ----------
   迭代数据只算一遍，调色相位 / 地质层 / 调色板切换近乎免费 */
const FRAG_COLOR = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform sampler2D uData;
uniform float uPhase;
uniform float uPal;
uniform float uStratum;   /* 0 浅 … 1 深（log10(mag)/13）：地质层 */

vec3 palette(float t) {
  /* 四套调色板：0墨 1极光 2炉火 3素宣 */
  if (uPal < 0.5) {
    vec3 a = vec3(0.16, 0.14, 0.20), b = vec3(0.42, 0.36, 0.30), d = vec3(0.10, 0.20, 0.38);
    return a + b * cos(6.28318 * (t + d));
  } else if (uPal < 1.5) {
    vec3 a = vec3(0.10, 0.16, 0.18), b = vec3(0.30, 0.44, 0.40), d = vec3(0.45, 0.28, 0.60);
    return a + b * cos(6.28318 * (t + d));
  } else if (uPal < 2.5) {
    vec3 a = vec3(0.18, 0.08, 0.05), b = vec3(0.42, 0.26, 0.12), d = vec3(0.02, 0.12, 0.24);
    return a + b * cos(6.28318 * (t + d));
  } else {
    vec3 a = vec3(0.16, 0.15, 0.13), b = vec3(0.34, 0.32, 0.30), d = vec3(0.0, 0.04, 0.08);
    return a + b * cos(6.28318 * (t + d));
  }
}
/* 地质层：越深越近单色冷墨（浅海青绿 → 墨渊近墨） */
vec3 strata(vec3 c) {
  float m = dot(c, vec3(0.299, 0.587, 0.114));
  vec3 mono = m * vec3(0.94, 0.97, 1.05);
  return mix(c, mono, uStratum * 0.72) * (1.0 - uStratum * 0.10);
}
void main() {
  vec4 d = texelFetch(uData, ivec2(gl_FragCoord.xy), 0);
  bool esc = d.a >= 0.004;
  vec3 col;
  if (esc) {
    float hue = d.r + uPhase;
    col = strata(palette(hue));
    /* 条纹织物：轨道统计赋予流动质感 */
    col *= 0.72 + 0.56 * d.g;
    /* 褶皱墨线：DE 等距线（距边界越近越浓） */
    float tri = abs(d.b - 0.5) * 2.0;
    float line = 1.0 - smoothstep(0.0, 0.22, tri);
    col = mix(col, col * 0.22, line * clamp(d.a * 4.0, 0.0, 1.0) * 0.8);
    /* 边界辉光 */
    col += palette(uPhase + 0.5) * d.a * 0.28;
  } else {
    float bands = 0.5 + 0.5 * sin(6.28318 * 10.0 * d.r);
    vec3 base = strata(palette(d.r + uPhase * 0.5));
    col = base * (0.12 + 0.20 * bands + d.g * 0.5);
    col += vec3(0.04, 0.03, 0.05) * d.g;
  }
  fragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(frag) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  return p;
}
const progIter = makeProgram(FRAG_ITER);
const progColor = makeProgram(FRAG_COLOR);
const UI = {}, UC = {};
['uCenterX','uCenterY','uScale','uRes','uIter','uJulia','uCx','uCy','uMode','uTier'].forEach(n => UI[n] = gl.getUniformLocation(progIter, n));
['uData','uPhase','uPal','uStratum'].forEach(n => UC[n] = gl.getUniformLocation(progColor, n));

/* ---------- 数据纹理 FBO ---------- */
let dataTex = null, fbo = null;
function allocData() {
  if (dataTex) { gl.deleteTexture(dataTex); gl.deleteFramebuffer(fbo); }
  dataTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, dataTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (hasFloatFB) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, canvas.width, canvas.height, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, canvas.width, canvas.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, dataTex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('fbo incomplete');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* ============ 视图状态 ============ */
const view = { x: -0.6, y: 0, s: 1.4 };   // 中心与半高
const target = { x: -0.6, y: 0, s: 1.4 }; // 平滑追踪目标
let fly = null;                            // 飞行动画 {x0,y0,s0,x1,y1,s1,t0,dur}
const MAG_LIMIT = 1e-13;
let juliaOn = false, juliaC = { x: -0.7269, y: 0.1889 };
let shipMode = false;
let palIdx = 0;
let phaseT = 0;
const PAL_NAMES = { zh: ['墨', '极光', '炉火', '素宣'], en: ['INK', 'AURORA', 'EMBER', 'PLAIN'] };

function split64(v) {
  const hi = Math.fround(v);
  const lo = v - hi;
  return [hi, lo];
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // 性能取舍：限制渲染分辨率
  const maxDim = 1400;
  let w = innerWidth * dpr, h = innerHeight * dpr;
  const m = Math.max(w, h) / maxDim;
  if (m > 1) { w /= m; h /= m; }
  const ow = canvas.width, oh = canvas.height;
  canvas.width = Math.round(w); canvas.height = Math.round(h);
  if (canvas.width !== ow || canvas.height !== oh) allocData();
}
window.addEventListener('resize', resize);
resize();

/* ============ 渲染：Pass1 迭代 → Pass2 着色 ============ */
let lastIter = 0;
let lastRenderT = 0;
function renderIter() {
  const [xh, xl] = split64(view.x);
  const [yh, yl] = split64(view.y);
  const busy = dragStart !== null || fly !== null || Math.abs(view.s - target.s) / target.s > 0.01;
  const iter = Math.min(2000, Math.round((160 + 42 * Math.log2(3 / view.s) * 0.5 + 80) * (busy ? 0.45 : 1)));
  const [cxh, cxl] = split64(juliaC.x);
  const [cyh, cyl] = split64(juliaC.y);
  const mag = 1.4 / view.s;
  gl.useProgram(progIter);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(UI.uCenterX, xh, xl);
  gl.uniform2f(UI.uCenterY, yh, yl);
  gl.uniform1f(UI.uScale, view.s);
  gl.uniform2f(UI.uRes, canvas.width, canvas.height);
  gl.uniform1f(UI.uIter, iter);
  gl.uniform1f(UI.uJulia, juliaOn ? 1.0 : 0.0);
  gl.uniform2f(UI.uCx, cxh, cxl);
  gl.uniform2f(UI.uCy, cyh, cyl);
  gl.uniform1f(UI.uMode, shipMode ? 2.0 : 0.0);
  gl.uniform1f(UI.uTier, mag < 3e4 ? 0.0 : 1.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  lastIter = iter;
  lastRenderT = performance.now();
}
function renderColor() {
  const mag = 1.4 / view.s;
  gl.useProgram(progColor);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dataTex);
  gl.uniform1i(UC.uData, 0);
  gl.uniform1f(UC.uPhase, phaseT);
  gl.uniform1f(UC.uPal, palIdx);
  gl.uniform1f(UC.uStratum, Math.min(1, Math.max(0, Math.log10(Math.max(mag, 1)) / 13)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function render() {
  renderIter();
  renderColor();
  updateCoords();
}

let curEpoch = -1;
function updateCoords() {

/* ============ 纪元分层命名 ============ */
/* 量化格：格 = 1.6×半高；父格共享词根（姓），平移稳定不闪烁 */
const ZONE_POOLS = {
  zh: [
    { roots: ['白帆', '退潮', '鸟居', '礁环', '月洲', '晚风'], tails: ['屿', '湾', '门', '滩', '洲', '岬'] },
    { roots: ['悬尘', '旧星', '碎屑', '流轨', '絮语', '远屑'], tails: ['带', '原', '沟', '站', '漠', '环'] },
    { roots: ['宿墨', '一线', '干毫', '沉墨', '夜痕', '未干'], tails: ['井', '痕', '渊', '层', '底', '隙'] },
    { roots: ['将尽', '冷油', '残焰', '芯影', '半明', '守夜'], tails: ['芯', '海', '焰', '影', '塔', '域'] }
  ],
  en: [
    { roots: ['White Sail', 'Ebb', 'Torii', 'Reef Ring', 'Moon Isle', 'Evening Wind'], tails: [' Isle', ' Bay', ' Gate', ' Flat', 's', ' Cape'] },
    { roots: ['Hanging Dust', 'Old Star', 'Debris', 'Flow Track', 'Murmur', 'Far Grit'], tails: [' Belt', ' Plain', ' Trench', ' Station', ' Desert', ' Ring'] },
    { roots: ['Lodged Ink', 'One Thread', 'Dry Brush', 'Sunken Ink', 'Night Mark', 'Un dried'], tails: [' Well', ' Trace', ' Abyss', ' Layer', ' Floor', ' Crevice'] },
    { roots: ['Waning', 'Cold Oil', 'Ember', 'Wick Shadow', 'Half Lit', 'Night Watch'], tails: [' Wick', ' Sea', ' Flame', ' Shadow', ' Tower', ' Reach'] }
  ]
};
function h32(a, b, c) {
  let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1103515245) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function epochOf(mag) {
  if (mag >= 1e13) return 4;   // 触底
  if (mag >= 1e10) return 3;
  if (mag >= 1e7) return 2;
  if (mag >= 1e4) return 1;
  if (mag >= 100) return 0;
  return -1;
}
function deepZoneName(mag, x, y, s) {
  const ep = epochOf(mag);
  if (ep < 0) return '';
  /* 纪元跨越提示（一次性小字） */
  if (curEpoch !== ep) {
    if (curEpoch >= 0 && ep > curEpoch && ep <= 3) {
      const h = document.getElementById('hint');
      h.textContent = T().enterEpoch(T().epochs[ep]);
      h.classList.remove('gone');
      setTimeout(() => h.classList.add('gone'), 2600);
    }
    curEpoch = ep;
  }
  if (ep === 4) {
    return `<br><span style="color:var(--gold);font-size:11px;letter-spacing:0.2em">◈ ${T().deepest}</span>`;
  }
  const cell = Math.max(1.6 * s, 1e-13);
  const ix = Math.floor(x / cell), iy = Math.floor(y / cell);
  const px2 = Math.floor(ix / 12), py2 = Math.floor(iy / 12);
  const pool = ZONE_POOLS[lang][ep];
  const root = pool.roots[Math.floor(h32(px2, py2, ep) * pool.roots.length)];
  const tail = pool.tails[Math.floor(h32(ix, iy, ep + 7) * pool.tails.length)];
  return `<br><span style="color:var(--gold);font-size:11px;letter-spacing:0.2em">◈ ${root}${tail}</span>`;
}

/* ============ 交互 ============ */
let dragStart = null, moved = false;
canvas.addEventListener('pointerdown', e => {
  dragStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  moved = false;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragStart) return;
  const dx = (e.clientX - dragStart.x) / innerHeight * 2 * view.s;
  const dy = (e.clientY - dragStart.y) / innerHeight * 2 * view.s;
  if (Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y) > 4) moved = true;
  view.x = dragStart.vx - dx;
  view.y = dragStart.vy + dy;
  target.x = view.x; target.y = view.y; target.s = view.s;
  fly = null;
  document.getElementById('hint').classList.add('gone');
  requestRender();
});
window.addEventListener('pointerup', () => { dragStart = null; canvas.classList.remove('dragging'); });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(e.deltaY * 0.0016);
  zoomAt(e.clientX, e.clientY, f);
  fly = null;
  document.getElementById('hint').classList.add('gone');
}, { passive: false });

function zoomAt(cx, cy, f) {
  const ns = Math.max(MAG_LIMIT * 1.4, Math.min(2.5, target.s * f));
  const kx = (cx - innerWidth / 2) / innerHeight * 2;
  const ky = -(cy - innerHeight / 2) / innerHeight * 2;
  const ratio = ns / target.s;
  target.x += kx * target.s * (1 - ratio);
  target.y += ky * target.s * (1 - ratio);
  target.s = ns;
  requestRender();
}
canvas.addEventListener('dblclick', e => {
  zoomAt(e.clientX, e.clientY, 0.32);
  fly = null;
});

/* 触屏双指缩放 */
const touches = new Map();
canvas.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') touches.set(e.pointerId, e); });
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && touches.has(e.pointerId)) {
    touches.set(e.pointerId, e);
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      if (canvas._lastPinch) {
        zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, canvas._lastPinch / dist);
      }
      canvas._lastPinch = dist;
    }
  }
});
window.addEventListener('pointerup', e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) canvas._lastPinch = null;
});

/* ============ 智能巡航：按分形图案密度自动导航 ============ */
let tourOn = false, tourTimer = null;
const tourBtn = document.getElementById('tourBtn');
function updTourBtn() {

/* 找最有趣的区域：读取画布像素，计算局部方差，选方差最高的子区域 */
function findInterestingSpot() {
  // 渲染当前帧到画布
  render();
  // 从画布读取低分辨率采样（8×6 网格）
  const SX = 8, SY = 6;
  const cw = Math.floor(canvas.width / SX), ch2 = Math.floor(canvas.height / SY);
  const pixels = new Uint8Array(4);
  const scores = [];
  for (let sy = 0; sy < SY; sy++) {
    for (let sx = 0; sx < SX; sx++) {
      // 每个格子中心采一个点
      const px2 = Math.floor((sx + 0.5) * cw);
      const py2 = Math.floor((sy + 0.5) * ch2);
      gl.readPixels(px2, py2, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      // 也采四个角用于方差
      const p2 = new Uint8Array(4);
      const samples = [];
      for (const [ox, oy] of [[0,0],[cw-1,0],[0,ch2-1],[cw-1,ch2-1],[cw>>1,ch2>>1]]) {
        gl.readPixels(px2 - (cw>>1) + ox, py2 - (ch2>>1) + oy, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p2);
        samples.push(p2[0] + p2[1] + p2[2]);
      }
      // 计算方差
      const mean = samples.reduce((a,b) => a+b, 0) / samples.length;
      const variance = samples.reduce((a,b) => a + (b - mean) ** 2, 0) / samples.length;
      // 也考虑绝对亮度（太暗的内部不太有趣）
      const brightness = pixels[0] + pixels[1] + pixels[2];
      scores.push({ sx, sy, score: variance + brightness * 0.1 });
    }
  }
  // 选分数最高的区域
  scores.sort((a, b) => b.score - a.score);
  const best = scores[Math.floor(Math.random() * Math.min(3, scores.length))];  // 前3随机选
  // 转换为坐标
  const u = (best.sx + 0.5) / SX - 0.5;
  const v = 0.5 - (best.sy + 0.5) / SY;
  return {
    x: view.x + u * view.s * 2,
    y: view.y + v * view.s * 2,
    s: view.s * (0.3 + Math.random() * 0.25)  // 缩小 25-45%
  };
}
function tourNext() {
  if (!tourOn) return;
  const spot = findInterestingSpot();
  // 飞到有趣区域
  fly = {
    x0: view.x, y0: view.y, s0: view.s,
    x1: spot.x, y1: spot.y, s1: Math.max(spot.s, 1e-13),
    t0: performance.now(), dur: 3000
  };
  // 停留 4 秒后继续
  tourTimer = setTimeout(tourNext, 7000);
}

  document.getElementById('hint').textContent = T().hint;
  buildPlaces();
  updateCoords();
}

/* ============ 待机深潜 ============ */
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastInteractF = performance.now();
['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, () => { lastInteractF = performance.now(); }, { passive: true }));

/* ============ 渲染循环 ============ */
let renderPending = false, colorPending = false;
function requestRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; render(); });
}
function requestColor() {
  if (colorPending) return;
  colorPending = true;
  requestAnimationFrame(() => { colorPending = false; renderColor(); });
}
let prev = performance.now();
let foldHidden = false;
document.addEventListener('visibilitychange', () => {
  foldHidden = document.hidden;
  if (!foldHidden) prev = performance.now();
});
function frame(now) {
  requestAnimationFrame(frame);
  if (foldHidden) return;
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  if (fly) {
    const t = Math.min(1, (now - fly.t0) / fly.dur);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;  // easeInOutQuad
    view.s = Math.exp(Math.log(fly.s0) + (Math.log(fly.s1) - Math.log(fly.s0)) * e);
    view.x = fly.x0 + (fly.x1 - fly.x0) * e;
    view.y = fly.y0 + (fly.y1 - fly.y0) * e;
    target.x = view.x; target.y = view.y; target.s = view.s;
    if (t >= 1) fly = null;
    requestRender();
  } else {
    // 待机深潜：闲置 25s 缓缓深入（屏保）；reduced-motion 用户跳过
    if (!REDUCED_MOTION && now - lastInteractF > 25000) {
      target.s = Math.max(MAG_LIMIT * 1.4, target.s * Math.exp(-dt * 0.07));
    }
    // 平滑追踪：view 指数逼近 target（惯性缩放）
    const k = 1 - Math.exp(-dt * 9);
    const dxs = (target.s - view.s) / view.s;
    const dxy = Math.hypot(target.x - view.x, target.y - view.y) / Math.max(target.s, 1e-13);
    if (Math.abs(dxs) > 1e-4 || dxy > 1e-4) {
      view.s = Math.exp(Math.log(view.s) + Math.log(target.s / view.s) * k);
      view.x += (target.x - view.x) * k;
      view.y += (target.y - view.y) * k;
      requestRender();
    }
  }
  // 空闲补帧：按需渲染下，长闲置后缓冲可能被回收（截图/标签页恢复时看到黑帧）
  if (now - lastRenderT > 800) render();
}

/* ============ 启动 ============ */
applyI18n();
// URL hash 坐标恢复
const hm = location.hash.match(/x=([-\d.e+]+),y=([-\d.e+]+),s=([\d.e+-]+)/);
if (hm) {
  view.x = +hm[1]; view.y = +hm[2]; view.s = +hm[3];
  target.x = view.x; target.y = view.y; target.s = view.s;
}
// #julia 或 #julia,cx,cy 测试直达
const jm = location.hash.match(/julia(?:,([-\d.e+]+),([-\d.e+]+))?/);
if (jm) {
  juliaOn = true;
  if (jm[1] !== undefined) juliaC = { x: +jm[1], y: +jm[2] };
  else juliaC = { x: view.x, y: view.y };
  view.x = 0; view.y = 0; view.s = 1.6;
  target.x = 0; target.y = 0; target.s = 1.6;
}
render();
// #dbg: 无头自检——读取像素证据写入 DOM（不影响正常使用）
if (location.hash.includes('dbg')) {
  const px = new Uint8Array(4 * 100);
  gl.readPixels(Math.floor(canvas.width/2)-5, Math.floor(canvas.height/2)-5, 10, 10, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let sum = 0; for (let i = 0; i < px.length; i++) sum += px[i];
  const el = document.getElementById('coords');
  el.innerHTML = `DBG sum=${sum} err=${gl.getError()} c=${canvas.width}x${canvas.height} fbo=${hasFloatFB ? '16F' : '8'} ` + el.innerHTML;
}
requestAnimationFrame(frame);
</script>
</body>
