<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f6f2e7">
<title>墨 · INK — 水墨流体画室</title>
<style>
  html { color-scheme: light; }
  :root {
    --ink: #2b2b33;
    --ink-light: #55555f;
    --paper: #f6f2e7;
    --seal: #b03a2e;
    --hairline: rgba(43, 43, 51, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { z-index: 1; }
  #overlay { z-index: 2; pointer-events: none; }

  /* ---------- 笔刷预览光标 ---------- */
  #brushCursor {
    position: fixed; z-index: 3; border-radius: 50%;
    border: 1.5px solid rgba(43,43,51,0.5);
    box-shadow: 0 0 0 1px rgba(246,242,231,0.6);
    pointer-events: none; display: none;
    transform: translate(-50%, -50%);
  }
  #brushCursor.water { border-style: dashed; border-color: rgba(90,120,170,0.6); }

  /* ---------- 标题 ---------- */
  .masthead {
    position: fixed; top: 26px; left: 32px; z-index: 5;
    pointer-events: none; line-height: 1.35;
  }
  .masthead h1 {
    font-size: clamp(26px, 3.6vw, 40px);
    font-weight: 600; letter-spacing: 0.12em;
    color: var(--ink);
  }
  .masthead h1 .en { font-family: Georgia, serif; font-weight: 400; font-style: italic; font-size: 0.62em; letter-spacing: 0.08em; color: var(--ink-light); margin-left: 0.4em; }
  .masthead .sub { font-size: 12.5px; color: var(--ink-light); letter-spacing: 0.35em; margin-top: 5px; }
  .masthead .rule { width: 64px; height: 1px; background: var(--hairline); margin-top: 9px; }

  /* ---------- 顶部右侧 ---------- */
  .topright { position: fixed; top: 26px; right: 32px; z-index: 6; display: flex; gap: 10px; align-items: center; }
  .btn-ghost {
    border: 1px solid var(--hairline); background: rgba(246,242,231,0.75);
    backdrop-filter: blur(6px); color: var(--ink);
    font-family: inherit; font-size: 13px; letter-spacing: 0.1em;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s;
  }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  #langBtn { min-width: 58px; text-align: center; }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 10px;
    padding: 13px 20px 12px; border: 1px solid var(--hairline); border-radius: 16px;
    background: rgba(246,242,231,0.86); backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(43,43,51,0.10);
    max-width: min(96vw, 900px);
  }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .grp .lbl { font-size: 12px; letter-spacing: 0.2em; color: var(--ink-light); margin-right: 3px; }
  .vsep { width: 1px; height: 24px; background: var(--hairline); align-self: center; }

  .chip {
    border: 1px solid var(--hairline); background: none; color: var(--ink-light);
    font-family: inherit; font-size: 12.5px; letter-spacing: 0.1em;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s, box-shadow .2s;
  }
  .chip:hover { color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .pig {
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(246,242,231,0.9); outline: 1px solid var(--hairline);
    padding: 0; transition: box-shadow .2s, transform .2s;
  }
  .pig.on { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); transform: scale(1.08); }

  .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl label { font-size: 12px; letter-spacing: 0.2em; color: var(--ink-light); white-space: nowrap; }
  .ctrl input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 104px; height: 2px; background: var(--hairline); border-radius: 2px; outline: none; cursor: pointer;
  }
  .ctrl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--paper);
    box-shadow: 0 1px 4px rgba(43,43,51,0.35); cursor: grab;
  }
  .ctrl input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--paper); cursor: grab;
  }
  .ctrl .val { font-size: 11px; color: var(--ink-light); min-width: 30px; text-align: right; font-family: Georgia, serif; }
  .ctrl input[type=text] {
    border: 1px solid var(--hairline); background: rgba(255,252,244,0.5);
    color: var(--ink); font-family: inherit; font-size: 13px; letter-spacing: 0.12em;
    padding: 5px 10px; border-radius: 6px; outline: none; width: 108px;
  }
  .ctrl input[type=text]:focus { border-color: var(--ink); }

  .btn {
    border: 1px solid transparent; background: none; color: var(--ink);
    font-family: inherit; font-size: 13px; letter-spacing: 0.18em;
    padding: 7px 14px; border-radius: 9px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(43,43,51,0.08); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.seal-on { background: var(--seal); color: #fff; }
  #saveBtn { border-color: var(--hairline); }

  /* ---------- 提示 ---------- */
  .hint {
    position: fixed; left: 50%; bottom: 168px; transform: translateX(-50%);
    z-index: 5; font-size: 13px; letter-spacing: 0.32em; color: var(--ink-light);
    pointer-events: none; opacity: 1; transition: opacity 1.6s ease;
    white-space: nowrap;
  }
  .hint.gone { opacity: 0; }

  /* ---------- 帮助 ---------- */
  .help {
    position: fixed; top: 84px; right: 32px; z-index: 7;
    width: 286px; padding: 18px 20px;
    border: 1px solid var(--hairline); border-radius: 12px;
    background: rgba(246,242,231,0.95); backdrop-filter: blur(10px);
    font-size: 12.5px; line-height: 2.05; color: var(--ink);
    box-shadow: 0 10px 40px rgba(43,43,51,0.12);
    display: none;
  }
  .help.show { display: block; }
  .help h3 { font-size: 12px; letter-spacing: 0.3em; color: var(--ink-light); font-weight: 400; margin-bottom: 6px; }
  .help .k { display: inline-block; min-width: 88px; color: var(--ink-light); }
  .help b { font-weight: 600; }
  .help .sec { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--hairline); }

  body.seal-mode #gl { cursor: crosshair; }
  body.seal-mode #brushCursor { display: none !important; }

  .home-link {
    position: fixed; left: 30px; bottom: 30px; z-index: 6;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--hairline); background: rgba(246,242,231,0.75); backdrop-filter: blur(6px);
    color: var(--ink-light); display: grid; place-items: center;
    font-size: 16px; text-decoration: none; transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .home-link:hover { color: var(--ink); border-color: var(--ink); transform: translateY(-3px); }

  /* ---------- 画册 ---------- */
  .album {
    position: fixed; inset: 0; z-index: 12; display: none;
    align-items: center; justify-content: center;
    background: rgba(43,43,51,0.32); backdrop-filter: blur(4px);
    padding: 20px;
  }
  .album.show { display: flex; }
  .album .box {
    width: min(680px, 94vw); max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
    border: 1px solid var(--hairline); border-radius: 16px;
    background: rgba(246,242,231,0.97); padding: 26px 26px 22px;
    box-shadow: 0 24px 70px rgba(43,43,51,0.35);
  }
  .album h3 { font-size: 14px; letter-spacing: 0.4em; color: var(--ink-light); font-weight: 400; }
  .album .slots { margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .slot {
    position: relative; aspect-ratio: 1.25; border: 1px solid var(--hairline); border-radius: 8px;
    background: rgba(255,252,244,0.5); cursor: pointer; overflow: hidden;
    display: grid; place-items: center;
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .slot:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43,43,51,0.14); }
  .slot img { width: 100%; height: 100%; object-fit: cover; }
  .slot .empty { font-size: 22px; color: rgba(43,43,51,0.25); }
  .slot .ts {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 10px; letter-spacing: 0.08em; color: var(--paper);
    background: rgba(43,43,51,0.55); padding: 3px 6px; text-align: center;
    font-family: Georgia, serif;
  }
  .slot .del {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
    border-radius: 50%; border: none; background: rgba(43,43,51,0.55); color: var(--paper);
    font-size: 11px; line-height: 1; cursor: pointer; display: none;
  }
  .slot:hover .del { display: block; }
  .album .acts { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }

  #fallback {
    position: fixed; inset: 0; z-index: 20; display: none;
    place-items: center; text-align: center; padding: 40px;
    background: var(--paper); font-size: 15px; line-height: 2; letter-spacing: 0.1em;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  @media (max-width: 640px) {
    .masthead { top: 14px; left: 14px; }
    .masthead h1 { font-size: 24px; }
    .topright { top: 14px; right: 14px; }
    .toolbar { padding: 8px 8px 7px; gap: 6px; bottom: 10px; border-radius: 12px; }
    .row { gap: 8px; }
    .grp { gap: 4px; }
    .grp .lbl { font-size: 10.5px; letter-spacing: 0.12em; }
    .chip { font-size: 11px; padding: 4px 8px; letter-spacing: 0.04em; }
    .pig { width: 20px; height: 20px; }
    .ctrl label { font-size: 10.5px; letter-spacing: 0.12em; }
    .ctrl input[type=range] { width: 70px; }
    .ctrl input[type=text] { width: 74px; font-size: 11.5px; padding: 4px 7px; }
    .ctrl .val { display: none; }
    .btn { font-size: 11.5px; padding: 6px 9px; letter-spacing: 0.1em; }
    .vsep { display: none; }
    .hint { bottom: 178px; font-size: 11px; letter-spacing: 0.18em; }
    .help { width: min(86vw, 286px); right: 14px; }
    .home-link { left: 14px; bottom: 14px; width: 36px; height: 36px; }
  }
</style>
</head>

<header class="masthead">

<script>
'use strict';
window.addEventListener('error', e => {
  const f = document.getElementById('fallback');
  if (f) { f.style.display = 'grid'; f.textContent = 'ERR: ' + e.message + ' @' + (e.lineno || '?'); }

/* ================================================================
   墨 · INK 2.0 — 水墨流体画室
   WebGL2 Stable Fluids + 四笔刷 / 四色墨 / 三纸质 / 撤销栈
   ================================================================ */

/* ---------------- i18n ---------------- */
const I18N = {
  zh: {
    subtitle: '水墨流体画室',
    help: '助', helpTitle: '指 南 · GUIDE',
    hDrawK: '运笔', hDraw: '按住拖动，落笔成墨',
    hSpeedK: '笔速', hSpeed: '缓行则浓，疾书则淡（飞白）',

    hSize: '笔宽增减', hBrushKeys: '切换笔刷', hUndo: '撤销一笔',

    hAutoK: '存档', hAuto: '画作自动存于本机，刷新可续',
    brush: '笔宽', density: '墨浓',
    undo: '撤销', wash: '洗纸', seal: '印章', save: '保存', album: '画册',
    albumTitle: '画 册 · 八 页', albumSave: '存 入 本 页', albumClose: '合 上', albumEmpty: '＋',

    albumLoaded: '✓ 已展开这一页', albumDeleted: '已撕去这一页',

  },

    hDrawK: 'Draw', hDraw: 'Press and drag to lay ink',

    hBrushK: 'Brushes', hBrush: 'Round washes, Hard lines, Splash drops, Water erases',
    hWaterK: 'Water', hWater: 'The water brush washes ink away',
    hSealK: 'Seal', hSeal: 'In seal mode, click to stamp',
    hSize: 'brush size –/+', hBrushKeys: 'switch brush', hUndo: 'undo a stroke',
    hColor: 'cycle ink color', hWash: 'wash paper / save artwork',
    hAutoK: 'Archive', hAuto: 'auto-saved locally — refresh to resume',
    brush: 'Brush', density: 'Ink',
    undo: 'Undo', wash: 'Wash', seal: 'Seal', save: 'Save', album: 'Album',
    albumTitle: 'ALBUM · EIGHT PAGES', albumSave: 'SAVE TO THIS PAGE', albumClose: 'CLOSE', albumEmpty: '＋',
    albumScroll: 'EXPORT SCROLL', scrollTitle: '拾 遗 · 墨 册',
    albumLoaded: '✓ page restored', albumDeleted: 'page removed',
    hint: 'EACH STROKE BECOMES INK',

let lang = localStorage.getItem('ink-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
function applyI18n() {
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (I18N[lang][k] !== undefined) el.textContent = I18N[lang][k];
  });
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  document.getElementById('frameBtn').textContent = I18N[lang].frame;
  inscEl.placeholder = I18N[lang].inscPh;
  document.title = lang === 'zh' ? '墨 · INK — 水墨流体画室' : 'INK — Ink Flow Studio';
  buildChips();
}

/* ---------------- 工具 ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- WebGL 初始化 ---------------- */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { alpha: false, preserveDrawingBuffer: true, antialias: false });
if (!gl) {
  document.getElementById('fallback').style.display = 'grid';
  throw new Error('no webgl2');
}
if (!gl.getExtension('EXT_color_buffer_float')) {
  document.getElementById('fallback').style.display = 'grid';
  throw new Error('no EXT_color_buffer_float');
}
gl.getExtension('OES_texture_float_linear');
gl.disable(gl.BLEND);
gl.disable(gl.DEPTH_TEST);

/* ---------------- 着色器 ---------------- */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s) + '\n' + src.slice(0, 120));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error('link: ' + gl.getProgramInfoLog(p));
  const uni = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    uni[info.name] = gl.getUniformLocation(p, info.name);
  }
  return { p, uni };
}

const VERT = `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
uniform vec2 texelSize;
void main(){
  vUv = aPos * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FRAG_CLEAR = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uTexture; uniform float value;
void main(){ fragColor = value * texture(uTexture, vUv); }`;

const FRAG_SPLAT = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uTarget;
uniform float aspectRatio;
uniform vec3 color;
uniform vec2 point;
uniform float radius;
uniform vec2 uDir;
uniform float uAniso;
void main(){
  vec2 p = vUv - point; p.x *= aspectRatio;
  // 各向异性：沿运笔方向拉伸（硬笔出锋）
  float len = length(uDir) + 1e-6;
  vec2 d = uDir / len;
  float pa = p.x * d.x + p.y * d.y;
  float pb = -p.x * d.y + p.y * d.x;
  pa /= uAniso;
  vec2 q = vec2(pa, pb);
  vec3 splat = exp(-dot(q,q) / radius) * color;
  vec3 base = texture(uTarget, vUv).xyz;
  fragColor = vec4(base + splat, 1.0);
}`;

const FRAG_ADVECT = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform vec2 sourceTexelSize;
uniform float dt;
uniform float dissipation;
vec4 bilerp(sampler2D sam, vec2 uv, vec2 tsize){
  vec2 st = uv / tsize - 0.5;
  vec2 iuv = floor(st); vec2 fuv = fract(st);
  vec4 a = texture(sam, (iuv + vec2(0.5,0.5)) * tsize);
  vec4 b = texture(sam, (iuv + vec2(1.5,0.5)) * tsize);
  vec4 c = texture(sam, (iuv + vec2(0.5,1.5)) * tsize);
  vec4 d = texture(sam, (iuv + vec2(1.5,1.5)) * tsize);
  return mix(mix(a,b,fuv.x), mix(c,d,fuv.x), fuv.y);
}
void main(){
  vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
  vec4 result = bilerp(uSource, coord, sourceTexelSize);
  float decay = 1.0 + dissipation * dt;
  fragColor = max(result, vec4(0.0)) / decay;
}`;

const FRAG_CURL = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uVelocity;
void main(){
  float L = texture(uVelocity, vL).y;
  float R = texture(uVelocity, vR).y;
  float T = texture(uVelocity, vT).x;
  float B = texture(uVelocity, vB).x;
  float vorticity = R - L - T + B;
  fragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
}`;

const FRAG_VORTICITY = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float curl;
uniform float dt;
void main(){
  float L = texture(uCurl, vL).x;
  float R = texture(uCurl, vR).x;
  float T = texture(uCurl, vT).x;
  float B = texture(uCurl, vB).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= curl * C;
  force.y *= -1.0;
  vec2 vel = texture(uVelocity, vUv).xy;
  vel += force * dt;
  vel = clamp(vel, -1000.0, 1000.0);
  fragColor = vec4(vel, 0.0, 1.0);
}`;

const FRAG_DIVERGENCE = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uVelocity;
void main(){
  float L = texture(uVelocity, vL).x;
  float R = texture(uVelocity, vR).x;
  float T = texture(uVelocity, vT).y;
  float B = texture(uVelocity, vB).y;
  vec2 C = texture(uVelocity, vUv).xy;
  if (vL.x < 0.0) { L = -C.x; }
  if (vR.x > 1.0) { R = -C.x; }
  if (vT.y > 1.0) { T = -C.y; }
  if (vB.y < 0.0) { B = -C.y; }
  float div = 0.5 * (R - L + T - B);
  fragColor = vec4(div, 0.0, 0.0, 1.0);
}`;

const FRAG_PRESSURE = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
void main(){
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  float div = texture(uDivergence, vUv).x;
  fragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
}`;

const FRAG_GRADIENT = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
void main(){
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  vec2 vel = texture(uVelocity, vUv).xy;
  vel -= 0.5 * vec2(R - L, T - B);
  fragColor = vec4(vel, 0.0, 1.0);
}`;

/* 水墨显示：R=墨密度，G=密度×色相坐标 → 四色颜料渐变 */
const FRAG_DISPLAY = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 fragColor;
uniform sampler2D uDye;
uniform sampler2D uPaper;
uniform vec2 texelSize;
uniform float flatPaper;
uniform vec3 paperTint;

vec3 pigment(float t){
  vec3 black = vec3(0.44, 0.46, 0.53);   /* 玄墨 */
  vec3 indigo = vec3(0.30, 0.40, 0.58);  /* 靛青 */
  vec3 ochre  = vec3(0.50, 0.36, 0.24);  /* 赭石 */
  vec3 cinna  = vec3(0.64, 0.21, 0.15);  /* 朱砂 */
  vec3 c = mix(black, indigo, smoothstep(0.0, 0.33, t));
  c = mix(c, ochre, smoothstep(0.33, 0.66, t));
  c = mix(c, cinna, smoothstep(0.66, 1.0, t));
  return c;
}
void main(){
  vec4 s  = texture(uDye, vUv);
  vec4 sL = texture(uDye, vL);
  vec4 sR = texture(uDye, vR);
  vec4 sT = texture(uDye, vT);
  vec4 sB = texture(uDye, vB);

  float d = s.x;
  float grad = abs(sL.x - sR.x) + abs(sT.x - sB.x);
  d *= 1.0 + smoothstep(0.0, 0.6, grad) * 0.55;

  float t = clamp(s.y / (s.x + 1e-5), 0.0, 1.0);
  vec3 hue = pigment(t);

  vec3 wash = mix(hue + vec3(0.34), hue, 0.35);
  vec3 heavy = hue * 0.24;
  vec3 inkTone = mix(wash, hue * 0.62, smoothstep(0.10, 0.55, d));
  inkTone = mix(inkTone, heavy, smoothstep(0.55, 1.2, d));

  float coverage = smoothstep(0.015, 0.42, d);
  vec3 paper = flatPaper > 0.5 ? vec3(1.0) : texture(uPaper, vUv).rgb * paperTint;
  float grain = 0.88 + 0.24 * paper.g;
  inkTone *= mix(1.0, grain, coverage * (1.0 - flatPaper));

  vec3 col = mix(paper, inkTone, coverage * 0.94);
  fragColor = vec4(col, 1.0);
}`;

const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function blit(target) {
  if (target === null) gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  else gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
  gl.viewport(0, 0, target === null ? gl.drawingBufferWidth : target.width,
                     target === null ? gl.drawingBufferHeight : target.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function createFBO(w, h) {
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return {
    texture: tex, fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, this.texture); return id; }
  };
}
function createDoubleFBO(w, h) {
  let fbo1 = createFBO(w, h), fbo2 = createFBO(w, h);
  return {
    width: w, height: h, texelSizeX: 1 / w, texelSizeY: 1 / h,
    get read() { return fbo1; }, set read(v) { fbo1 = v; },
    get write() { return fbo2; }, set write(v) { fbo2 = v; },
    swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t; }
  };
}

let aspect = 1;
function simDims(base) {
  aspect = canvas.width / canvas.height;
  const min = base, max = Math.round(base * Math.max(aspect, 1 / aspect));
  return aspect >= 1 ? [max, min] : [min, max];
}
const DYE_RES = 1024, SIM_RES = 144, PRESSURE_ITERS = 24;
let dye, velocity, divergence, curl, pressure;
{
  const [dw, dh] = simDims(DYE_RES);
  const [sw, sh] = simDims(SIM_RES);
  dye = createDoubleFBO(dw, dh);
  velocity = createDoubleFBO(sw, sh);
  divergence = createFBO(sw, sh);
  curl = createFBO(sw, sh);
  pressure = createDoubleFBO(sw, sh);
}

/* ---------------- 宣纸纹理 ---------------- */
const _noiseCache = new Map();
function vnoise(x, y, seed) {
  let g = _noiseCache.get(seed);
  if (!g) { g = []; const r = mulberry32(seed); for (let i = 0; i < 64 * 64; i++) g.push(r()); _noiseCache.set(seed, g); }
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const h = (a, b) => g[((b & 63) * 64 + (a & 63))];
  const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return (a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy) * 2 - 1;
}
function makePaper(size, seed, fiberStrength) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rnd = mulberry32(seed);
  ctx.fillStyle = '#f6f2e7';
  ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  const data = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      const n = vnoise(x / 96, y / 96, seed) * 6 + vnoise(x / 23, y / 23, seed + 7) * 4 * fiberStrength;
      data[i] += n * 0.6; data[i + 1] += n; data[i + 2] += n * 0.8;
    }
  }
  ctx.putImageData(img, 0, 0);
  for (let i = 0; i < size * 3 * fiberStrength; i++) {
    const x = rnd() * size, y = rnd() * size;
    const a = rnd() * Math.PI, len = 4 + rnd() * 14;
    const light = rnd() > 0.5;
    ctx.strokeStyle = light ? 'rgba(255,252,240,0.05)' : 'rgba(120,110,90,0.04)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.stroke();
  }
  for (let i = 0; i < 26; i++) {
    const x = rnd() * size, y = rnd() * size, r = 60 + rnd() * 220;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(190,178,150,0.028)');
    g.addColorStop(1, 'rgba(190,178,150,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  return c;
}

/* 纸质档案：影响流体手感与纹理 */
const PAPERS = [
  { seed: 20260821, fiber: 1.0,  curl: 30, force: 1.0,  dyeDiss: 0.0008, splatMul: 1.15, tint: [1, 1, 1] },
  { seed: 7301,     fiber: 0.45, curl: 15, force: 0.55, dyeDiss: 0.0004, splatMul: 0.85, tint: [1, 1, 1] },

  { tint: 0.33 },
  { tint: 0.66 },

const INK_CSS = ['#3a3d44', '#4d6794', '#7f5c3d', '#a33626'];

let brushType = 0; // 0圆 1硬 2泼 3水
const BRUSHES = [
  { force: 1.0,  radiusMul: 1.0,  dyeMul: 1.0 },
  { force: 0.45, radiusMul: 0.42, dyeMul: 1.35 },
  { force: 0.7,  radiusMul: 1.25, dyeMul: 0.8 },
  { force: 0.85, radiusMul: 1.05, dyeMul: 1.0 }
];
const brushRadius = () => (0.004 + Math.pow(brushSize, 1.55) * 0.055) * BRUSHES[brushType].radiusMul;

/* ---------------- 撤销栈 ---------------- */
const undoStack = [];
function snapshotDye() {
  const t = createFBO(dye.width, dye.height);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, dye.read.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, t.fbo);
  gl.blitFramebuffer(0, 0, dye.width, dye.height, 0, 0, dye.width, dye.height,
                     gl.COLOR_BUFFER_BIT, gl.NEAREST);
  undoStack.push(t);
  if (undoStack.length > 8) {
    const old = undoStack.shift();
    gl.deleteTexture(old.texture); gl.deleteFramebuffer(old.fbo);
  }
  updateUndoBtn();
}
function undo() {
  if (!undoStack.length) return;
  const t = undoStack.pop();
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, t.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dye.read.fbo);
  gl.blitFramebuffer(0, 0, dye.width, dye.height, 0, 0, dye.width, dye.height,
                     gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.deleteTexture(t.texture); gl.deleteFramebuffer(t.fbo);
  updateUndoBtn();
}
function updateUndoBtn() {
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
}

/* ---------------- Splat ---------------- */
function splat(x, y, dx, dy, dyeAmt, radiusScale, tint) {
  const r = brushRadius() * (radiusScale || 1);
  const tt = tint === undefined ? INKS[inkIdx].tint : tint;
  const amt = dyeAmt * BRUSHES[brushType].dyeMul;
  const P = PAPERS[paperIdx];
  // 各向异性：硬笔沿运笔方向拉伸 2.4 倍（出锋）
  const aniso = brushType === 1 ? 2.4 : 1.0;
  const dl = Math.hypot(dx, dy);
  const dirX = dl > 1e-6 ? dx / dl : 0;
  const dirY = dl > 1e-6 ? dy / dl : 1;
  gl.useProgram(progSplat.p);
  gl.uniform2f(progSplat.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progSplat.uni.uTarget, velocity.read.attach(0));
  gl.uniform1f(progSplat.uni.aspectRatio, aspect);
  gl.uniform2f(progSplat.uni.point, x, y);
  gl.uniform3f(progSplat.uni.color, dx * BRUSHES[brushType].force, dy * BRUSHES[brushType].force, 0);
  gl.uniform1f(progSplat.uni.radius, r * 0.6);
  gl.uniform2f(progSplat.uni.uDir, dirX, dirY);
  gl.uniform1f(progSplat.uni.uAniso, aniso);
  blit(velocity.write); velocity.swap();

  gl.uniform2f(progSplat.uni.texelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(progSplat.uni.uTarget, dye.read.attach(0));
  gl.uniform3f(progSplat.uni.color, amt * P.splatMul, amt * P.splatMul * tt, 0);
  gl.uniform1f(progSplat.uni.radius, r);
  blit(dye.write); dye.swap();
}

/* ---------------- 笔触 ---------------- */
let pointerDown = false, lastX = 0, lastY = 0, lastT = 0;
let lastInteract = performance.now();

function evtPos(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
}
function pressureOf(e) {
  return (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
}
/* 泼墨：一簇随机墨点 */
function splashBurst(x, y, scale) {
  const n = 9 + Math.floor(Math.random() * 7);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const rr = Math.random() * brushRadius() * 3.2 + brushRadius() * 0.4;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    const amt = inkDensity * (0.25 + Math.random() * 0.6) * scale;
    splat(px, py,
      Math.cos(a) * (60 + Math.random() * 220) * 0.16,
      Math.sin(a) * (60 + Math.random() * 220) * 0.16 + 30,
      amt, 0.28 + Math.random() * 0.3);
  }
}
function stats(nStrokes, nSaved) {
  try {
    const s = JSON.parse(localStorage.getItem('ink-stats') || '{"strokes":0,"saved":0}');
    if (nStrokes) s.strokes += nStrokes;
    if (nSaved) s.saved += nSaved;
    localStorage.setItem('ink-stats', JSON.stringify(s));
  } catch (e) { /* 忽略 */ }
}

canvas.addEventListener('pointerdown', e => {
  if (sealMode) { stampSeal(e.clientX, e.clientY); return; }
  pointerDown = true;
  const [x, y] = evtPos(e);
  lastX = x; lastY = y; lastT = performance.now();
  lastInteract = performance.now();
  hintEl.classList.add('gone');
  snapshotDye();
  stats(1, 0);
  const pr = pressureOf(e);
  if (brushType === 2) {
    splashBurst(x, y, 0.5 + pr * 0.8);
  } else {
    const mul = brushType === 3 ? -0.7 : (brushType === 1 ? 0.8 : 0.55);
    splat(x, y, 0, 0, inkDensity * mul * (0.45 + pr * 1.1), 0.8);
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!pointerDown || sealMode) return;
  const [x, y] = evtPos(e);
  const now = performance.now();
  const dt = Math.max((now - lastT) / 1000, 1 / 240);
  const dxUv = x - lastX, dyUv = y - lastY;
  const dist = Math.hypot(dxUv * aspect, dyUv);
  if (dist < 0.0015) return;
  const speed = dist / dt;
  const speedNorm = Math.min(speed / 1.4, 1);
  const pr = pressureOf(e);
  const amt = inkDensity * (1.25 - speedNorm * 1.05) * (0.45 + pr * 1.1);
  const steps = Math.max(1, Math.ceil(dist / (brushRadius() * 0.55)));
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const m = brushType === 3 ? -0.85 : 1;
    splat(lastX + dxUv * t, lastY + dyUv * t,
          dxUv * config.SPLAT_FORCE * dt / steps,
          dyUv * config.SPLAT_FORCE * dt / steps,
          amt * m / steps, 1);
    if (brushType === 2 && Math.random() < 0.22) {
      splat(lastX + dxUv * t + (Math.random() - 0.5) * brushRadius() * 2.4,
            lastY + dyUv * t + (Math.random() - 0.5) * brushRadius() * 2.4,
            (Math.random() - 0.5) * 40, 40 + Math.random() * 60,
            amt * 0.5, 0.3 + Math.random() * 0.25);
    }
  }
  lastX = x; lastY = y; lastT = now;
  lastInteract = now;
});

let artDirty = false;
const _origSplat = splat;
splat = function (x, y, dx, dy, dyeAmt, radiusScale, tint) {

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('ink-art', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('art');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(key, val) {
  const db = await idbOpen();
  await new Promise((res, rej) => {
    const tx = db.transaction('art', 'readwrite');
    tx.objectStore('art').put(val, key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction('art').objectStore('art').get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(key) {
  const db = await idbOpen();

    tx.oncomplete = res; tx.onerror = () => rej(tx.error);

/* 染料降采样快照（供自动存档与画册共用） */
function snapshotDyeSmall() {
  const w = dye.width, h = dye.height;
  const full = new Float32Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dye.read.fbo);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, full);
  const dw = w >> 1, dh = h >> 1;
  const small = new Float32Array(dw * dh * 2);
  for (let y = 0; y < dh; y++) for (let x = 0; x < dw; x++) {
    let r = 0, g = 0;
    for (let oy = 0; oy < 2; oy++) for (let ox = 0; ox < 2; ox++) {
      const i = ((y * 2 + oy) * w + (x * 2 + ox)) * 4;
      r += full[i]; g += full[i + 1];
    }
    const o = (y * dw + x) * 2;
    small[o] = r * 0.25; small[o + 1] = g * 0.25;
  }
  return { w: dw, h: dh, data: small };
}
/* 从快照恢复染料 */
function restoreDye(rec) {
  const dw = rec.w, dh = rec.h, w = dw * 2, h = dh * 2;
  const up = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const s = (Math.min(dh - 1, y >> 1) * dw + Math.min(dw - 1, x >> 1)) * 2;
    const o = (y * w + x) * 4;
    up[o] = rec.data[s]; up[o + 1] = rec.data[s + 1]; up[o + 2] = 0; up[o + 3] = 1;
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.FLOAT, up);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, dye.read.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dye.write.fbo);
  gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
}

/* ---------------- 闲时落墨（自动画笔演示） ---------------- */
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let nextDrop = 0;
let autoStroke = null;
function idleDrop(now, dt) {
  if (!config.idleDrop || REDUCED_MOTION) return;
  if (now - lastInteract < 8000) { autoStroke = null; return; }
  if (autoStroke) {
    const st = autoStroke;
    st.t += dt * st.speed;
    if (st.t >= 1) {
      autoStroke = null;
      nextDrop = now + 2600 + Math.random() * 2600;
      return;
    }
    const s = Math.sin(st.t * Math.PI);
    const px = st.x0 + st.dx * st.t + st.px * s * st.amp;
    const py = st.y0 + st.dy * st.t + st.py * s * st.amp;
    splat(px, py, st.vx * dt, st.vy * dt, st.dye * dt * 9, 0.85, 0);
    return;
  }
  if (now < nextDrop) return;
  // 起一笔：随机弧线
  const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
  const len = 0.22 + Math.random() * 0.3;
  const perp = ang + Math.PI / 2;
  const x0 = 0.2 + Math.random() * 0.6, y0 = 0.75 + Math.random() * 0.15;
  autoStroke = {
    t: 0,
    x0, y0,
    dx: Math.cos(ang) * len, dy: Math.sin(ang) * len,
    px: Math.cos(perp), py: Math.sin(perp),
    amp: 0.05 + Math.random() * 0.1,
    speed: 0.32 + Math.random() * 0.3,
    dye: 0.1 + Math.random() * 0.14,
    vx: Math.cos(ang) * 300, vy: Math.sin(ang) * 300
  };
}

/* ---------------- 步进 ---------------- */
function step(dt) {
  const P = PAPERS[paperIdx];
  gl.disable(gl.BLEND);

  gl.useProgram(progCurl.p);
  gl.uniform2f(progCurl.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progCurl.uni.uVelocity, velocity.read.attach(0));
  blit(curl);

  gl.useProgram(progVorticity.p);
  gl.uniform2f(progVorticity.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progVorticity.uni.uVelocity, velocity.read.attach(0));
  gl.uniform1i(progVorticity.uni.uCurl, curl.attach(1));
  gl.uniform1f(progVorticity.uni.curl, P.curl);
  gl.uniform1f(progVorticity.uni.dt, dt);
  blit(velocity.write); velocity.swap();

  gl.useProgram(progDivergence.p);
  gl.uniform2f(progDivergence.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progDivergence.uni.uVelocity, velocity.read.attach(0));
  blit(divergence);

  gl.useProgram(progClear.p);
  gl.uniform2f(progClear.uni.texelSize, pressure.texelSizeX, pressure.texelSizeY);
  gl.uniform1i(progClear.uni.uTexture, pressure.read.attach(0));
  gl.uniform1f(progClear.uni.value, config.PRESSURE);
  blit(pressure.write); pressure.swap();

  gl.useProgram(progPressure.p);
  gl.uniform2f(progPressure.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progPressure.uni.uDivergence, divergence.attach(1));
  for (let i = 0; i < PRESSURE_ITERS; i++) {
    gl.uniform1i(progPressure.uni.uPressure, pressure.read.attach(0));
    blit(pressure.write); pressure.swap();
  }

  gl.useProgram(progGradient.p);
  gl.uniform2f(progGradient.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progGradient.uni.uPressure, pressure.read.attach(0));
  gl.uniform1i(progGradient.uni.uVelocity, velocity.read.attach(1));
  blit(velocity.write); velocity.swap();

  gl.useProgram(progAdvect.p);
  gl.uniform2f(progAdvect.uni.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform2f(progAdvect.uni.sourceTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progAdvect.uni.uVelocity, velocity.read.attach(0));
  gl.uniform1i(progAdvect.uni.uSource, velocity.read.attach(0));
  gl.uniform1f(progAdvect.uni.dt, dt);
  gl.uniform1f(progAdvect.uni.dissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write); velocity.swap();

  const dyeDiss = washFrames > 0 ? 3.2 : P.dyeDiss;
  gl.uniform2f(progAdvect.uni.sourceTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(progAdvect.uni.uVelocity, velocity.read.attach(0));
  gl.uniform1i(progAdvect.uni.uSource, dye.read.attach(1));
  gl.uniform1f(progAdvect.uni.dissipation, dyeDiss);
  blit(dye.write); dye.swap();
  if (washFrames > 0) washFrames--;
}

function renderFrame(dt, forceFlat) {
  step(dt);
  const P = PAPERS[paperIdx];
  gl.useProgram(progDisplay.p);
  gl.uniform2f(progDisplay.uni.texelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(progDisplay.uni.uDye, dye.read.attach(0));
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, paperTex);
  gl.uniform1i(progDisplay.uni.uPaper, 1);
  gl.uniform1f(progDisplay.uni.flatPaper, forceFlat || flatPaperNext ? 1.0 : 0.0);
  gl.uniform3f(progDisplay.uni.paperTint, P.tint[0], P.tint[1], P.tint[2]);
  blit(null);
}

/* ---------------- 主循环 ---------------- */
let prevTime = performance.now();
function frame(now) {
  const dt = Math.min((now - prevTime) / 1000, 0.033);
  prevTime = now;
  idleDrop(now, dt);
  renderFrame(dt, false);
  requestAnimationFrame(frame);
}

/* ---------------- resize ---------------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    overlay.width = w; overlay.height = h;
  }
}
window.addEventListener('resize', resize);

/* ---------------- UI：chips / 快捷键 ---------------- */
function buildChips() {
  const bg = document.getElementById('brushGrp');
  bg.querySelectorAll('.chip').forEach(x => x.remove());
  I18N[lang].brushes.forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === brushType ? ' on' : '');
    b.textContent = name;
    b.addEventListener('click', () => { brushType = i; buildChips(); });
    bg.appendChild(b);
  });
  const pg = document.getElementById('pigGrp');
  pg.querySelectorAll('.pig').forEach(x => x.remove());
  INKS.forEach((ink, i) => {
    const b = document.createElement('button');
    b.className = 'pig' + (i === inkIdx ? ' on' : '');
    b.style.background = INK_CSS[i];
    b.setAttribute('aria-label', I18N[lang].inkNames[i]);
    b.title = I18N[lang].inkNames[i];
    b.addEventListener('click', () => { inkIdx = i; buildChips(); });
    pg.appendChild(b);
  });
  const rg = document.getElementById('paperGrp');
  rg.querySelectorAll('.chip').forEach(x => x.remove());
  I18N[lang].papers.forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === paperIdx ? ' on' : '');
    b.textContent = name;
    b.addEventListener('click', () => {
      paperIdx = i;
      uploadPaper(i);
      buildChips();
    });
    rg.appendChild(b);
  });
}

const brushSizeEl = document.getElementById('brushSize');
const inkDensityEl = document.getElementById('inkDensity');
const brushSizeVal = document.getElementById('brushSizeVal');
function updSizeVal() {
  brushSizeVal.textContent = Math.round(brushSize * 100 / 1.4);
}
brushSizeEl.addEventListener('input', () => { brushSize = +brushSizeEl.value; updSizeVal(); });
inkDensityEl.addEventListener('input', () => inkDensity = +inkDensityEl.value);

document.getElementById('undoBtn').addEventListener('click', undo);
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === '[') { brushSize = Math.max(0.1, brushSize - 0.08); brushSizeEl.value = brushSize; updSizeVal(); }
  else if (k === ']') { brushSize = Math.min(1.4, brushSize + 0.08); brushSizeEl.value = brushSize; updSizeVal(); }
  else if (k === '1' || k === '2' || k === '3' || k === '4') { brushType = +k - 1; buildChips(); }
  else if (k === 'z') { undo(); }
  else if (k === 'c') { inkIdx = (inkIdx + 1) % INKS.length; buildChips(); }
  else if (k === 'w') wash();
  else if (k === 's') saveArtwork();
});

/* ---------------- 语言 / 帮助 ---------------- */
const langBtn = document.getElementById('langBtn');
langBtn.addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('ink-lang', lang);
  applyI18n();
});
const helpPanel = document.getElementById('helpPanel');
document.getElementById('helpBtn').addEventListener('click', () => helpPanel.classList.toggle('show'));

/* ---------------- 启动 ---------------- */
applyI18n();
updSizeVal();
updateUndoBtn();
resize();
// 续档：有存档则恢复，无则落开卷三笔
loadArtArchive().then(ok => {
  if (!ok) {
    splat(0.62, 0.68, -160, -320, 0.8, 1.0, 0);
    splat(0.58, 0.62, -90, -220, 0.5, 0.6, 0);
    splat(0.66, 0.74, -220, -140, 0.35, 0.45, 0);
  }
  artDirty = false;
});
requestAnimationFrame(frame);
</script>
