<style>

  .places {

  .place {
    border: 1px solid var(--line); background: rgba(5,7,13,0.6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--dim); font-family: inherit; font-size: 12.5px; letter-spacing: 0.16em;
    padding: 8px 18px; border-radius: 999px; cursor: pointer; transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;

/* ============ i18n ============ */

    reset: 'HOME PORT', zoom: 'mag', palette: 'PAL',
    tour: '▶ TOUR', tourStop: '■ STOP', tourTip: 'auto-cruise named spots, 6s each',
    addSpot: 'MARK SPOT', delSpot: 'long-press to delete',
    juliaOn: 'JULIA', juliaOff: 'MSET', shipName: 'SHIP', newtonName: 'NEWTON',

    enterEpoch: e => `—— INTO THE ${e.toUpperCase()} ——`,

    badges: [
      { k: 'm3', mag: 1e3, line: 'One thousand deep. The sound of waves recedes into a far background.' },

    ],

    daily: '☄ TODAY', dailyDone: 'arrived today — come back tomorrow',
    logBtn: '◈ LOG', logTitle: "CAPTAIN'S LOG", logEmpty: 'You have not lingered anywhere yet.',
    logExport: 'EXPORT', logClear: 'CLEAR', logClear2: 'sure?', logReach: 'REVISIT',
    logAscent: '↑ ASCEND', logAscentTip: 'slowly surface from deepest log entry back to home port (60s)',
    logImport: 'FISH BOTTLE', logImportOk: '✓ picked up {n} entries', logImportErr: 'not a valid log JSON',
    vigilLine: n => `while you were away, it went ${n} layers deeper`,
    bottomLine: 'The lamp is still lit.\nNo one knows who tends it.',
    whispers: [
      ['The tide comes and goes; the patterns rhyme.', 'Shapes near shore will be met again far out.', 'Light is still generous here.'],
      ['Debris gathers into bands, holding for now.', 'Self-similarity: a small piece like the large one.', 'Order, in dust — not common.'],
      ['The ink stopped here, yet never dried.', 'Structure remains. The deep is not empty.', 'Shapes like echoes, recognizing each other across layers.'],

};
let lang = localStorage.getItem('fold-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
{ const hm = location.hash.match(/lang=(\w{2})/); if (hm) { lang = hm[1] === 'en' ? 'en' : 'zh'; try { localStorage.setItem('fold-lang', lang); } catch (e) {} } }
const T = () => I18N[lang];

/* ============ WebGL ============ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
if (!gl) { document.getElementById('errbox').style.display = 'block'; document.getElementById('errbox').textContent = 'WebGL2 unavailable'; throw new Error('no webgl2'); }
const hasFloatFB = !!gl.getExtension('EXT_color_buffer_float');

const VERT = `#version 300 es
precision highp float;
const vec2 verts[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
void main(){ gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0); }`;

/* ---------- Pass 1：迭代 ----------
   输出数据纹理（编码为 0..1，RGBA8 回退亦可用）：
   R = fract(0.12·t) 逃逸相位 | fract(0.08·i) 内部相位
   G = 条纹平均值（逃逸）| exp(-0.015·i) 内部辉光
   B = fract(0.5·log2(DE/像素)) 褶皱等距线相位（非全纯模式为 0）
   A = exp(-0.03·t) 边界辉光兼逃逸标志（>=0.004 为逃逸） */
const FRAG_ITER = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uCenterX;
uniform vec2 uCenterY;
uniform float uScale;
uniform vec2 uRes;
uniform float uIter;
uniform float uJulia;
uniform vec2 uCx;
uniform vec2 uCy;
uniform float uMode;   /* 0 曼德博 1 儒利亚 2 燃烧之舰 3 牛顿 */
uniform float uTier;   /* 0 单精度（浅层提速） 1 df64 2 微扰 perturbation */
uniform highp sampler2D uOrbit;   /* 参考轨道：RGBA32F (Zx_hi,Zx_lo,Zy_hi,Zy_lo) × n */
uniform float uOrbitN;
uniform vec2 uDRefX;   /* 视野中心 − 参考点（float，dd 相消后的小量） */
uniform vec2 uDRefY;

vec2 ds_add(vec2 a, vec2 b) {
  float t1 = a.x + b.x;
  float e = t1 - a.x;
  float t2 = ((b.x - e) + (a.x - (t1 - e))) + a.y + b.y;
  vec2 r;
  r.x = t1 + t2;
  r.y = t2 - (r.x - t1);
  return r;
}
vec2 ds_mul(vec2 a, vec2 b) {
  const float SPLIT = 8193.0;
  float ca = SPLIT * a.x, cb = SPLIT * b.x;
  float a_hi = ca - (ca - a.x), b_hi = cb - (cb - b.x);
  float a_lo = a.x - a_hi, b_lo = b.x - b_hi;
  float c11 = a_hi * b_hi;
  /* 修正项 = 交叉和 + 低位积（~2^-13 量级）——绝不可乘 SPLIT */
  float c21 = (a_hi * b_lo + a_lo * b_hi) + a_lo * b_lo;
  float t1 = c11 + c21;
  vec2 r;
  r.x = t1;
  r.y = c21 - (t1 - c11);
  return r;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float pix = 2.0 * uScale / uRes.y;
  bool ship = uMode > 1.5;
  bool julia = uJulia > 0.5;
  /* c（df64 构造，两档共用：像素坐标的绝对精度永远走双单） */
  vec2 cxc = ds_add(uCenterX, vec2(uv.x * uScale, 0.0));
  vec2 cyc = ds_add(uCenterY, vec2(uv.y * uScale, 0.0));

  float t = 0.0;         /* 平滑逃逸计数 / 内部计数 */
  float stripe = 0.0;    /* 条纹累加 */
  float gout = 0.0;      /* 内部辉光 */
  float lg = 0.0;        /* log2(DE/pix) */
  bool esc = false;
  float escA = 0.0;

  if (uMode > 2.5) {
    /* ---- 牛顿分形：z_{n+1} = (2z³+1)/(3z²)，引力盆地图 ---- */

  const yh = view.y, yl = view.yl;
  const mag = 1.4 / view.s;
  const busy = dragStart !== null || fly !== null || Math.abs(view.s - target.s) / target.s > 0.01;
  /* 微扰档只用于曼德博深潜；儒/舰保持 float/df64 */
  const tier = newtonMode ? 0 : (shipMode || juliaOn)
    ? (mag < 3e4 ? 0 : 1)
    : (mag < 3e4 ? 0 : mag < 3e12 ? 1 : 2);
  const iterCap = newtonMode ? 128 : tier === 2 ? 6000 : 2000;
  const iter = newtonMode ? 128 : Math.min(iterCap, Math.round((160 + 42 * Math.log2(3 / view.s) * 0.5 + 80) * (tier === 2 ? 1.4 : 1) * (busy ? 0.45 : 1)));
  const [cxh, cxl] = split64(juliaC.x);
  const [cyh, cyl] = split64(juliaC.y);
  /* 参考轨道：失效才重建（缩放差>2× / 参考点离屏 / 迭代上限增长） */
  if (tier === 2 && !orbitValid(iter)) {
    try { buildOrbit(Math.round(iter * 1.2)); } catch (e) { /* BigInt 轨道异常 → 退回 df64 */ }
  }
  gl.useProgram(progIter);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, canvas.width, canvas.height);
  /* 断开反馈环：pass2 曾把 dataTex 留在单元 0（即本 FBO 的目标纹理） */
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, null);
  gl.uniform2f(UI.uCenterX, xh, xl);
  gl.uniform2f(UI.uCenterY, yh, yl);
  gl.uniform1f(UI.uScale, view.s);
  gl.uniform2f(UI.uRes, canvas.width, canvas.height);
  gl.uniform1f(UI.uIter, iter);
  gl.uniform1f(UI.uJulia, juliaOn ? 1.0 : 0.0);
  gl.uniform2f(UI.uCx, cxh, cxl);
  gl.uniform2f(UI.uCy, cyh, cyl);
  gl.uniform1f(UI.uMode, newtonMode ? 3.0 : shipMode ? 2.0 : 0.0);
  const usePert = tier === 2 && orbit && orbit.n >= 32;
  gl.uniform1f(UI.uTier, usePert ? 2.0 : (tier === 0 ? 0.0 : 1.0));
  if (usePert) {
    const dxr = ddAdd(view.x, view.xl, -orbit.rx, -orbit.rxl);
    const dyr = ddAdd(view.y, view.yl, -orbit.ry, -orbit.ryl);
    gl.uniform1f(UI.uOrbitN, orbit.n);
    gl.uniform2f(UI.uDRefX, dxr[0] + dxr[1], 0);
    gl.uniform2f(UI.uDRefY, dyr[0] + dyr[1], 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, orbitTex);
    gl.uniform1i(UI.uOrbit, 1);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  lastIter = iter;
  lastRenderT = performance.now();
}
function renderColor() {
  const mag = 1.4 / view.s;
  gl.useProgram(progColor);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dataTex);
  gl.uniform1i(UC.uData, 0);
  gl.uniform1f(UC.uPhase, phaseT);
  gl.uniform1f(UC.uPal, palIdx);
  gl.uniform1f(UC.uStratum, Math.min(1, Math.max(0, Math.log10(Math.max(mag, 1)) / 13)));
  gl.uniform1f(UC.uNewton, newtonMode ? 1.0 : 0.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function render() {
  renderIter();
  renderColor();
  renderTrail();
  updateCoords();
}
/* ---------- 深潜拉丝：缩放越快拖影越长，静止即锐利 ---------- */
let trailPrevS = 1, trailFilled = false, trailPivot = [0, 0], trailIdleFrames = 0;
function renderTrail() {
  const k = trailPrevS / view.s;   /* >1 = 正在下潜 */
  const zooming = k > 0.998 || k < 1.002;   /* ±0.2% 内视为正在缩放 */
  if (trailFilled && k > 1.0015 && k < 1.6) {
    gl.useProgram(progTrail);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, prevTex);
    gl.uniform1i(UT.uPrev, 0);
    gl.uniform2f(UT.uRes, canvas.width, canvas.height);
    gl.uniform1f(UT.uK, Math.min(1.35, 1 + (k - 1) * 14));
    gl.uniform2f(UT.uPivot, trailPivot[0], trailPivot[1]);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disable(gl.BLEND);
  }
  /* 前帧拷贝（下一拉丝的素材）——静止 5 帧后跳过以省 GPU 带宽 */
  if (prevTex && (zooming || !trailFilled || (trailIdleFrames || 0) < 5)) {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, prevTex);
    gl.copyTexSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 0, 0, canvas.width, canvas.height);
    trailFilled = true;
    trailIdleFrames = zooming ? 0 : (trailIdleFrames || 0) + 1;
  }
  trailPrevS = view.s;
}

    { roots: ['宿墨', '一线', '干毫', '沉墨', '夜痕', '未干'], tails: ['井', '痕', '渊', '层', '底', '隙'] },
    { roots: ['将尽', '冷油', '残焰', '芯影', '半明', '守夜'], tails: ['芯', '海', '焰', '影', '塔', '域'] }
  ],
  en: [
    { roots: ['White Sail', 'Ebb', 'Torii', 'Reef Ring', 'Moon Isle', 'Evening Wind'], tails: [' Isle', ' Bay', ' Gate', ' Flat', 's', ' Cape'] },
    { roots: ['Hanging Dust', 'Old Star', 'Debris', 'Flow Track', 'Murmur', 'Far Grit'], tails: [' Belt', ' Plain', ' Trench', ' Station', ' Desert', ' Ring'] },

function h32(a, b, c) {
  let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1103515245) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

  { x: -0.514723, y: 0.526514, s: 4e-4, h: '风把这里吹成了鳞片。', he: 'The wind has scaled this place.' },

function epochOf(mag) {
  if (mag >= 1e13) return 4;   // 触底
  if (mag >= 1e10) return 3;
  if (mag >= 1e7) return 2;
  if (mag >= 1e4) return 1;
  if (mag >= 100) return 0;
  return -1;
}
function deepZoneName(mag, x, y, s) {
  const ep = epochOf(mag);
  if (ep < 0) return '';
  /* 纪元跨越提示（一次性小字） */
  if (curEpoch !== ep) {
    if (curEpoch >= 0 && ep > curEpoch && ep <= 3) {
      const h = document.getElementById('hint');
      h.textContent = T().enterEpoch(T().epochs[ep]);
      h.classList.remove('gone');
      setTimeout(() => h.classList.add('gone'), 2600);
    }
    curEpoch = ep;
  }
  if (ep === 4) {
    return `<br><span style="color:var(--gold);font-size:11px;letter-spacing:0.2em">◈ ${T().deepest}</span>`;
  }
  const cell = Math.max(1.6 * s, 1e-13);
  const ix = Math.floor(x / cell), iy = Math.floor(y / cell);
  const px2 = Math.floor(ix / 12), py2 = Math.floor(iy / 12);
  const pool = ZONE_POOLS[lang][ep];
  const root = pool.roots[Math.floor(h32(px2, py2, ep) * pool.roots.length)];
  const tail = pool.tails[Math.floor(h32(ix, iy, ep + 7) * pool.tails.length)];
  return `<br><span style="color:var(--gold);font-size:11px;letter-spacing:0.2em">◈ ${root}${tail}</span>`;
}

/* ============ 交互 ============ */
let dragStart = null, moved = false;
canvas.addEventListener('pointerdown', e => {
  dragStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, vxl: view.xl, vyl: view.yl };
  moved = false;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragStart) return;
  const dx = (e.clientX - dragStart.x) / innerHeight * 2 * view.s;
  const dy = (e.clientY - dragStart.y) / innerHeight * 2 * view.s;
  if (Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y) > 4) moved = true;
  const nx = ddAddD(dragStart.vx, dragStart.vxl, -dx);
  const ny = ddAddD(dragStart.vy, dragStart.vyl, dy);
  view.x = nx[0]; view.xl = nx[1];
  view.y = ny[0]; view.yl = ny[1];
  target.x = view.x; target.y = view.y; target.s = view.s; target.xl = view.xl; target.yl = view.yl;
  fly = null;
  document.getElementById('hint').classList.add('gone');
  requestRender();
});
window.addEventListener('pointerup', () => { dragStart = null; canvas.classList.remove('dragging'); });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(e.deltaY * 0.0016);
  zoomAt(e.clientX, e.clientY, f);
  fly = null;
  document.getElementById('hint').classList.add('gone');
}, { passive: false });

function zoomAt(cx, cy, f) {
  const ns = Math.max(MAG_LIMIT * 1.4, Math.min(2.5, target.s * f));
  const kx = (cx - innerWidth / 2) / innerHeight * 2;
  const ky = -(cy - innerHeight / 2) / innerHeight * 2;
  const ratio = ns / target.s;
  const nx = ddAddD(target.x, target.xl, kx * target.s * (1 - ratio));
  const ny = ddAddD(target.y, target.yl, ky * target.s * (1 - ratio));
  target.x = nx[0]; target.xl = nx[1];
  target.y = ny[0]; target.yl = ny[1];
  target.s = ns;
  trailPivot = [(cx / innerWidth) * 2 - 1, 1 - (cy / innerHeight) * 2];
  requestRender();
}
canvas.addEventListener('dblclick', e => {
  zoomAt(e.clientX, e.clientY, 0.32);
  fly = null;
});

/* 触屏双指缩放 */
const touches = new Map();
canvas.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') touches.set(e.pointerId, e); });
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && touches.has(e.pointerId)) {
    touches.set(e.pointerId, e);
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      if (canvas._lastPinch) {
        zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, canvas._lastPinch / dist);
      }
      canvas._lastPinch = dist;
    }
  }
});
window.addEventListener('pointerup', e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) canvas._lastPinch = null;
});

      lp = setTimeout(() => {

      x: view.x, y: view.y, s: view.s, xl: view.xl, yl: view.yl

/* ============ 每日星球 & 航行日志 ============ */
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dailySpot() {
  let s = 0;
  for (const ch of todayKey()) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  return DAILY_POOL[s % DAILY_POOL.length];
}
let dailyActive = null;

let log = [];
try { log = JSON.parse(localStorage.getItem('fold-log') || '[]'); } catch (e) {}
const saveLog = () => { try { localStorage.setItem('fold-log', JSON.stringify(log)); } catch (e) {} };

function zoneNamePlain(mag, x, y, s) {
  const ep = epochOf(mag);
  if (ep < 0) return lang === 'zh' ? '母港' : 'Home Port';
  if (ep === 4) return T().deepest;
  const cell = Math.max(1.6 * s, 1e-13);
  const ix = Math.floor(x / cell), iy = Math.floor(y / cell);
  const pool = ZONE_POOLS[lang][ep];
  const root = pool.roots[Math.floor(h32(Math.floor(ix / 12), Math.floor(iy / 12), ep) * pool.roots.length)];
  const tail = pool.tails[Math.floor(h32(ix, iy, ep + 7) * pool.tails.length)];
  return root + tail;
}
/* 停留记录：同一量化格+深度桶稳定 3 秒即入志（巡航亦计；纯待机深潜不计） */
let dwellSig = '', dwellT0 = 0, lastLoggedSig = '';
function dwellCheck(now) {
  const mag = 1.4 / view.s;
  if (mag < 100 || fly || dragStart) { dwellSig = ''; return; }
  const cell = Math.max(1.6 * view.s, 1e-13);
  const sig = `${Math.floor(view.x / cell)}|${Math.floor(view.y / cell)}|${Math.round(Math.log2(view.s))}|${epochOf(mag)}`;
  if (sig !== dwellSig) { dwellSig = sig; dwellT0 = now; return; }
  if (now - dwellT0 < 3000 || sig === lastLoggedSig) return;
  if (now - lastInteractF > 60000 && !tourOn) return;   // 纯待机不记
  lastLoggedSig = sig;
  let img = '';
  try {

/* 找最有趣的区域：读取画布像素，计算局部方差，选方差最高的子区域 */
function findInterestingSpot() {
  // 渲染当前帧到画布
  render();
  // 从画布读取低分辨率采样（8×6 网格）
  const SX = 8, SY = 6;
  const cw = Math.floor(canvas.width / SX), ch2 = Math.floor(canvas.height / SY);
  const pixels = new Uint8Array(4);
  const scores = [];
  for (let sy = 0; sy < SY; sy++) {
    for (let sx = 0; sx < SX; sx++) {
      // 每个格子中心采一个点
      const px2 = Math.floor((sx + 0.5) * cw);
      const py2 = Math.floor((sy + 0.5) * ch2);
      gl.readPixels(px2, py2, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      // 也采四个角用于方差
      const p2 = new Uint8Array(4);
      const samples = [];
      for (const [ox, oy] of [[0,0],[cw-1,0],[0,ch2-1],[cw-1,ch2-1],[cw>>1,ch2>>1]]) {
        gl.readPixels(px2 - (cw>>1) + ox, py2 - (ch2>>1) + oy, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p2);
        samples.push(p2[0] + p2[1] + p2[2]);
      }
      // 计算方差
      const mean = samples.reduce((a,b) => a+b, 0) / samples.length;
      const variance = samples.reduce((a,b) => a + (b - mean) ** 2, 0) / samples.length;
      // 也考虑绝对亮度（太暗的内部不太有趣）
      const brightness = pixels[0] + pixels[1] + pixels[2];
      scores.push({ sx, sy, score: variance + brightness * 0.1 });
    }
  }
  // 选分数最高的区域（黄金分割带内的候选加权——构图偏好，非纯随机）
  scores.sort((a, b) => b.score - a.score);
  const top = scores.slice(0, 3);
  top.forEach(s2 => {
    const gx = Math.abs((s2.sx + 0.5) / SX - 0.382) < 0.12 || Math.abs((s2.sx + 0.5) / SX - 0.618) < 0.12;
    const gy = Math.abs((s2.sy + 0.5) / SY - 0.382) < 0.15 || Math.abs((s2.sy + 0.5) / SY - 0.618) < 0.15;
    if (gx && gy) s2.score *= 1.35;
  });
  top.sort((a, b) => b.score - a.score);
  const best = top[Math.floor(Math.random() * Math.min(2, top.length))];  // 前二随机
  // 转换为坐标
  const u = (best.sx + 0.5) / SX - 0.5;
  const v = 0.5 - (best.sy + 0.5) / SY;
  const nx = ddAddD(view.x, view.xl, u * view.s * 2);
  const ny = ddAddD(view.y, view.yl, v * view.s * 2);
  return {
    x: nx[0], xl: nx[1],
    y: ny[0], yl: ny[1],
    s: view.s * (0.3 + Math.random() * 0.25)  // 缩小 25-45%
  };
}
function tourNext() {
  if (!tourOn) return;
  /* 叙事巡航四段：扫掠（退远全景）→ 锁定 → 深潜 → 抵达（低语+命名） */

}

/* 明信片导出：邮票边 + 圆形邮戳 + 竖排题款 + 朱印（与墨装裱/纸间明信片成信物体系） */
function exportPostcard() {
  render();  // 同帧捕获（无需 preserveDrawingBuffer）
  const M = 64;                                    // 纸边
  const W0 = canvas.width, H0 = canvas.height;
  const out = document.createElement('canvas');
  out.width = W0 + M * 2; out.height = H0 + M * 2;
  const c = out.getContext('2d');
  /* 宣纸底 */
  c.fillStyle = '#efe8d5';
  c.fillRect(0, 0, out.width, out.height);
  c.fillStyle = 'rgba(120,96,54,0.06)';
  for (let i = 0; i < 300; i++) c.fillRect(Math.random() * out.width, Math.random() * out.height, 1.5, 1.5);
  /* 主景 + 双线画框 */
  c.drawImage(canvas, M, M, W0, H0);
  c.strokeStyle = 'rgba(60,48,30,0.65)'; c.lineWidth = 2;
  c.strokeRect(M - 5, M - 5, W0 + 10, H0 + 10);
  c.strokeStyle = 'rgba(60,48,30,0.3)'; c.lineWidth = 1;
  c.strokeRect(M - 11, M - 11, W0 + 22, H0 + 22);
  /* 邮票：右上角，锯齿边 */
  const sw = 132, sh = 100, sx = out.width - M - sw + 18, sy = M - 26;
  c.save();
  c.fillStyle = '#f8f4ea';
  c.fillRect(sx, sy, sw, sh);
  c.beginPath();
  c.rect(sx, sy, sw, sh);
  c.clip();
  const thumbW = sw - 20, thumbH = sh - 26;
  const k = Math.min(thumbW / W0, thumbH / H0);
  c.drawImage(canvas, sx + 10, sy + 12, W0 * k, H0 * k);
  c.restore();
  c.save();
  c.globalCompositeOperation = 'destination-out';
  c.fillStyle = '#000';
  for (let x = sx; x <= sx + sw; x += 9) { c.beginPath(); c.arc(x, sy, 2.6, 0, 7); c.fill(); c.beginPath(); c.arc(x, sy + sh, 2.6, 0, 7); c.fill(); }
  for (let y = sy; y <= sy + sh; y += 9) { c.beginPath(); c.arc(sx, y, 2.6, 0, 7); c.fill(); c.beginPath(); c.arc(sx + sw, y, 2.6, 0, 7); c.fill(); }
  c.restore();
  /* 圆形邮戳：盖在邮票一角 */
  const mag = 1.4 / view.s;
  const zx = zoneNamePlain(mag, view.x, view.y, view.s);
  const d = new Date();
  const px3 = sx + sw * 0.62, py3 = sy + sh * 0.78;
  c.strokeStyle = 'rgba(60,60,80,0.55)'; c.lineWidth = 1.4;
  c.beginPath(); c.arc(px3, py3, 34, 0, 7); c.stroke();
  c.beginPath(); c.arc(px3, py3, 27, 0, 7); c.lineWidth = 0.7; c.stroke();
  c.fillStyle = 'rgba(60,60,80,0.65)';
  c.font = '9px Georgia';
  c.textAlign = 'center';
  c.fillText(`${(lang === 'zh' ? '拾遗 · 褶皱' : 'FOLD')}`, px3, py3 - 12);
  c.fillText(`${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`, px3, py3 + 16);
  c.font = '10px Georgia';
  c.fillText('×10' + Math.round(Math.log10(mag)), px3, py3 + 3);
  /* 竖排题款：地名 + 深度 */
  c.fillStyle = 'rgba(51,44,34,0.85)';
  c.font = `${Math.max(18, Math.round(out.width * 0.024))}px "Songti SC","STSong","SimSun",serif`;
  c.textAlign = 'center';
  const title = lang === 'zh' ? zx : zx;
  let ty = M + 30;
  for (const ch of title.slice(0, 8)) { c.fillText(ch, M - 26, ty); ty += c.measureText('褶').width + 4; }
  c.font = '11px Georgia';
  c.fillStyle = 'rgba(51,44,34,0.55)';
  c.fillText(`10^${Math.round(Math.log10(mag))}`, M - 26, ty + 6);
  /* 朱印：右下 */
  const sealS = 42, sealX = out.width - M - sealS + 8, sealY = out.height - M - sealS + 8;
  c.fillStyle = '#9e3528';
  c.beginPath();
  if (c.roundRect) c.roundRect(sealX, sealY, sealS, sealS, 6);
  else c.rect(sealX, sealY, sealS, sealS);
  c.fill();
  c.fillStyle = '#f3e2c8';
  c.font = `${Math.round(sealS * 0.56)}px "Songti SC","STSong","SimSun",serif`;
  c.fillText(lang === 'zh' ? '褶' : 'F', sealX + sealS / 2, sealY + sealS * 0.7);
  /* 底部坐标行 */
  c.fillStyle = 'rgba(51,44,34,0.5)';
  c.font = '10px Georgia';
  c.textAlign = 'left';
  c.fillText(`RE ${view.x.toPrecision(12)}  IM ${view.y.toPrecision(12)}  ·  ${lang === 'zh' ? '从褶皱寄回' : 'from the Fold'}`, M, out.height - 22);
  const a = document.createElement('a');
  a.download = `fold-postcard-${Date.now()}.png`;
  a.href = out.toDataURL('image/png');
  if (location.hash.includes('preview')) {
    /* #preview：明信片留在屏幕上供无头验证 */
    out.style.cssText = 'position:fixed;inset:0;z-index:99;object-fit:contain;width:100%;height:100%';
    document.body.appendChild(out);
    setTimeout(() => { out.remove(); }, 8000);
  } else {
    a.click();
  }
  flashTitle(shotBtn, T().shotOk);
}

function applyI18n() {
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
  document.title = lang === 'zh' ? '褶皱 · FOLD — 分形星球' : 'FOLD — Fractal Planet';
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  document.getElementById('shareBtn').textContent = T().share;
  document.getElementById('resetBtn').textContent = T().reset;
  updTourBtn();
  document.getElementById('shotBtn').textContent = T().shot;
  updSndBtn();
  palBtn.textContent = T().palette + ' ' + PAL_NAMES[lang][palIdx];
  palBtn.title = T().palTip;
  updateJuliaBtn();
  document.getElementById('hint').textContent = T().hint;
  buildPlaces();
  updateCoords();
}

/* ============ 计数音景（纯数学生成，默认静音） ============ */
/* 深度越深，drone 越稀薄、计数脉冲间隔越长——"数得越慢" */
let FAC = null, sndOn = false, droneNodes = null, pulseTimer = null;
try { sndOn = localStorage.getItem('fold-snd') === '1'; } catch (e) {}
function audioCtx() {
  if (!FAC) { try { FAC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (FAC.state === 'suspended') FAC.resume();
  return FAC;
}
function updSndBtn() {
  const b = document.getElementById('sndBtn');
  b.textContent = T().sndOn === '♪ 声' ? (sndOn ? '♪ 声' : '♪ 静') : (sndOn ? '♪ SND' : '♪ MUTE');
  b.title = T().sndTip;
}
function stratumNow() { return Math.min(1, Math.max(0, Math.log10(Math.max(1.4 / view.s, 1)) / 13)); }
function startDrone() {
  const ac = audioCtx();
  if (!ac) return;
  stopDrone();
  const masterG = ac.createGain(); masterG.gain.value = 0.05;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.value = 1200;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.type = 'sine'; o2.type = 'sine';
  o1.frequency.value = 110; o2.frequency.value = 111.7;
  o1.connect(lp); o2.connect(lp); lp.connect(masterG); masterG.connect(ac.destination);
  o1.start(); o2.start();
  droneNodes = { masterG, lp, o1, o2 };
}
function stopDrone() {
  if (!droneNodes) return;
  try { droneNodes.o1.stop(); droneNodes.o2.stop(); } catch (e) {}
  droneNodes = null;
}
function updDrone() {
  if (!droneNodes || !FAC) return;
  const s = stratumNow();
  const t = FAC.currentTime;
  droneNodes.o1.frequency.setTargetAtTime(160 * Math.pow(2, -s * 1.3), t, 0.8);
  droneNodes.o2.frequency.setTargetAtTime(160 * Math.pow(2, -s * 1.3) * 1.0075, t, 0.8);
  droneNodes.lp.frequency.setTargetAtTime(1200 - s * 1060, t, 0.8);
}
function countPulse() {
  if (!sndOn || !FAC) return;
  const s = stratumNow();
  const ac = FAC, t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(660, t);
  o.frequency.exponentialRampToValueAtTime(440, t + 0.12);
  g.gain.setValueAtTime(0.035 * (1 - s * 0.7), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.2);
  pulseTimer = setTimeout(countPulse, (1200 + s * 7800) * (0.85 + Math.random() * 0.3));
}
document.getElementById('sndBtn').addEventListener('click', () => {
  sndOn = !sndOn;
  try { localStorage.setItem('fold-snd', sndOn ? '1' : '0'); } catch (e) {}
  updSndBtn();
  if (sndOn) { startDrone(); updDrone(); clearTimeout(pulseTimer); countPulse(); }
  else { stopDrone(); clearTimeout(pulseTimer); }
});
setInterval(() => { if (sndOn) updDrone(); }, 2500);

/* ============ 待机深潜 ============ */
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastInteractF = performance.now();
let idleDiveMag0 = 0;   /* 待机深潜开始时的深度——回来时报告差值 */
['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, () => {
    const wasIdle = performance.now() - lastInteractF > 30000;
    lastInteractF = performance.now();
    /* 待机守夜：回来时报告"你不在时，它又深了 X 层" */
    if (wasIdle && idleDiveMag0 > 0) {
      const now3 = Math.round(Math.log10(1.4 / view.s));
      const then = Math.round(Math.log10(idleDiveMag0));
      if (now3 - then >= 1) showToast(T().vigilLine(now3 - then), 5000);
      idleDiveMag0 = 0;
    }
  }, { passive: true }));

/* ============ 渲染循环 ============ */
let renderPending = false, colorPending = false;
function requestRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; render(); });
}
function requestColor() {
  if (colorPending) return;
  colorPending = true;
  requestAnimationFrame(() => { colorPending = false; renderColor(); });
}
let prev = performance.now();
let foldHidden = false;
document.addEventListener('visibilitychange', () => {
  foldHidden = document.hidden;
  if (!foldHidden) prev = performance.now();
});
function frame(now) {
  requestAnimationFrame(frame);
  if (foldHidden) return;
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  if (fly) {
    const t = Math.min(1, (now - fly.t0) / fly.dur);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;  // easeInOutQuad
    view.s = Math.exp(Math.log(fly.s0) + (Math.log(fly.s1) - Math.log(fly.s0)) * e);
    /* 双单插值：端点差用 dd 精确求出，再乘缓动系数加回 */
    const dxa = ddAdd(fly.x1, fly.x1l, -fly.x0, -fly.x0l);
    const dya = ddAdd(fly.y1, fly.y1l, -fly.y0, -fly.y0l);
    const nx = ddAddD(...ddMulD(dxa[0], dxa[1], e), 0);
    const px = ddAdd(fly.x0, fly.x0l, nx[0], nx[1]);
    const ny2 = ddAddD(...ddMulD(dya[0], dya[1], e), 0);
    const py = ddAdd(fly.y0, fly.y0l, ny2[0], ny2[1]);
    view.x = px[0]; view.xl = px[1];
    view.y = py[0]; view.yl = py[1];
    target.x = view.x; target.y = view.y; target.s = view.s; target.xl = view.xl; target.yl = view.yl;
    if (t >= 1) fly = null;
    requestRender();
  } else {
    // 待机深潜：闲置 25s 缓缓深入（屏保）；reduced-motion 用户跳过
    if (!REDUCED_MOTION && !newtonMode && now - lastInteractF > 25000) {
      if (idleDiveMag0 === 0) idleDiveMag0 = 1.4 / view.s;
      target.s = Math.max(MAG_LIMIT * 1.4, target.s * Math.exp(-dt * 0.07));
    }
    // 平滑追踪：view 指数逼近 target（惯性缩放）
    const k = 1 - Math.exp(-dt * 9);
    const dxs = (target.s - view.s) / view.s;
    const dxy = Math.hypot(target.x - view.x, target.y - view.y) / Math.max(target.s, 1e-30);
    if (Math.abs(dxs) > 1e-4 || dxy > 1e-4) {
      view.s = Math.exp(Math.log(view.s) + Math.log(target.s / view.s) * k);
      const dxa = ddAdd(target.x, target.xl, -view.x, -view.xl);
      const dya = ddAdd(target.y, target.yl, -view.y, -view.yl);
      const nx = ddAddD(...ddMulD(dxa[0], dxa[1], k), 0);
      const px = ddAdd(view.x, view.xl, nx[0], nx[1]);
      const ny2 = ddAddD(...ddMulD(dya[0], dya[1], k), 0);
      const py = ddAdd(view.y, view.yl, ny2[0], ny2[1]);
      view.x = px[0]; view.xl = px[1];
      view.y = py[0]; view.yl = py[1];
      requestRender();
    }
  }
  // 停留入志（航行日志）
  dwellCheck(now);
  // 每日星球抵达判定：到位且稳定 1.5s 盖戳
  if (dailyActive && !fly) {
    const sp = dailyActive.sp;
    const near = Math.abs(view.s - sp.s) / sp.s < 0.6 &&
      Math.hypot(view.x - sp.x, view.y - sp.y) < sp.s * 0.6;
    if (near) {
      dailyActive.since = dailyActive.since || now;
      if (now - dailyActive.since > 1500) {
        stats.daily[todayKey()] = true;
        saveStats();
        showToast('✓ ' + T().dailyDone, 4200);
        dailyActive = null;
        buildPlaces();
      }
    } else dailyActive.since = 0;
  }
  // 空闲补帧：按需渲染下，长闲置后缓冲可能被回收（截图/标签页恢复时看到黑帧）
  if (now - lastRenderT > 800) render();
}

/* ============ 启动 ============ */
applyI18n();
// URL hash 坐标恢复（含双单低位 dx/dy，旧链接向后兼容）
const hm = location.hash.match(/x=([-\d.e+]+),y=([-\d.e+]+),s=([\d.e+-]+)/);
if (hm) {
  view.x = +hm[1]; view.y = +hm[2]; view.s = +hm[3];
  const dl = location.hash.match(/dx=([-\d.e+]+),dy=([-\d.e+]+)/);
  view.xl = dl ? +dl[1] : 0;
  view.yl = dl ? +dl[2] : 0;
  target.x = view.x; target.y = view.y; target.s = view.s; target.xl = view.xl; target.yl = view.yl;
}
// #julia 或 #julia,cx,cy 测试直达
const jm = location.hash.match(/julia(?:,([-\d.e+]+),([-\d.e+]+))?/);
if (jm) {
  juliaOn = true;
  if (jm[1] !== undefined) juliaC = { x: +jm[1], y: +jm[2] };
  else juliaC = { x: view.x, y: view.y };
  view.x = 0; view.y = 0; view.s = 1.6;
  target.x = 0; target.y = 0; target.s = 1.6;
}
render();
// #bench：性能基准——不同深度的帧时间写入 DOM
if (location.hash.includes('bench')) {
  const depths = [
    { s: 0.01, label: '1e2·float' },
    { s: 1e-5, label: '1e5·float' },
    { s: 1e-8, label: '1e8·df64' },
    { s: 1e-11, label: '1e11·df64' },
    { s: 1e-14, label: '1e14·perturb' },
    { s: 1e-17, label: '1e17·perturb' }
  ];
  const results = [];
  let di = 0;
  function benchNext() {
    if (di >= depths.length) {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;top:8px;left:8px;z-index:99;background:#000;color:#0f0;font:11px monospace;padding:6px;white-space:pre;pointer-events:none';
      el.textContent = 'BENCH\n' + results.map(r => `${r.label}: ${r.ms.toFixed(1)}ms`).join('\n');
      document.body.appendChild(el);
      return;
    }
    const d = depths[di];
    view.x = -0.7435; view.y = 0.1314; view.s = d.s;
    view.xl = 0; view.yl = 0;
    target.x = view.x; target.y = view.y; target.s = d.s;
    // 渲染 5 次取平均
    const times = [];
    for (let r = 0; r < 5; r++) {
      const t0 = performance.now();
      renderIter();
      renderColor();
      times.push(performance.now() - t0);
    }
    results.push({ label: d.label, ms: times.reduce((a, b) => a + b, 0) / times.length });
    di++;
    setTimeout(benchNext, 50);
  }
  benchNext();
}
// #postcard：自动生成明信片预览（#preview 留屏）
if (location.hash.includes('postcard')) {
  setTimeout(exportPostcard, 1200);
}
// #newton：牛顿分形直达
if (location.hash.includes('newton')) {
  newtonMode = true;
  view.x = 0; view.y = 0; view.s = 2.0; view.xl = 0; view.yl = 0;
  target.x = 0; target.y = 0; target.s = 2.0; target.xl = 0; target.yl = 0;
  updateJuliaBtn();
  render();
}
// #grid=1：构图网格直达
if (location.hash.includes('grid=1')) document.getElementById('grid').classList.add('on');
// #dbg: 无头自检——读取像素证据写入 DOM（不影响正常使用）
if (location.hash.includes('dbg')) {
  const px = new Uint8Array(4 * 100);
  gl.readPixels(Math.floor(canvas.width/2)-5, Math.floor(canvas.height/2)-5, 10, 10, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let sum = 0; for (let i = 0; i < px.length; i++) sum += px[i];
  const el = document.getElementById('coords');
  el.innerHTML = `DBG sum=${sum} err=${gl.getError()} c=${canvas.width}x${canvas.height} fbo=${hasFloatFB ? '16F' : '8'} ` + el.innerHTML;
}
requestAnimationFrame(frame);
</script>
