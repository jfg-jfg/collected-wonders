<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>褶皱 · FOLD — 分形星球</title>
<style>
  html { color-scheme: dark; }
  :root {
    --txt: #dfe6ef;
    --dim: rgba(223,230,239,0.55);
    --line: rgba(223,230,239,0.16);
    --gold: #d9b57c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", Georgia, serif;
    background: #05070d; color: var(--txt);
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #gl.dragging { cursor: grabbing; }

  .masthead { position: fixed; top: 24px; left: 30px; z-index: 5; pointer-events: none; }
  .masthead h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 600; letter-spacing: 0.16em; }
  .masthead h1 .en { font-size: 0.55em; font-style: italic; color: var(--gold); margin-left: 0.5em; letter-spacing: 0.1em; }
  .coords {
    margin-top: 8px; font-size: 12px; letter-spacing: 0.14em; color: var(--dim);
    font-family: Georgia, serif; line-height: 1.9;
  }

  .topright { position: fixed; top: 24px; right: 26px; z-index: 5; display: flex; gap: 8px; }
  .btn-ghost {
    border: 1px solid var(--line); background: rgba(5,7,13,0.55); backdrop-filter: blur(6px);
    color: var(--dim); font-family: inherit; font-size: 12px; letter-spacing: 0.12em;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .2s, opacity .2s;
  }
  .btn-ghost:hover { color: var(--gold); border-color: var(--gold); }

  .places {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    max-width: 94vw;
  }
  .place {
    border: 1px solid var(--line); background: rgba(5,7,13,0.6); backdrop-filter: blur(8px);
    color: var(--dim); font-family: inherit; font-size: 12.5px; letter-spacing: 0.16em;
    padding: 8px 18px; border-radius: 999px; cursor: pointer; transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .place:hover, .place.on { color: var(--gold); border-color: var(--gold); }

  .hint {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%);
    z-index: 4; font-size: 12px; letter-spacing: 0.3em; color: var(--dim);
    pointer-events: none; transition: opacity 2s; white-space: nowrap;
  }
  .hint.gone { opacity: 0; }

  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #errbox { position: fixed; inset: auto 0 0 0; z-index: 99; background: #401414; color: #ffb4b4; font-size: 12px; padding: 8px 12px; display: none; }

  .home-link {
    position: fixed; left: 28px; bottom: 28px; z-index: 6;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(5,7,13,0.55); backdrop-filter: blur(6px);
    color: var(--txt); display: grid; place-items: center;
    font-size: 16px; text-decoration: none; transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .home-link:hover { color: var(--gold); border-color: var(--gold); transform: translateY(-3px); }

  @media (max-width: 640px) {
    .masthead { top: 14px; left: 16px; }
    .topright { top: 14px; right: 14px; }
    .hint { bottom: 108px; font-size: 11px; letter-spacing: 0.2em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<header class="masthead">
  <h1>褶皱<span class="en">FOLD</span></h1>
  <div class="coords" id="coords"></div>
</header>

<div class="topright">
  <button class="btn-ghost" id="palBtn"></button>
  <button class="btn-ghost" id="juliaBtn"></button>
  <button class="btn-ghost" id="shotBtn"></button>
  <button class="btn-ghost" id="shareBtn"></button>
  <button class="btn-ghost" id="resetBtn"></button>
  <button class="btn-ghost" id="langBtn">EN</button>
</div>

<div class="hint" id="hint"></div>
<a class="home-link" href="../index.html" title="拾遗 · 序">序</a>
<div class="places" id="places"></div>
<div id="errbox"></div>

<script>
'use strict';
window.addEventListener('error', e => {
  const b = document.getElementById('errbox');
  b.style.display = 'block'; b.textContent = 'ERR: ' + e.message;
});

/* ============ i18n ============ */
const I18N = {
  zh: {
    sub: '分形星球',
    hint: '滚轮缩放 · 拖拽巡游 · 双击俯冲',
    share: '分享坐标', copied: '已复制链接', copyFail: '链接已写入地址栏，请手动复制',
    reset: '回母港', zoom: '倍率', palette: '色',
    addSpot: '存此地', delSpot: '长按删除',
    juliaOn: '儒', juliaOff: '曼', shipName: '舰',
    juliaTipOn: '切换到儒利亚集合（以当前中心为 c）', juliaTipOff: '回到曼德博集合',
    palTip: '切换调色板', shot: '存图', shotOk: '✓ 已保存',
    places: [
      { name: '母港', x: -0.6, y: 0, s: 1.4 },
      { name: '海马谷', x: -0.746806, y: 0.108665, s: 0.006 },
      { name: '鹦鹉螺湾', x: -0.74364388703, y: 0.13182590421, s: 2.2e-7 },
      { name: '双螺旋角', x: 0.28693186889504513, y: 0.014286693904085048, s: 8e-10 },
      { name: '象谷', x: 0.2755, y: 0.0065, s: 0.008 },
      { name: '银龙针', x: -1.7686112281649, y: 0.0017551024881, s: 4e-8 },
      { name: '尘埃驿站', x: -1.940157343, y: 0.0000008, s: 3e-7 }
    ]
  },
  en: {
    sub: 'Fractal Planet',
    hint: 'SCROLL TO ZOOM · DRAG TO DRIFT · DOUBLE-CLICK TO DIVE',
    share: 'SHARE SPOT', copied: 'link copied', copyFail: 'link is in the address bar — copy manually',
    reset: 'HOME PORT', zoom: 'mag', palette: 'PAL',
    addSpot: 'MARK SPOT', delSpot: 'long-press to delete',
    juliaOn: 'JULIA', juliaOff: 'MSET', shipName: 'SHIP',
    juliaTipOn: 'switch to the Julia set (c = current center)', juliaTipOff: 'back to the Mandelbrot set',
    palTip: 'cycle palette', shot: 'SHOT', shotOk: '✓ saved',
    places: [
      { name: 'Home Port', x: -0.6, y: 0, s: 1.4 },
      { name: 'Seahorse Valley', x: -0.746806, y: 0.108665, s: 0.006 },
      { name: 'Nautilus Bay', x: -0.74364388703, y: 0.13182590421, s: 2.2e-7 },
      { name: 'Twin Spiral Cape', x: 0.28693186889504513, y: 0.014286693904085048, s: 8e-10 },
      { name: 'Elephant Valley', x: 0.2755, y: 0.0065, s: 0.008 },
      { name: 'Silver Dragon Needle', x: -1.7686112281649, y: 0.0017551024881, s: 4e-8 },
      { name: 'Dust Waystation', x: -1.940157343, y: 0.0000008, s: 3e-7 }
    ]
  }
};
let lang = localStorage.getItem('fold-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
const T = () => I18N[lang];

/* ============ WebGL ============ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false });
if (!gl) { document.getElementById('errbox').style.display = 'block'; document.getElementById('errbox').textContent = 'WebGL2 unavailable'; throw new Error('no webgl2'); }

const VERT = `#version 300 es
precision highp float;
const vec2 verts[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
void main(){ gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0); }`;

/* 双精度模拟（double-single）曼德博：Dekker/Knuth 技术
   使缩放可达 ~10^13 而不糊成像素 */
const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uCenterX;   // (hi, lo)
uniform vec2 uCenterY;
uniform float uScale;    // 视野半高
uniform float uAspect;
uniform float uIter;     // 最大迭代
uniform float uPhase;    // 调色相位

/* df64 核心 */
vec2 ds_add(vec2 a, vec2 b) {
  float t1 = a.x + b.x;
  float e = t1 - a.x;
  float t2 = ((b.x - e) + (a.x - (t1 - e))) + a.y + b.y;
  vec2 r;
  r.x = t1 + t2;
  r.y = t2 - (r.x - t1);
  return r;
}
vec2 ds_mul(vec2 a, vec2 b) {
  const float SPLIT = 8193.0;
  float ca = SPLIT * a.x, cb = SPLIT * b.x;
  float a_hi = ca - (ca - a.x), b_hi = cb - (cb - b.x);
  float a_lo = a.x - a_hi, b_lo = b.x - b_hi;
  float c11 = a.x * b.x;
  float c21 = a_lo * b_lo + (a_lo * b_hi + a_hi * b_lo) * SPLIT + (a_hi - a_hi * 1.0) * 0.0;
  float t1 = c11 + c21;
  vec2 r;
  r.x = t1;
  r.y = c21 - (t1 - c11);
  return r;
}

void main() {
  vec2 uv = gl_FragCoord.xy / vec2(uIter * 0.0 + 1.0);  // placeholder, replaced below
  fragColor = vec4(0.0);
}`;

/* 上面的 uv 写法不便，直接内联完整主函数 */
const FRAG_MAIN = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uCenterX;
uniform vec2 uCenterY;
uniform float uScale;
uniform float uAspect;
uniform float uIter;
uniform float uPhase;
uniform vec2 uRes;
uniform float uJulia;
uniform vec2 uCx;
uniform vec2 uCy;
uniform float uPal;
uniform float uMode;
uniform float uMode;   /* 0 曼德博 1 儒利亚 2 燃烧之舰 */

vec2 ds_add(vec2 a, vec2 b) {
  float t1 = a.x + b.x;
  float e = t1 - a.x;
  float t2 = ((b.x - e) + (a.x - (t1 - e))) + a.y + b.y;
  vec2 r;
  r.x = t1 + t2;
  r.y = t2 - (r.x - t1);
  return r;
}
vec2 ds_mul(vec2 a, vec2 b) {
  const float SPLIT = 8193.0;
  float ca = SPLIT * a.x, cb = SPLIT * b.x;
  float a_hi = ca - (ca - a.x), b_hi = cb - (cb - b.x);
  float a_lo = a.x - a_hi, b_lo = b.x - b_hi;
  float c11 = a.x * b.x;
  float c21 = a_lo * b_lo + (a_lo * b_hi + a_hi * b_lo) * SPLIT;
  float t1 = c11 + c21;
  vec2 r;
  r.x = t1;
  r.y = c21 - (t1 - c11);
  return r;
}
vec3 palette(float t) {
  /* 四套调色板：0墨 1极光 2炉火 3素宣 */
  if (uPal < 0.5) {
    vec3 a = vec3(0.16, 0.14, 0.20), b = vec3(0.42, 0.36, 0.30), d = vec3(0.10, 0.20, 0.38);
    return a + b * cos(6.28318 * (t + d));
  } else if (uPal < 1.5) {
    vec3 a = vec3(0.10, 0.16, 0.18), b = vec3(0.30, 0.44, 0.40), d = vec3(0.45, 0.28, 0.60);
    return a + b * cos(6.28318 * (t + d));
  } else if (uPal < 2.5) {
    vec3 a = vec3(0.18, 0.08, 0.05), b = vec3(0.42, 0.26, 0.12), d = vec3(0.02, 0.12, 0.24);
    return a + b * cos(6.28318 * (t + d));
  } else {
    vec3 a = vec3(0.16, 0.15, 0.13), b = vec3(0.34, 0.32, 0.30), d = vec3(0.0, 0.04, 0.08);
    return a + b * cos(6.28318 * (t + d));
  }
}
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  // c = center + uv * scale（df64 加法保精度）
  vec2 cxc = ds_add(uCenterX, vec2(uv.x * uScale, 0.0));
  vec2 cyc = ds_add(uCenterY, vec2(uv.y * uScale, 0.0));
  vec2 zx, zy, Cx, Cy;
  if (uJulia > 0.5) {
    zx = cxc; zy = cyc;       // Julia：z 从像素点出发
    Cx = uCx; Cy = uCy;       // c 固定
  } else {
    zx = vec2(0.0); zy = vec2(0.0);
    Cx = cxc; Cy = cyc;
  }
  if (uMode > 1.5) {
    /* 燃烧之舰：先取模再平方 */
    zx = vec2(abs(zx.x), abs(zx.y));
    zy = vec2(abs(zy.x), abs(zy.y));
  }
  float i = 0.0;
  float dd = 0.0;
  for (int k = 0; k < 2048; k++) {
    if (float(k) >= uIter) break;
    if (uMode > 1.5) {
      zx = vec2(abs(zx.x), abs(zx.y));
      zy = vec2(abs(zy.x), abs(zy.y));
    }
    vec2 xx = ds_mul(zx, zx);
    vec2 yy = ds_mul(zy, zy);
    vec2 xy = ds_mul(zx, zy);
    vec2 nx = ds_add(ds_add(xx, vec2(-yy.x, -yy.y)), Cx);
    vec2 ny = ds_add(ds_add(xy, xy), Cy);
    zx = nx; zy = ny;
    dd = zx.x * zx.x + zy.x * zy.x;
    if (dd > 65536.0) { i = float(k); break; }
    i = float(k) + 0.5;
  }
  if (dd > 65536.0) {
    float t = i + 1.0 - log2(log2(dd) * 0.5);
    vec3 col = palette(0.06 * sqrt(t) + uPhase);
    fragColor = vec4(col, 1.0);
  } else {
    fragColor = vec4(vec3(0.015, 0.02, 0.04), 1.0);
  }
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG_MAIN));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U = {};
['uCenterX','uCenterY','uScale','uAspect','uIter','uPhase','uRes','uJulia','uCx','uCy','uPal'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

/* ============ 视图状态 ============ */
const view = { x: -0.6, y: 0, s: 1.4 };   // 中心与半高
const target = { x: -0.6, y: 0, s: 1.4 }; // 平滑追踪目标
let fly = null;                            // 飞行动画 {x0,y0,s0,x1,y1,s1,t0,dur}
const MAG_LIMIT = 1e-13;
let juliaOn = false, juliaC = { x: -0.7269, y: 0.1889 };
let shipMode = false;
let palIdx = 0;
let phaseT = 0;
const PAL_NAMES = { zh: ['墨', '极光', '炉火', '素宣'], en: ['INK', 'AURORA', 'EMBER', 'PLAIN'] };

function split64(v) {
  const hi = Math.fround(v);
  const lo = v - hi;
  return [hi, lo];
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // 性能取舍：限制渲染分辨率
  const maxDim = 1400;
  let w = innerWidth * dpr, h = innerHeight * dpr;
  const m = Math.max(w, h) / maxDim;
  if (m > 1) { w /= m; h /= m; }
  canvas.width = Math.round(w); canvas.height = Math.round(h);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function render() {
  const [xh, xl] = split64(view.x);
  const [yh, yl] = split64(view.y);
  // 交互期降迭代：拖拽/缩放进行中减负，静止后恢复全质量
  const busy = dragStart !== null || fly !== null || Math.abs(view.s - target.s) / target.s > 0.01;
  const iter = Math.min(2000, Math.round((160 + 42 * Math.log2(3 / view.s) * 0.5 + 80) * (busy ? 0.45 : 1)));
  const [cxh, cxl] = split64(juliaC.x);
  const [cyh, cyl] = split64(juliaC.y);
  gl.uniform2f(U.uCenterX, xh, xl);
  gl.uniform2f(U.uCenterY, yh, yl);
  gl.uniform1f(U.uScale, view.s);
  gl.uniform1f(U.uAspect, canvas.width / canvas.height);
  gl.uniform1f(U.uIter, iter);
  gl.uniform1f(U.uPhase, 0.0);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uJulia, juliaOn ? 1.0 : 0.0);
  gl.uniform2f(U.uCx, cxh, cxl);
  gl.uniform2f(U.uCy, cyh, cyl);
  gl.uniform1f(U.uPal, palIdx);
  gl.uniform1f(U.uMode, shipMode ? 2.0 : 0.0);
  gl.uniform1f(U.uPhase, phaseT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  lastIter = iter;
  updateCoords();
}
let lastIter = 0;

/* ============ HUD ============ */
const coordsEl = document.getElementById('coords');
function updateCoords() {
  const mag = 1.4 / view.s;
  try {
    const fs = JSON.parse(localStorage.getItem('fold-stats') || '{"maxMag":0}');
    if (mag > (fs.maxMag || 0)) {
      fs.maxMag = mag;
      localStorage.setItem('fold-stats', JSON.stringify(fs));
    }
  } catch (e) { /* 忽略 */ }
  const magStr = mag >= 1e8 ? (mag / 1e8).toFixed(1) + '×10⁸'
    : mag >= 1e4 ? (mag / 1e4).toFixed(1) + '×10⁴'
    : mag >= 100 ? mag.toFixed(0)
    : mag.toFixed(1);
  const jl = juliaOn
    ? `<br>J c = ${juliaC.x.toFixed(8)}, ${juliaC.y.toFixed(8)}`
    : '';
  const pl = `<br>${T().palette} ${PAL_NAMES[lang][palIdx]} · ${lastIter || ''} iter`;
  coordsEl.innerHTML =
    `RE ${view.x.toFixed(12).slice(0, 12)}<br>IM ${view.y.toFixed(12).slice(0, 12)}<br>${T().zoom} ${magStr}${jl}${pl}`;
}

/* ============ 交互 ============ */
let dragStart = null, moved = false;
canvas.addEventListener('pointerdown', e => {
  dragStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  moved = false;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragStart) return;
  const dx = (e.clientX - dragStart.x) / innerHeight * 2 * view.s;
  const dy = (e.clientY - dragStart.y) / innerHeight * 2 * view.s;
  if (Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y) > 4) moved = true;
  view.x = dragStart.vx - dx;
  view.y = dragStart.vy + dy;
  target.x = view.x; target.y = view.y; target.s = view.s;
  fly = null;
  document.getElementById('hint').classList.add('gone');
  requestRender();
});
window.addEventListener('pointerup', () => { dragStart = null; canvas.classList.remove('dragging'); });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(e.deltaY * 0.0016);
  zoomAt(e.clientX, e.clientY, f);
  fly = null;
  document.getElementById('hint').classList.add('gone');
}, { passive: false });

function zoomAt(cx, cy, f) {
  const ns = Math.max(MAG_LIMIT * 1.4, Math.min(2.5, target.s * f));
  const kx = (cx - innerWidth / 2) / innerHeight * 2;
  const ky = -(cy - innerHeight / 2) / innerHeight * 2;
  const ratio = ns / target.s;
  target.x += kx * target.s * (1 - ratio);
  target.y += ky * target.s * (1 - ratio);
  target.s = ns;
  requestRender();
}
canvas.addEventListener('dblclick', e => {
  zoomAt(e.clientX, e.clientY, 0.32);
  fly = null;
});

/* 触屏双指缩放 */
const touches = new Map();
canvas.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') touches.set(e.pointerId, e); });
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && touches.has(e.pointerId)) {
    touches.set(e.pointerId, e);
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      if (canvas._lastPinch) {
        zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, canvas._lastPinch / dist);
      }
      canvas._lastPinch = dist;
    }
  }
});
window.addEventListener('pointerup', e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) canvas._lastPinch = null;
});

/* ============ 地名巡航 ============ */
/* 自定义书签：把当前坐标存为芯片 */
let customSpots = [];
try { customSpots = JSON.parse(localStorage.getItem('fold-spots') || '[]'); } catch (e) {}
function saveSpots() { localStorage.setItem('fold-spots', JSON.stringify(customSpots)); }
function flyTo(p) {
  fly = { x0: view.x, y0: view.y, s0: view.s, x1: p.x, y1: p.y, s1: p.s, t0: performance.now(), dur: 2600 };
  document.getElementById('hint').classList.add('gone');
}
function buildPlaces() {
  const box = document.getElementById('places');
  box.innerHTML = '';
  T().places.forEach(p => {
    const b = document.createElement('button');
    b.className = 'place';
    b.textContent = p.name;
    b.addEventListener('click', () => {
      flyTo(p);
      document.querySelectorAll('.place').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    });
    box.appendChild(b);
  });
  // 自定义书签
  customSpots.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'place';
    b.textContent = '◈ ' + p.name;
    b.title = T().delSpot;
    b.addEventListener('click', () => { flyTo(p); document.querySelectorAll('.place').forEach(x => x.classList.remove('on')); b.classList.add('on'); });
    let lp = null;
    b.addEventListener('pointerdown', () => {
      lp = setTimeout(() => {
        customSpots.splice(i, 1); saveSpots(); buildPlaces();
        lp = null;
      }, 700);
    });
    const cancel = () => { if (lp) { clearTimeout(lp); lp = null; } };
    b.addEventListener('pointerup', cancel);
    b.addEventListener('pointerleave', cancel);
    box.appendChild(b);
  });
  // 存此地
  const sb = document.createElement('button');
  sb.className = 'place';
  sb.textContent = '✚ ' + T().addSpot;
  sb.addEventListener('click', () => {
    if (customSpots.length >= 5) customSpots.shift();
    const d = new Date();
    customSpots.push({
      name: `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`,
      x: view.x, y: view.y, s: view.s
    });
    saveSpots(); buildPlaces();
  });
  box.appendChild(sb);
}

/* ============ 分享 ============ */
function writeHash() {
  history.replaceState(null, '', `#x=${view.x.toPrecision(15)},y=${view.y.toPrecision(15)},s=${view.s.toPrecision(6)}`);
}
document.getElementById('shareBtn').addEventListener('click', async () => {
  writeHash();
  const url = location.href;
  try {
    await navigator.clipboard.writeText(url);
    flashTitle(document.getElementById('shareBtn'), '✓ ' + T().copied);
  } catch (e) {
    flashTitle(document.getElementById('shareBtn'), T().copyFail);
  }
});
function flashTitle(btn, txt) {
  const old = btn.textContent;
  btn.textContent = txt;
  setTimeout(() => btn.textContent = old, 1800);
}
document.getElementById('resetBtn').addEventListener('click', () => flyTo(T().places[0]));
/* Julia / 调色板 / 截图 */
const juliaBtn = document.getElementById('juliaBtn');
juliaBtn.addEventListener('click', () => {
  if (!juliaOn && !shipMode) {
    // 曼 → 儒
    juliaC = { x: view.x, y: view.y };
    juliaOn = true;
    view.x = 0; view.y = 0; view.s = 1.6;
  } else if (juliaOn && !shipMode) {
    // 儒 → 舰
    juliaOn = false;
    shipMode = true;
    view.x = -1.75; view.y = -0.03; view.s = 0.35;
  } else {
    // 舰 → 曼
    shipMode = false;
    view.x = -0.6; view.y = 0; view.s = 1.4;
  }
  target.x = view.x; target.y = view.y; target.s = view.s;
  fly = null;
  updateJuliaBtn(); updateCoords(); requestRender();
});
function updateJuliaBtn() {
  juliaBtn.textContent = shipMode ? T().shipName : (juliaOn ? T().juliaOff : T().juliaOn);
  juliaBtn.title = T().juliaTipOn;
}
/* 色相缓移：低频重绘让调色板缓缓流动 */
const REDUCED_PHASE = matchMedia('(prefers-reduced-motion: reduce)').matches;
setInterval(() => {
  if (REDUCED_PHASE) return;
  phaseT += 0.004;
  requestRender();
}, 160);
const palBtn = document.getElementById('palBtn');
palBtn.addEventListener('click', () => {
  palIdx = (palIdx + 1) % 4;
  palBtn.textContent = T().palette + ' ' + PAL_NAMES[lang][palIdx];
  palBtn.title = T().palTip;
  requestRender();
});
const shotBtn = document.getElementById('shotBtn');
shotBtn.addEventListener('click', () => {
  render();  // 同帧捕获（无需 preserveDrawingBuffer）
  const a = document.createElement('a');
  a.download = `fold-${Date.now()}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  flashTitle(shotBtn, T().shotOk);
});
/* 键盘：缩放 / 平移 / 模式 */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  const pan = (dx, dy) => { target.x += dx * view.s; target.y += dy * view.s; fly = null; requestRender(); };
  if (k === '+' || k === '=') { zoomAt(innerWidth / 2, innerHeight / 2, 0.72); fly = null; }
  else if (k === '-' || k === '_') { zoomAt(innerWidth / 2, innerHeight / 2, 1.38); fly = null; }
  else if (k === 'ArrowLeft') { pan(-0.12, 0); }
  else if (k === 'ArrowRight') { pan(0.12, 0); }
  else if (k === 'ArrowUp') { pan(0, 0.12); }
  else if (k === 'ArrowDown') { pan(0, -0.12); }
  else if (k === 'j' || k === 'J') juliaBtn.click();
  else if (k === 'p' || k === 'P') palBtn.click();
  else if (k === 's' || k === 'S') shotBtn.click();
  if (k.startsWith('Arrow')) e.preventDefault();
});
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('fold-lang', lang);
  applyI18n();
});
function applyI18n() {
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
  document.title = lang === 'zh' ? '褶皱 · FOLD — 分形星球' : 'FOLD — Fractal Planet';
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  document.getElementById('shareBtn').textContent = T().share;
  document.getElementById('resetBtn').textContent = T().reset;
  document.getElementById('shotBtn').textContent = T().shot;
  palBtn.textContent = T().palette + ' ' + PAL_NAMES[lang][palIdx];
  palBtn.title = T().palTip;
  updateJuliaBtn();
  document.getElementById('hint').textContent = T().hint;
  buildPlaces();
  updateCoords();
}

/* ============ 待机深潜 ============ */
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastInteractF = performance.now();
['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, () => { lastInteractF = performance.now(); }, { passive: true }));

/* ============ 渲染循环 ============ */
let renderPending = false;
function requestRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; render(); });
}
let prev = performance.now();
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  if (fly) {
    const t = Math.min(1, (now - fly.t0) / fly.dur);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;  // easeInOutQuad
    view.s = Math.exp(Math.log(fly.s0) + (Math.log(fly.s1) - Math.log(fly.s0)) * e);
    view.x = fly.x0 + (fly.x1 - fly.x0) * e;
    view.y = fly.y0 + (fly.y1 - fly.y0) * e;
    target.x = view.x; target.y = view.y; target.s = view.s;
    if (t >= 1) fly = null;
    requestRender();
  } else {
    // 待机深潜：闲置 25s 缓缓深入（屏保）；reduced-motion 用户跳过
    if (!REDUCED_MOTION && now - lastInteractF > 25000) {
      target.s = Math.max(MAG_LIMIT * 1.4, target.s * Math.exp(-dt * 0.07));
    }
    // 平滑追踪：view 指数逼近 target（惯性缩放）
    const k = 1 - Math.exp(-dt * 9);
    const dxs = (target.s - view.s) / view.s;
    const dxy = Math.hypot(target.x - view.x, target.y - view.y) / Math.max(target.s, 1e-13);
    if (Math.abs(dxs) > 1e-4 || dxy > 1e-4) {
      view.s = Math.exp(Math.log(view.s) + Math.log(target.s / view.s) * k);
      view.x += (target.x - view.x) * k;
      view.y += (target.y - view.y) * k;
      requestRender();
    }
  }
  requestAnimationFrame(frame);
}

/* ============ 启动 ============ */
applyI18n();
// URL hash 坐标恢复
const hm = location.hash.match(/x=([-\d.e+]+),y=([-\d.e+]+),s=([\d.e+-]+)/);
if (hm) {
  view.x = +hm[1]; view.y = +hm[2]; view.s = +hm[3];
  target.x = view.x; target.y = view.y; target.s = view.s;
}
// #julia 或 #julia,cx,gy 测试直达
const jm = location.hash.match(/julia(?:,([-\d.e+]+),([-\d.e+]+))?/);
if (jm) {
  juliaOn = true;
  if (jm[1] !== undefined) juliaC = { x: +jm[1], y: +jm[2] };
  else juliaC = { x: view.x, y: view.y };
  view.x = 0; view.y = 0; view.s = 1.6;
  target.x = 0; target.y = 0; target.s = 1.6;
}
render();
requestAnimationFrame(frame);
</script>
</body>
