<script>
'use strict';
window.addEventListener('error', e => {
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#401414;color:#ffb4b4;font-size:12px;padding:8px 12px';
  b.textContent = 'ERR: ' + e.message;
  document.body.appendChild(b);
});
/* ================================================================
   造境 · SCAPE v6 — 程序化声景
   v5 画面基座 + 十声道（夜虫/雷/鸟鸣/远钟音频与视觉补全）
   + 日月轨道修复 + 闪电 + 萤火 + 飞鸟 + 远寺 + 落花
   + 时光流转 + 状态持久化 + #w= 分享链接
   ================================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, time = 14;

/* ---------- 工具 ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- 场景数据 ---------- */
/* 跨站联动缓存：褶皱触底 → 灯常明（低频刷新，避免每帧解析） */
let foldBottomLit = false;
setInterval(() => {
  try { foldBottomLit = !!JSON.parse(localStorage.getItem('fold-stats') || '{}').bottom; } catch (e) {}
}, 5000);
try { foldBottomLit = !!JSON.parse(localStorage.getItem('fold-stats') || '{}').bottom; } catch (e) {}
const S = { rain: 0, wind: 0.35, fire: 0, stream: 0.3, cricket: 0, thunder: 0, birds: 0.4, bell: 0, snow: 0, petal: 0 };
const CH = ['rain','wind','fire','stream','cricket','thunder','birds','bell','snow','petal'];
const CH_ZH = { rain:'雨', wind:'风', fire:'篝火', stream:'溪流', cricket:'夜虫', thunder:'雷', birds:'鸟鸣', bell:'远钟', snow:'雪', petal:'落花' };
const CH_EN = { rain:'RAIN', wind:'WIND', fire:'FIRE', stream:'STREAM', cricket:'CRICKETS', thunder:'THUNDER', birds:'BIRDS', bell:'BELL', snow:'SNOW', petal:'PETALS' };
let lang = localStorage.getItem('scape-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
{ const hm = location.hash.match(/lang=(\w{2})/); if (hm) { lang = hm[1] === 'en' ? 'en' : 'zh'; try { localStorage.setItem('scape-lang', lang); } catch (e) {} } }
let theme = 0; // 0山 1海 2城
let sndOn = true;
let timeFlow = false;
const T = (z, e) => lang === 'zh' ? z : e;

/* ---------- 天空（含日光系数 L） ---------- */
const SKY = [
  { t: 0,   top: [8,10,24],    mid: [14,18,38],    hor: [24,28,52],    L: 0.02 },
  { t: 4.5, top: [10,12,30],   mid: [22,24,52],    hor: [56,42,60],    L: 0.06 },
  { t: 6,   top: [46,58,96],   mid: [176,120,108], hor: [244,168,110], L: 0.35 },
  { t: 8,   top: [96,148,200], mid: [156,196,228], hor: [232,214,178], L: 0.85 },
  { t: 12,  top: [88,142,208], mid: [150,194,232], hor: [214,226,224], L: 1.0 },
  { t: 16,  top: [92,138,198], mid: [168,186,216], hor: [238,208,158], L: 0.9 },
  { t: 18.4,top: [70,82,140],  mid: [216,130,104], hor: [248,158,92],  L: 0.45 },
  { t: 20,  top: [24,26,58],   mid: [66,48,84],    hor: [140,84,78],   L: 0.10 },
  { t: 22,  top: [10,12,28],   mid: [16,20,42],    hor: [28,30,54],    L: 0.04 },
  { t: 24,  top: [8,10,24],    mid: [14,18,38],    hor: [24,28,52],    L: 0.02 }
];
function lerp(a, b, t) { return a + (b - a) * t; }
function skyAt(t) {
  let i = 0;
  while (i < SKY.length - 1 && SKY[i + 1].t < t) i++;
  const a = SKY[i], b = SKY[Math.min(i + 1, SKY.length - 1)];
  const f = b.t === a.t ? 0 : (t - a.t) / (b.t - a.t);
  return {
    top: [0,1,2].map(j => Math.round(lerp(a.top[j], b.top[j], f))),
    mid: [0,1,2].map(j => Math.round(lerp(a.mid[j], b.mid[j], f))),
    hor: [0,1,2].map(j => Math.round(lerp(a.hor[j], b.hor[j], f))),
    L: lerp(a.L, b.L, f)
  };
}

/* ---------- 山脊 ---------- */
let ridges = [];
function makeRidge(w, h, seed, yBase, amp, color) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w); c.height = Math.max(1, h);
  const g2 = c.getContext('2d');
  const rnd = mulberry32(seed);
  g2.fillStyle = color;
  g2.beginPath();
  g2.moveTo(0, h);
  const pts = [];
  for (let i = 0; i <= 8; i++) pts.push([w * i / 8, yBase + (rnd() - 0.5) * amp]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let s = 0; s <= 6; s++) {
      const t2 = s / 6;
      const x = 0.5 * ((2*p1[0]) + (-p0[0]+p2[0])*t2 + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t2*t2*t2);
      const y = 0.5 * ((2*p1[1]) + (-p0[1]+p2[1])*t2 + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t2*t2*t2);
      g2.lineTo(x, y);
    }
  }
  g2.lineTo(w, h); g2.closePath(); g2.fill();
  return c;
}
function rebuildScenery() {
  ridges = [
    makeRidge(W, H, 71, H * 0.52, H * 0.09, 'rgba(0,0,0,0.24)'),
    makeRidge(W, H, 72, H * 0.62, H * 0.10, 'rgba(0,0,0,0.42)'),
    makeRidge(W, H, 73, H * 0.74, H * 0.08, 'rgba(0,0,0,0.66)')
  ];
}
/* 主题过渡：切换时快照旧帧渐隐 */
let themeFadeCanvas = null, themeFadeT = 0;
function snapshotTheme() {
  if (!themeFadeCanvas) {
    themeFadeCanvas = document.createElement('canvas');
  }
  themeFadeCanvas.width = W; themeFadeCanvas.height = H;
  themeFadeCanvas.getContext('2d').drawImage(cv, 0, 0);
  themeFadeT = 1;
}
function drawThemeFade() {
  if (themeFadeT <= 0 || !themeFadeCanvas) return;
  ctx.globalAlpha = themeFadeT;
  ctx.drawImage(themeFadeCanvas, 0, 0);
  ctx.globalAlpha = 1;
}

/* 预渲染精灵与渐变缓存（手机性能：替代逐帧 createRadialGradient/LinearGradient） */
let glowSprite = null, auroraStrips = null, vigGrad = null, skyCache = { key: '', grad: null };
function resize() {
  W = innerWidth; H = innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vigGrad = null;  // 暗角随尺寸重建
  rebuildScenery();
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });
function makeSprites() {
  glowSprite = document.createElement('canvas');
  glowSprite.width = glowSprite.height = 16;
  {
    const g = glowSprite.getContext('2d');
    const rg = g.createRadialGradient(8, 8, 0, 8, 8, 8);
    rg.addColorStop(0, 'hsla(55,90%,72%,0.9)');
    rg.addColorStop(1, 'hsla(55,90%,60%,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 16, 16);
  }
  auroraStrips = [150, 168, 186].map(hue => {
    const c = document.createElement('canvas');
    c.width = 2; c.height = 256;
    const g2 = c.getContext('2d');
    const lg = g2.createLinearGradient(0, 0, 0, 256);
    lg.addColorStop(0, `hsla(${hue},85%,66%,1)`);
    lg.addColorStop(1, `hsla(${hue - 25},85%,55%,0)`);
    g2.fillStyle = lg; g2.fillRect(0, 0, 2, 256);
    return c;
  });
}
makeSprites();

/* ---------- 粒子 ---------- */
let stars = [], clouds = [], raindrops = [], snowflakes = [], petals = [], embers = [], flies = [], flocks = [], meteors = [];
function initParticles() {
  const rnd = mulberry32(99);
  stars = [];
  for (let i = 0; i < 130; i++)
    stars.push({ x: rnd() * W, y: rnd() * H * 0.55, r: rnd() * 1.3 + 0.3, p: rnd() * Math.PI * 2 });
  clouds = [];
  for (let i = 0; i < 7; i++) {
    const puffs = [];
    for (let j = 0; j < 5; j++) puffs.push({ dx: (rnd() - 0.5) * 160, dy: (rnd() - 0.5) * 34, r: 34 + rnd() * 46 });
    clouds.push({ x: rnd() * W, y: H * (0.1 + rnd() * 0.26), v: 4 + rnd() * 9, puffs });
  }
  raindrops = [];
  for (let i = 0; i < 240; i++)
    raindrops.push({ x: rnd() * W * 1.2 - W * 0.1, y: rnd() * H, v: 620 + rnd() * 380 });
  snowflakes = [];
  for (let i = 0; i < 190; i++)
    snowflakes.push({ x: rnd() * W, y: rnd() * H, v: 26 + rnd() * 52, r: 1 + rnd() * 2.4, p: rnd() * Math.PI * 2 });
  petals = [];
  for (let i = 0; i < 90; i++)
    petals.push({ x: rnd() * W, y: rnd() * H, v: 18 + rnd() * 30, s: 2.5 + rnd() * 3, p: rnd() * Math.PI * 2, spin: rnd() * Math.PI * 2 });
  flies = [];
  for (let i = 0; i < 42; i++)
    flies.push({ x: rnd() * W, y: H * (0.62 + rnd() * 0.3), p: rnd() * Math.PI * 2, sp: 0.5 + rnd() * 1.2, hue: 50 + rnd() * 20 });
  flocks = [];
}
initParticles();

/* ---------- 音频 ---------- */
let AC = null, master = null;
const audioNodes = {};
let delaySend = null;
let recDest = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6;
  master = AC.createGain(); master.gain.value = sndOn ? 0.6 : 0;
  master.connect(comp); comp.connect(AC.destination);
  // 录制用音频分流
  try { recDest = AC.createMediaStreamDestination(); comp.connect(recDest); } catch (e) { recDest = null; }
  // 回声（远钟/雷用）
  delaySend = AC.createGain(); delaySend.gain.value = 1;
  const dl = AC.createDelay(1.2); dl.delayTime.value = 0.34;
  const fb = AC.createGain(); fb.gain.value = 0.32;
  const dg = AC.createGain(); dg.gain.value = 0.4;
  delaySend.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(dg); dg.connect(master);
  // 噪声缓冲
  const len = AC.sampleRate * 2;
  const white = AC.createBuffer(1, len, AC.sampleRate);
  const brown = AC.createBuffer(1, len, AC.sampleRate);
  const wd = white.getChannelData(0), bd = brown.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    wd[i] = Math.random() * 2 - 1;
    last = (last + 0.02 * wd[i]) / 1.02;
    bd[i] = last * 3.5;
  }
  // 夜虫缓冲：脉冲串式振翅
  const cricket = AC.createBuffer(1, len, AC.sampleRate);
  const cd = cricket.getChannelData(0);
  {
    const sr = AC.sampleRate;
    const chirpPeriod = 0.62, chirpLen = 0.34, wingHz = 46;
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const inChirp = (t % chirpPeriod) < chirpLen;
      const tc = t % chirpPeriod;
      const envl = inChirp ? Math.sin(Math.PI * tc / chirpLen) : 0;
      const pulse = inChirp && ((t * wingHz) % 1 < 0.5) ? 1 : 0;
      cd[i] = pulse ? (Math.random() * 2 - 1) * envl * 0.8 : 0;
    }
  }
  function makeChannel(buf, filterType, freq, gain, q) {
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
    if (q) f.Q.value = q;
    const g = AC.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(master); src.start();
    return { f, g };
  }
  audioNodes.rain = makeChannel(white, 'lowpass', 900, 0);
  audioNodes.wind = makeChannel(brown, 'lowpass', 300, 0);
  audioNodes.fire = makeChannel(brown, 'lowpass', 380, 0);
  audioNodes.stream = makeChannel(white, 'bandpass', 720, 0, 0.8);
  audioNodes.cricket = makeChannel(cricket, 'bandpass', 4600, 0, 2.2);
  updateAudio(0);
}
function updateAudio(smooth = 0.5) {
  if (!AC || !master) return;
  const t = AC.currentTime;
  const set = (p, v) => p.setTargetAtTime(v, t, smooth);
  if (audioNodes.rain) {
    set(audioNodes.rain.g.gain, S.rain * 0.42);
    set(audioNodes.rain.f.frequency, 500 + S.rain * 2800);
  }
  if (audioNodes.wind) set(audioNodes.wind.g.gain, S.wind * 0.5);
  if (audioNodes.fire) set(audioNodes.fire.g.gain, S.fire * 0.3);
  if (audioNodes.stream) set(audioNodes.stream.g.gain, S.stream * 0.26);
  if (audioNodes.cricket) set(audioNodes.cricket.g.gain, S.cricket * 0.16);
}
/* 雷击：低频轰鸣 + 闪屏 */
function strikeThunder() {
  if (!AC || !sndOn) return;
  const dur = 2.6 + Math.random() * 1.6;
  const len = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.045 * w) / 1.045;
    const e = Math.pow(1 - i / len, 2.1);
    d[i] = last * 3.2 * e;
  }
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160;
  const g = AC.createGain();
  const t0 = AC.currentTime + 0.12 + Math.random() * 0.9; // 先见闪电，后闻雷
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.9 * (0.4 + S.thunder * 0.6), t0 + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  const send = AC.createGain(); send.gain.value = 0.35;
  g.connect(send); send.connect(delaySend);
  src.start(t0);
  // 视觉：闪 + 折线闪电
  flashT = Math.min(1, 0.55 + S.thunder * 0.5);
  if (Math.random() < 0.75) {
    const x0 = W * (0.1 + Math.random() * 0.8);
    const pts = [[x0, -10]];
    let x = x0, y = -10;
    const segs = 8 + Math.floor(Math.random() * 6);
    while (y < H * (0.5 + Math.random() * 0.22) && pts.length < segs + 4) {
      y += (H * 0.62) / segs * (0.7 + Math.random() * 0.6);
      x += (Math.random() - 0.5) * W * 0.07;
      pts.push([x, y]);
    }
    bolts.push({ pts, life: 1 });
  }
}
/* 远钟：非谐波分音 */
function strikeBell() {
  if (!AC || !sndOn) return;
  const base = 174;
  const partials = [[1, 1], [2.0, 0.55], [2.4, 0.4], [3.0, 0.28], [4.5, 0.16], [5.4, 0.1]];
  const amp = 0.11 * (0.35 + S.bell * 0.65);
  partials.forEach(([ratio, a]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = base * ratio;
    const t0 = AC.currentTime;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(amp * a, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.2 / Math.sqrt(ratio));
    o.connect(g); g.connect(master);
    const send = AC.createGain(); send.gain.value = 0.5;
    g.connect(send); send.connect(delaySend);
    o.start(t0); o.stop(t0 + 4);
  });
  bellT = 1;
}
/* 鸟鸣：短促滑音啭鸣 */
function birdChirp() {
  if (!AC || !sndOn) return;
  const n = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const t0 = AC.currentTime + i * (0.09 + Math.random() * 0.12);
    const f0 = 2300 + Math.random() * 1500;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f0 * (0.6 + Math.random() * 0.8), t0 + 0.09);
    const amp = 0.05 * (0.3 + S.birds * 0.7);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(amp, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + 0.16);
  }
}

/* ---------- 绘制 ---------- */
let frameTime = 0;
let flashT = 0, bellT = 0;
let bolts = [];
let nextThunderAt = 4, nextBellAt = 6, nextBirdAt = 2, nextFlockAt = 3;

function celestial() { // 返回日月位置与类型（弧顶 0.06H，落至海平线 0.52H）
  const sky = skyAt(time);
  const isDay = sky.L > 0.5;
  const p = isDay ? (time - 6) / 12 : ((time - 18 + 24) % 24) / 12;
  const x = W * (0.12 + 0.76 * p);
  const y = H * 0.52 - Math.sin(p * Math.PI) * H * 0.46;
  return { x, y, isDay, L: sky.L };
}

function draw(dt) {
  frameTime += dt;
  const sky = skyAt(time);
  const L = sky.L;
  const cel = celestial();

  // 天空（时刻未变时复用渐变对象）
  const skyKey = time.toFixed(2) + (theme === 1 ? 's' : '');
  if (skyCache.key !== skyKey) {
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.8);
    g.addColorStop(0, `rgb(${sky.top.join(',')})`);
    g.addColorStop(0.62, `rgb(${sky.mid.join(',')})`);
    g.addColorStop(1, `rgb(${sky.hor.join(',')})`);
    skyCache = { key: skyKey, grad: g };
  }
  ctx.fillStyle = skyCache.grad;
  ctx.fillRect(0, 0, W, H);

  // 星（夜间）
  const starA = Math.max(0, 1 - L * 1.8);
  if (starA > 0.01) {
    for (const st of stars) {
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(frameTime * 1.4 + st.p));
      ctx.fillStyle = `rgba(240,244,255,${(starA * tw * 0.85).toFixed(3)})`;
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
  }

  // 极光（极夜：大雪 + 深夜）——预渲染色带切片，避免逐条渐变
  if (S.snow > 0.55 && L < 0.14) {
    const auroraA = clamp((S.snow - 0.55) * 2.2, 0, 1) * clamp((0.14 - L) / 0.14, 0, 1);
    for (let layer = 0; layer < 3; layer++) {
      for (let x = 0; x < W; x += 10) {
        const w1 = Math.sin(x * 0.004 + frameTime * 0.31 + layer * 1.7);
        const w2 = Math.sin(x * 0.011 - frameTime * 0.47 + layer);
        const y0 = H * (0.06 + layer * 0.028) + w1 * 26;
        const h2 = H * (0.16 + 0.09 * w2) * (1 - layer * 0.18);
        const a = auroraA * (0.07 + 0.09 * (0.5 + 0.5 * w2)) * (0.5 + 0.5 * Math.sin(frameTime * 0.8 + x * 0.02 + layer));
        if (a > 0.004) {
          ctx.globalAlpha = a;
          ctx.drawImage(auroraStrips[layer], x, y0, 10, h2);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // 流星（晴夜偶现）
  if (L < 0.1 && S.rain < 0.05 && Math.random() < dt * 0.09) {
    meteors.push({
      x: W * (0.15 + Math.random() * 0.8), y: H * Math.random() * 0.3,
      vx: -(260 + Math.random() * 300), vy: 150 + Math.random() * 170, life: 1
    });
  }
  meteors = meteors.filter(m => m.life > 0);
  for (const m of meteors) {
    m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt * 1.35;
    const tail = 0.075;
    const mg = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * tail, m.y - m.vy * tail);
    mg.addColorStop(0, `rgba(255,255,255,${(m.life * 0.9).toFixed(3)})`);
    mg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = mg;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx * tail, m.y - m.vy * tail);
    ctx.stroke();
  }

  // 太阳雨彩虹（小雨 + 昼）
  if (S.rain > 0.02 && S.rain < 0.22 && L > 0.75) {
    const rcx = W - cel.x, rcy = H * 0.86, R = H * 0.62;
    const cols = [0, 30, 55, 110, 230, 275, 315]; // 赤橙黄绿蓝靛紫
    const rbA = 0.085 * (1 - Math.abs(S.rain - 0.12) / 0.1);
    cols.forEach((hue2, i) => {
      ctx.strokeStyle = `hsla(${hue2},80%,60%,${clamp(rbA, 0, 0.1).toFixed(3)})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(rcx, rcy, R - i * 3.2, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
    });
  }

  // 飞鸟（昼）
  if (S.birds > 0.05 && L > 0.4) {
    if (frameTime > nextFlockAt) {
      nextFlockAt = frameTime + 5 + Math.random() * 9;
      const dir = Math.random() < 0.5 ? 1 : -1;
      const n = 3 + Math.floor(Math.random() * 5);
      flocks.push({
        x: dir > 0 ? -80 : W + 80, dir,
        y: H * (0.1 + Math.random() * 0.3), v: (34 + Math.random() * 40) * dir,
        n, p: Math.random() * 9
      });
    }
    ctx.strokeStyle = `rgba(18,24,32,${(0.75 * Math.min(1, S.birds * 2) * clamp((L - 0.35) * 2.5, 0, 1)).toFixed(3)})`;
    ctx.lineWidth = 1.6;
    flocks = flocks.filter(fl => fl.x > -140 && fl.x < W + 140);
    for (const fl of flocks) {
      fl.x += fl.v * dt;
      for (let i = 0; i < fl.n; i++) {
        const bx = fl.x - fl.dir * i * 16 - fl.dir * (i % 2) * 8;
        const by = fl.y + (i % 2) * 7 + i * 2;
        const flap = Math.sin(frameTime * 8 + fl.p + i) * 3;
        ctx.beginPath();
        ctx.moveTo(bx - 5, by - flap);
        ctx.quadraticCurveTo(bx, by + 2, bx + 5, by - flap);
        ctx.stroke();
      }
    }
  }

  // 日月
  if (cel.y < H * 0.78) {
    const r = cel.isDay ? 30 : 22;
    const glow = ctx.createRadialGradient(cel.x, cel.y, 0, cel.x, cel.y, r * 5);
    glow.addColorStop(0, cel.isDay ? 'rgba(255,232,170,0.7)' : 'rgba(225,236,255,0.4)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(cel.x - r * 5, cel.y - r * 5, r * 10, r * 10);
    ctx.fillStyle = cel.isDay ? '#fff3cf' : '#eef2fb';
    ctx.beginPath(); ctx.arc(cel.x, cel.y, r, 0, Math.PI * 2); ctx.fill();
    if (!cel.isDay) { // 月相缺口
      ctx.fillStyle = `rgb(${sky.top.join(',')})`;
      ctx.beginPath(); ctx.arc(cel.x + r * 0.42, cel.y - r * 0.18, r * 0.86, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 云
  const cloudA = 0.3 + S.rain * 0.45;
  for (const cl of clouds) {
    cl.x += cl.v * (0.4 + S.wind * 2.4) * dt;
    if (cl.x - 260 > W) cl.x = -260;
    ctx.fillStyle = `rgba(200,204,214,${(cloudA * 0.5).toFixed(3)})`;
    for (const p of cl.puffs) {
      ctx.beginPath(); ctx.arc(cl.x + p.dx, cl.y + p.dy, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 山脊（前两层）——雪原/大漠/太空覆盖地面，不画山脊
  if (theme < 3) {
    ctx.drawImage(ridges[0], 0, 0);
    ctx.drawImage(ridges[1], 0, 0);
  }

  // 彩蛋：滑稽显圣（十全十美后 7 秒，山脊之上）
  if (hjqT > 0) drawHjq(Math.min(1, hjqT / 1.2, (7 - hjqT) / 0.6));

  // 远寺（山主题 + 远钟）：第三层山脊上
  if (theme === 0) {
    const px = W * 0.16, py = H * 0.735;
    const nightW2 = 1 - L;
    ctx.fillStyle = 'rgba(8,11,17,0.9)';
    for (let tier = 0; tier < 3; tier++) {
      const w2 = 26 - tier * 7, h2 = 13;
      const ty = py - tier * 11;
      ctx.beginPath();
      ctx.moveTo(px - w2, ty);
      ctx.lineTo(px - w2 * 0.62, ty - h2);
      ctx.lineTo(px - w2 * 0.4, ty - h2 * 0.35);
      ctx.lineTo(px, ty - h2 * 1.5);
      ctx.lineTo(px + w2 * 0.4, ty - h2 * 0.35);
      ctx.lineTo(px + w2 * 0.62, ty - h2);
      ctx.lineTo(px + w2, ty);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillRect(px - 1.2, py - 46, 2.4, 8); // 塔刹
    if (bellT > 0.02 && (nightW2 > 0.3 || S.bell > 0)) {
      const a = bellT * 0.85;
      const bg = ctx.createRadialGradient(px, py - 26, 0, px, py - 26, 34);
      bg.addColorStop(0, `rgba(255,190,96,${(a * 0.8).toFixed(3)})`);
      bg.addColorStop(1, 'rgba(255,190,96,0)');
      ctx.fillStyle = bg;
      ctx.fillRect(px - 34, py - 60, 68, 68);
    }
  }

  // 前山脊
  if (theme < 3) ctx.drawImage(ridges[2], 0, 0);

  // 主题：海
  if (theme === 1) {
    const hor = H * 0.56;
    const wg = ctx.createLinearGradient(0, hor, 0, H);
    wg.addColorStop(0, `rgb(${sky.hor.map(v => Math.round(v * 0.9)).join(',')})`);
    wg.addColorStop(1, `rgb(${sky.top.map(v => Math.round(v * 0.4)).join(',')})`);
    ctx.fillStyle = wg;
    ctx.fillRect(0, hor, W, H - hor);
    // 水平线
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(0, hor, W, 1);
    // 日/月光路
    if (cel.y < hor + 30) {
      for (let i = 0; i < 24; i++) {
        const y = hor + 6 + i * (H - hor) / 24;
        const spread = 6 + i * 2.8;
        const sh = 0.5 + 0.5 * Math.sin(frameTime * 2.1 + i * 1.7);
        const a = (0.18 + 0.18 * sh) * (cel.isDay ? 0.85 : 1) * (1 - i / 28);
        ctx.fillStyle = cel.isDay ? `rgba(255,236,180,${a.toFixed(3)})` : `rgba(226,236,255,${a.toFixed(3)})`;
        const half = spread * (0.6 + 0.4 * Math.sin(frameTime * 1.3 + i));
        ctx.fillRect(cel.x - half, y, half * 2, 2);
      }
    }
    // 波纹（亮/暗两套，随风漂移）
    for (let i = 0; i < 11; i++) {
      const y = hor + 10 + (i / 11) * (H - hor) * 0.9;
      const speed = 8 + i * 5 + S.wind * 30;
      const x = ((frameTime * speed) % (W + 220)) - 110;
      ctx.strokeStyle = i % 2 ? 'rgba(255,255,255,0.17)' : 'rgba(10,16,26,0.14)';
      ctx.lineWidth = i % 2 ? 1.2 : 1.4;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 45, y - 2.5, x + 100, y); ctx.stroke();
    }
    // 白鹤礁灯塔（夜）：与回声/纸间同一座
    // 联动：有人触到褶皱十万亿之底（fold-stats.bottom）→ 灯常明且更亮
    const lhA = foldBottomLit ? 1 : clamp((0.35 - L) / 0.3, 0, 1);
    if (lhA > 0.02) {
      const lx = W * 0.8, ly = hor;
      ctx.fillStyle = 'rgba(10,12,18,0.92)';
      ctx.fillRect(lx - 4, ly - 26, 8, 27);
      ctx.beginPath();
      ctx.moveTo(lx - 7, ly - 26); ctx.lineTo(lx + 7, ly - 26); ctx.lineTo(lx, ly - 35);
      ctx.closePath(); ctx.fill();
      const pulse = 0.55 + 0.45 * Math.sin(frameTime * 2.2);
      const lampA = lhA * pulse;
      const lg2 = ctx.createRadialGradient(lx, ly - 29, 0, lx, ly - 29, 26);
      lg2.addColorStop(0, `rgba(255,224,150,${(0.85 * lampA).toFixed(3)})`);
      lg2.addColorStop(1, 'rgba(255,224,150,0)');
      ctx.fillStyle = lg2;
      ctx.fillRect(lx - 26, ly - 55, 52, 52);
      const ang = (frameTime * 0.55) % (Math.PI * 2);
      const beamLen = W * 0.5;
      for (const dir of [ang, ang + Math.PI]) {
        const bx = Math.cos(dir) * beamLen, by = Math.sin(dir) * beamLen * 0.5;
        const bg2 = ctx.createLinearGradient(lx, ly - 29, lx + bx, ly - 29 + by);
        bg2.addColorStop(0, `rgba(255,230,170,${(0.3 * lampA).toFixed(3)})`);
        bg2.addColorStop(1, 'rgba(255,230,170,0)');
        ctx.fillStyle = bg2;
        ctx.beginPath();
        ctx.moveTo(lx, ly - 29);
        ctx.lineTo(lx + bx + by * 0.09, ly - 29 + by - bx * 0.09);
        ctx.lineTo(lx + bx - by * 0.09, ly - 29 + by + bx * 0.09);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  // 主题：城
  if (theme === 2) {
    const nightW = Math.max(0, 1 - L * 1.6);
    const rnd2 = mulberry32(5150);
    for (let layer = 0; layer < 2; layer++) {
      const base = H * (layer ? 0.94 : 0.88);
      const shade = layer ? 'rgba(10,14,22,0.88)' : 'rgba(18,24,36,0.72)';
      let x = -20;
      while (x < W + 40) {
        const bw = 34 + rnd2() * 66;
        const bh = H * (0.16 + rnd2() * 0.2) * (layer ? 1.35 : 1);
        const top = base - bh;
        ctx.fillStyle = shade;
        ctx.fillRect(x, top, bw, bh + 40);
        // 窗
        const cols = Math.max(1, Math.floor(bw / 15));
        const rowsN = Math.max(2, Math.floor(bh / 20));
        const wa = 0.06 + nightW * 0.75;
        for (let c = 0; c < cols; c++) for (let r2 = 0; r2 < rowsN; r2++) {
          if (rnd2() < 0.34) {
            ctx.fillStyle = `rgba(255,214,140,${(wa * (0.85 + 0.15 * Math.sin(frameTime * 0.7 + c + r2))).toFixed(3)})`;
            ctx.fillRect(x + 5 + c * 15, top + 8 + r2 * 20, 6, 9);
          }
        }
        x += bw + 6 + rnd2() * 26;
      }
    }
  }

  /* ---------- 主题：雪原（枯枝林 + 积雪地面 + 雪漂） ---------- */
  if (theme === 3) {
    const hor = H * 0.62;
    /* 积雪地面：蓝白渐变（随天色调冷暖） */
    const sg = ctx.createLinearGradient(0, hor, 0, H);
    const cool = 1 - L * 0.3;
    sg.addColorStop(0, `rgb(${Math.round(200 * cool + sky.hor[0] * 0.2)},${Math.round(210 * cool + sky.hor[1] * 0.2)},${Math.round(225 * cool + sky.hor[2] * 0.2)})`);
    sg.addColorStop(1, `rgb(${Math.round(140 * cool + sky.top[0] * 0.3)},${Math.round(155 * cool + sky.top[1] * 0.3)},${Math.round(180 * cool + sky.top[2] * 0.3)})`);
    ctx.fillStyle = sg;
    ctx.fillRect(0, hor, W, H - hor);
    /* 枯枝林（确定性位置，远近两层） */
    const treeRnd = mulberry32(777);
    for (let layer = 0; layer < 2; layer++) {
      const scale = layer ? 0.6 : 1.0;
      const y = layer ? hor + (H - hor) * 0.25 : hor + 4;
      ctx.strokeStyle = layer ? 'rgba(35,30,28,0.5)' : 'rgba(22,18,16,0.8)';
      ctx.lineWidth = 2.2 * scale;
      let tx = treeRnd() * 60;
      while (tx < W + 40) {
        const th = (50 + treeRnd() * 60) * scale;
        const tw = th * 0.04;
        /* 主干 */
        ctx.beginPath();
        ctx.moveTo(tx, y);
        ctx.quadraticCurveTo(tx + (treeRnd() - 0.5) * 12, y - th * 0.5, tx + (treeRnd() - 0.5) * 16, y - th);
        ctx.stroke();
        /* 分枝 2-3 根 */
        ctx.lineWidth = 1.2 * scale;
        for (let b = 0; b < 3; b++) {
          const bh = th * (0.35 + treeRnd() * 0.25);
          const by = y - bh;
          const bd = (treeRnd() > 0.5 ? 1 : -1) * (12 + treeRnd() * 18) * scale;
          ctx.beginPath();
          ctx.moveTo(tx + (treeRnd() - 0.5) * 6, by);
          ctx.quadraticCurveTo(tx + bd * 0.5, by - bh * 0.4, tx + bd, by - bh * 0.6);
          ctx.stroke();
        }
        ctx.lineWidth = 2.2 * scale;
        tx += 40 + treeRnd() * 80;
      }
    }
    /* 风吹雪漂（沿地面飘动，亮度随风速） */
    if (S.wind > 0.05) {
      const driftN = Math.round(S.wind * 30);
      ctx.fillStyle = `rgba(240,246,255,${(0.06 + S.wind * 0.12).toFixed(3)})`;
      for (let i = 0; i < driftN; i++) {
        const dy = hor + 10 + ((i * 37 + frameTime * (20 + S.wind * 80)) % (H - hor));
        const dx = ((i * 53 + frameTime * (30 + S.wind * 120)) % (W + 60)) - 30;
        ctx.fillRect(dx, dy, 8 + S.wind * 14, 1.5);
      }
    }
    /* 月影投在雪地上 */
    if (!cel.isDay && cel.y < hor) {
      const shadowW = 60 + (hor - cel.y) * 0.3;
      const shadowA = 0.06 * (1 - Math.abs(cel.x - W / 2) / W);
      if (shadowA > 0.01) {
        ctx.fillStyle = `rgba(20,25,40,${shadowA.toFixed(3)})`;
        ctx.beginPath();
        ctx.ellipse(W - cel.x, hor + 20, shadowW, 12, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* ---------- 主题：大漠（沙丘层 + 热浪 + 星空明澈） ---------- */
  if (theme === 4) {
    const hor = H * 0.58;
    /* 沙丘层（三层正弦曲线，颜色随天色） */
    for (let layer = 0; layer < 3; layer++) {
      const phase = layer * 1.8;
      const amp = 22 + layer * 14;
      const yBase = hor + layer * (H - hor) * 0.3;
      const warm = [Math.round(200 - layer * 30), Math.round(170 - layer * 28), Math.round(120 - layer * 20)];
      ctx.fillStyle = `rgba(${warm[0]},${warm[1]},${warm[2]},${(0.85 - layer * 0.15).toFixed(2)})`;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) {
        const y = yBase + Math.sin(x * 0.006 + phase + frameTime * 0.05) * amp
                       + Math.sin(x * 0.015 + phase * 2) * amp * 0.3;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
    /* 热浪扭曲（昼间，地平线附近微弱波动） */
    if (L > 0.6) {
      const shimmerA = (L - 0.6) * 0.5;
      ctx.strokeStyle = `rgba(255,240,200,${(shimmerA * 0.08).toFixed(3)})`;
      ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const y = hor - 8 + i * 5;
        const xOff = Math.sin(frameTime * 3 + i * 2) * 3;
        ctx.beginPath();
        ctx.moveTo(xOff, y);
        ctx.quadraticCurveTo(W * 0.5 + xOff * 2, y + 1.5, W + xOff, y);
        ctx.stroke();
      }
    }
    /* 岩石剪影（确定性） */
    const rockRnd = mulberry32(444);
    ctx.fillStyle = 'rgba(50,38,25,0.85)';
    for (let i = 0; i < 4; i++) {
      const rx = rockRnd() * W;
      const ry = hor + 20 + rockRnd() * (H - hor) * 0.5;
      const rs = 8 + rockRnd() * 18;
      ctx.beginPath();
      ctx.moveTo(rx - rs, ry);
      ctx.quadraticCurveTo(rx - rs * 0.3, ry - rs * 0.7, rx, ry - rs * 0.8);
      ctx.quadraticCurveTo(rx + rs * 0.4, ry - rs * 0.5, rx + rs, ry);
      ctx.closePath();
      ctx.fill();
    }
    /* 大漠星空（夜间额外亮星——无光污染） */
    const desertStarA = Math.max(0, 1 - L * 1.8);
    if (desertStarA > 0.05) {
      const dsRnd = mulberry32(888);
      for (let i = 0; i < 40; i++) {
        const sx2 = dsRnd() * W;
        const sy2 = dsRnd() * hor * 0.8;
        const sr = 0.5 + dsRnd() * 1.2;
        const tw2 = 0.5 + 0.5 * Math.sin(frameTime * (1 + dsRnd() * 2) + dsRnd() * 7);
        ctx.fillStyle = `rgba(255,255,255,${(desertStarA * tw2 * 0.9).toFixed(3)})`;
        ctx.fillRect(sx2, sy2, sr, sr);
      }
    }
    /* 风沙（沿地面飘动） */
    if (S.wind > 0.1) {
      ctx.fillStyle = `rgba(200,180,130,${(S.wind * 0.08).toFixed(3)})`;
      for (let i = 0; i < Math.round(S.wind * 20); i++) {
        const sy3 = hor + 5 + ((i * 41 + frameTime * (40 + S.wind * 100)) % (H - hor));
        const sx3 = ((i * 67 + frameTime * (50 + S.wind * 150)) % (W + 40)) - 20;
        ctx.fillRect(sx3, sy3, 6 + S.wind * 10, 1);
      }
    }
  }

  /* ---------- 主题：太空舱（舷窗 + 地球弧线 + 漂浮物） ---------- */
  if (theme === 5) {
    /* 太空背景填满（覆盖山脊） */
    ctx.fillStyle = 'rgba(3,4,8,0.92)';
    ctx.fillRect(0, 0, W, H);
    /* 星星（太空更亮更密） */
    const spRnd = mulberry32(333);
    for (let i = 0; i < 80; i++) {
      const sx4 = spRnd() * W;
      const sy4 = spRnd() * H * 0.7;
      const sr2 = 0.5 + spRnd() * 1.5;
      const tw3 = 0.4 + 0.6 * Math.abs(Math.sin(frameTime * 0.8 + spRnd() * 7));
      ctx.fillStyle = `rgba(255,255,255,${(tw3 * 0.9).toFixed(3)})`;
      ctx.fillRect(sx4, sy4, sr2, sr2);
    }
    /* 地球弧线（下方） */
    const eR = W * 1.1;
    const eCx = W * 0.5;
    const eCy = H + eR * 0.72;
    const eg = ctx.createRadialGradient(eCx, eCy - eR * 0.28, eR * 0.6, eCx, eCy, eR);
    eg.addColorStop(0, 'rgba(30,80,140,0.9)');
    eg.addColorStop(0.5, 'rgba(20,50,100,0.8)');
    eg.addColorStop(0.85, 'rgba(10,25,55,0.7)');
    eg.addColorStop(1, 'rgba(5,15,35,0.8)');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(eCx, eCy, eR, 0, Math.PI * 2);
    ctx.fill();
    /* 地球云层（简单噪声带） */
    ctx.save();
    ctx.beginPath();
    ctx.arc(eCx, eCy, eR, 0, Math.PI * 2);
    ctx.clip();
    for (let i = 0; i < 4; i++) {
      const cy2 = H * (0.82 + i * 0.04);
      const cw = W * (0.3 + (i % 2) * 0.3);
      ctx.fillStyle = `rgba(255,255,255,${(0.08 + i * 0.02).toFixed(2)})`;
      ctx.beginPath();
      ctx.ellipse(W * 0.3 + i * W * 0.2, cy2, cw, 4 + i * 2, 0.1 * (i % 2 ? 1 : -1), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    /* 大气辉光（地球边缘） */
    const ag = ctx.createRadialGradient(eCx, eCy, eR * 0.98, eCx, eCy, eR * 1.05);
    ag.addColorStop(0, 'rgba(100,160,255,0.3)');
    ag.addColorStop(1, 'rgba(100,160,255,0)');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.arc(eCx, eCy, eR * 1.05, 0, Math.PI * 2);
    ctx.fill();
    /* 舷窗框（圆角矩形暗边） */
    ctx.strokeStyle = 'rgba(40,45,55,0.95)';
    ctx.lineWidth = 18;
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(9, 9, W - 18, H - 18, 30);
      ctx.stroke();
    } else {
      ctx.strokeRect(9, 9, W - 18, H - 18);
    }
    ctx.strokeStyle = 'rgba(70,75,85,0.5)';
    ctx.lineWidth = 2;
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(19, 19, W - 38, H - 38, 22);
      ctx.stroke();
    }
    /* 漂浮微粒（太空尘埃） */
    const duskA = 0.6;
    for (let i = 0; i < 12; i++) {
      const px4 = (i * 89 + frameTime * (3 + i % 3)) % W;
      const py4 = (i * 47 + Math.sin(frameTime * 0.3 + i) * 20) % (H * 0.5);
      ctx.fillStyle = `rgba(200,210,230,${(duskA * (0.3 + 0.4 * Math.sin(frameTime + i * 2))).toFixed(3)})`;
      ctx.fillRect(px4, py4, 1.5, 1.5);
    }
  }

  // 萤火（夜 + 夜虫）
  const flyA = clamp(S.cricket * 1.4, 0, 1) * Math.max(0, 1 - L * 2.2);
  if (flyA > 0.02) {
    for (const f of flies) {
      f.x += Math.sin(frameTime * f.sp + f.p) * 12 * dt + S.wind * 14 * dt;
      f.y += Math.cos(frameTime * f.sp * 0.8 + f.p * 2) * 8 * dt;
      if (f.x > W + 8) f.x = -8; if (f.x < -8) f.x = W + 8;
      if (f.y > H) f.y = H * 0.62; if (f.y < H * 0.58) f.y = H * 0.98;
      const blink = Math.max(0, Math.sin(frameTime * 1.6 * f.sp + f.p * 5));
      if (blink > 0.25) {
        ctx.globalAlpha = flyA * blink;
        ctx.drawImage(glowSprite, f.x - 7, f.y - 7, 14, 14);
      }
    }
    ctx.globalAlpha = 1;
  }

  // 雨
  if (S.rain > 0.02) {
    const count = Math.round(raindrops.length * S.rain);
    const windX = S.wind * 260 + Math.sin(frameTime * 0.8) * S.wind * 60;
    ctx.strokeStyle = `rgba(200,214,230,${(0.14 + S.rain * 0.3).toFixed(3)})`;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const d = raindrops[i];
      d.y += d.v * dt;
      d.x += windX * dt;
      if (d.y > H) { d.y = -20; d.x = Math.random() * W * 1.2 - W * 0.1; }
      if (d.x > W * 1.1) d.x -= W * 1.2;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - (windX / d.v) * 12, d.y - 12);
    }
    ctx.stroke();
  }

  // 雪
  if (S.snow > 0.02) {
    const count = Math.round(snowflakes.length * S.snow);
    ctx.fillStyle = 'rgba(240,246,255,0.85)';
    for (let i = 0; i < count; i++) {
      const f = snowflakes[i];
      f.y += f.v * dt * (0.5 + S.snow * 0.7);
      f.x += Math.sin(frameTime * 0.9 + f.p) * 16 * dt + S.wind * 90 * dt;
      if (f.y > H + 4) { f.y = -6; f.x = Math.random() * W; }
      if (f.x > W + 6) f.x -= W + 12;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 落花
  if (S.petal > 0.02) {
    const count = Math.round(petals.length * S.petal);
    for (let i = 0; i < count; i++) {
      const p2 = petals[i];
      p2.y += p2.v * dt * (0.6 + S.petal * 0.6);
      p2.x += Math.sin(frameTime * 1.1 + p2.p) * 22 * dt + (20 + S.wind * 160) * dt;
      p2.spin += dt * 2.4;
      if (p2.y > H + 6) { p2.y = -8; p2.x = Math.random() * W * 1.15; }
      if (p2.x > W + 8) p2.x -= W + 14;
      ctx.save();
      ctx.translate(p2.x, p2.y);
      ctx.rotate(p2.spin + Math.sin(frameTime + p2.p));
      ctx.fillStyle = `rgba(246,182,192,${(0.55 + 0.3 * Math.sin(p2.p + frameTime)).toFixed(3)})`;
      ctx.beginPath(); ctx.ellipse(0, 0, p2.s, p2.s * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // 篝火
  if (S.fire > 0.03) {
    const fx = W * 0.82, fy = H * 0.9;
    const flick = 0.75 + 0.25 * Math.sin(frameTime * 9.3) * Math.sin(frameTime * 4.1);
    const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, 150 * S.fire * flick + 40);
    fg.addColorStop(0, `rgba(255,168,84,${(0.4 * S.fire * flick).toFixed(3)})`);
    fg.addColorStop(1, 'rgba(255,100,40,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(fx - 260, fy - 260, 520, 520);
    ctx.fillStyle = '#2a1c14';
    ctx.beginPath(); ctx.ellipse(fx, fy + 8, 34, 10, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 3; i++) {
      const fl = (0.8 + 0.2 * Math.sin(frameTime * 8 + i * 2.4)) * S.fire;
      const h = 34 * fl + 14;
      ctx.fillStyle = `hsl(${28 - i * 8},95%,${58 - i * 8}%)`;
      ctx.beginPath();
      ctx.moveTo(fx - (16 - i * 4), fy);
      ctx.quadraticCurveTo(fx - 6 + Math.sin(frameTime * 7 + i) * 5, fy - h * 0.6, fx + Math.sin(frameTime * 5.5 + i * 2) * 4, fy - h);
      ctx.quadraticCurveTo(fx + 8, fy - h * 0.5, fx + (16 - i * 4), fy);
      ctx.closePath(); ctx.fill();
    }
    if (Math.random() < 0.3 + S.fire * 0.5) embers.push({ x: fx + (Math.random() - 0.5) * 22, y: fy - 24, vy: -40 - Math.random() * 60, vx: (Math.random() - 0.5) * 26, life: 1 });
    ctx.fillStyle = 'rgba(255,190,110,0.9)';
    for (const em of embers) {
      em.life -= dt * 0.7; em.y += em.vy * dt; em.x += em.vx * dt;
      if (em.life > 0) { ctx.globalAlpha = em.life; ctx.fillRect(em.x, em.y, 2, 2); }
    }
    ctx.globalAlpha = 1;
    embers = embers.filter(e => e.life > 0).slice(-90);
  }

  // 闪电折线
  bolts = bolts.filter(b => b.life > 0);
  for (const b of bolts) {
    b.life -= dt * 3.4;
    const a = Math.max(0, b.life);
    ctx.strokeStyle = `rgba(240,246,255,${(a * 0.25).toFixed(3)})`;
    ctx.lineWidth = 7;
    ctx.beginPath();
    b.pts.forEach((p3, i) => i ? ctx.lineTo(p3[0], p3[1]) : ctx.moveTo(p3[0], p3[1]));
    ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${(a * 0.95).toFixed(3)})`;
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }
  if (flashT > 0.005) {
    ctx.fillStyle = `rgba(235,240,255,${(flashT * 0.3).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    flashT -= dt * 2.1;
  }

  // 暗角
  if (!vigGrad) {
    vigGrad = ctx.createRadialGradient(W / 2, H * 0.44, Math.min(W, H) * 0.36, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vigGrad.addColorStop(1, 'rgba(4,6,10,0.46)');
  }
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  bellT = Math.max(0, bellT - dt * 0.55);
  /* 主题过渡渐隐 */
  if (themeFadeT > 0) {
    drawThemeFade();
    themeFadeT -= dt * 1.8;
  }
}

/* ---------- 事件调度（雷/钟/鸟） ---------- */
function schedule() {
  if (S.thunder > 0.03) {
    if (frameTime > nextThunderAt) {
      nextThunderAt = frameTime + 5 + Math.random() * 30 / (S.thunder + 0.12);
      if (AC && sndOn) strikeThunder();
      else flashT = 0.5; // 静音时也保留视觉
    }
  } else nextThunderAt = frameTime + 4;
  if (S.bell > 0.03) {
    if (frameTime > nextBellAt) {
      nextBellAt = frameTime + 8 + Math.random() * 14 / (S.bell + 0.1);
      if (AC && sndOn) strikeBell();
      else bellT = 1;
    }
  } else nextBellAt = frameTime + 6;
  if (S.birds > 0.04 && skyAt(time).L > 0.4) {
    if (frameTime > nextBirdAt) {
      nextBirdAt = frameTime + 1.4 + Math.random() * 4 / (S.birds + 0.1);
      if (AC && sndOn) birdChirp();
    }
  } else nextBirdAt = frameTime + 2;
}

function dailyScene() {
  const d = new Date();
  const k = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  let h = 0;
  for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return DAILY_SCENES[h % DAILY_SCENES.length];
}

    time = +this.value;

  if (el) el.classList.toggle('on', S[k] > 0.02);
}
function updLeds() { CH.forEach(updLed); }
/* ---------- 彩蛋：十全十美（十声道全满 → 天空浮现滑稽） ---------- */
let hjqT = 0;   /* 滑稽显现的剩余时间 */
function foundEgg(site) {
  try {
    const e = JSON.parse(localStorage.getItem('toy-eggs') || '{}');
    if (!e[site]) { e[site] = Date.now(); localStorage.setItem('toy-eggs', JSON.stringify(e)); }
  } catch (err) {}
}
function drawHjq(a) {
  const r = H * 0.20;
  const cx = W / 2, cy = H * 0.24;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#f5d442';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c99a1d'; ctx.lineWidth = r * 0.045;
  ctx.stroke();
  /* 坏笑眯眼：两道下弯粗弧 */
  ctx.strokeStyle = '#3a2c10'; ctx.lineWidth = r * 0.075;
  ctx.lineCap = 'round';
  for (const ex of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(cx + ex * r * 0.38, cy - r * 0.12, r * 0.16, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }
  /* 咧嘴坏笑 */
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.28, r * 0.42, 0.08 * Math.PI, 0.92 * Math.PI);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3a2c10'; ctx.lineWidth = r * 0.055; ctx.stroke();
  /* 舌头 */
  ctx.fillStyle = '#d96a5a';
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.55, r * 0.17, Math.PI, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

let curPreset = null;
function applyState(st) {
  CH.forEach(c => S[c] = st[c] !== undefined ? st[c] : 0);
  if (st.time !== undefined) time = st.time;
  if (st.theme !== undefined) { theme = st.theme; updTheme(); }
  initAudio(); updateAudio(1.2);
  buildUI(); updateClock();
  saveStateSoon();
}

function updateClock() {
  const h = Math.floor(time) % 24, m = Math.floor((time % 1) * 60);
  document.getElementById('clock').textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
  const tr = document.getElementById('timeR');
  if (tr && document.activeElement !== tr) tr.value = time;
}

/* ---------- 状态持久化 & 分享 ---------- */
function packState() {
  return { c: CH.map(k => +S[k].toFixed(2)), t: +time.toFixed(1), th: theme };
}
function saveStateSoon() {
  clearTimeout(saveStateSoon.t);
  saveStateSoon.t = setTimeout(() => {
    try { localStorage.setItem('scape-state', JSON.stringify(packState())); } catch (e) {}
  }, 400);
}
function restoreState() {
  let hasSaved = false;
  try {
    const st = JSON.parse(localStorage.getItem('scape-state') || 'null');
    if (st && Array.isArray(st.c)) {
      st.c.forEach((v, i) => { if (CH[i] !== undefined) S[CH[i]] = clamp(+v || 0, 0, 1); });
      if (st.t !== undefined) time = clamp(+st.t, 0, 24);
      if (st.th !== undefined) { theme = clamp(st.th | 0, 0, 5); hasSaved = true; }
    }
  } catch (e) {}
  // 季节自动主题：首访（无保存）按月份选主题
  if (!hasSaved) {
    const mo = new Date().getMonth() + 1;  // 1-12
    theme = mo === 12 || mo <= 2 ? 3       // 冬 → 雪原
           : mo <= 5 ? 0                    // 春 → 山（花信风）
           : mo <= 8 ? 1                    // 夏 → 海
           : 0;                             // 秋 → 山
  }
  // #w= 分享链接优先
  const m = location.hash.match(/w=([A-Za-z0-9+/=]+)/);
  if (m) {
    try {
      const st = JSON.parse(atob(m[1]));
      if (st && Array.isArray(st.c)) {
        st.c.forEach((v, i) => { if (CH[i] !== undefined) S[CH[i]] = clamp(+v || 0, 0, 1); });
        if (st.t !== undefined) time = clamp(+st.t, 0, 24);
        if (st.th !== undefined) theme = clamp(st.th | 0, 0, 5);
        toast(T('已载入分享的境', 'Shared scene loaded'));
      }
    } catch (e) {}
  }
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

const THEMES = ['⛰ 山', '🌊 海', '🏙 城', '❄ 雪原', '🏜 大漠', '🛸 太空'];

themeBtn.addEventListener('click', () => {

/* 睡眠渐弱定时 */
const sleepBtn = document.getElementById('sleepBtn');

/* 音画录制（webm） */
const recBtn = document.getElementById('recBtn');
let recorder = null, recChunks = [], recMime = '';
function pickMime() {
  const list = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  for (const m of list) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
recBtn.addEventListener('click', () => {
  if (recorder) {
    recorder.stop();
    return;
  }
  if (!window.MediaRecorder || !cv.captureStream) { toast(T('此浏览器不支持录制', 'Recording unsupported')); return; }
  initAudio();
  const stream = cv.captureStream(30);
  if (recDest) recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mime = pickMime();
  try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch (e) { toast(T('录制启动失败', 'Recorder failed')); recorder = null; return; }
  recMime = mime;
  recChunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    const type = recMime || 'video/webm';
    const blob = new Blob(recChunks, { type });
    const a = document.createElement('a');
    a.download = `scape-${Date.now()}.` + (type.includes('mp4') ? 'mp4' : 'webm');
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    recorder = null;
    recBtn.classList.remove('on');
    recBtn.textContent = lang === 'zh' ? '● 录' : '● REC';
    toast(T('录制已保存', 'Recording saved'));
  };
  recorder.start(400);
  recBtn.classList.add('on');
  recBtn.textContent = lang === 'zh' ? '■ 录制中' : '■ STOP';
  toast(T('开始录制——画面与声音都会录下', 'Recording — video & audio'));
});

/* 声音 */
const sndBtn = document.getElementById('sndBtn');
function updSnd() { sndBtn.textContent = lang === 'zh' ? (sndOn ? '♪ 声' : '♪ 静') : (sndOn ? '♪ SND' : '♪ MUTE'); }
sndBtn.addEventListener('click', () => {
  sndOn = !sndOn;

document.getElementById('langBtn').addEventListener('click', () => {

/* ---------- 环境音乐层：基于声道状态生成五声音阶旋律 ---------- */
/* 不只是噪声——音符选择和时长由当前声道状态调制 */
let musicTimer = null;
const SCALES = {
  pentatonic: [220, 247.5, 293.33, 330, 391.5, 440, 495, 586.66],  // A 大调五声
  minorPenta: [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33], // A 小调五声
  japanese:   [220, 233.08, 293.66, 311.13, 392, 440, 466.16, 587.33]  // 日本音阶（阴翳）
};
function themeScale() {
  return theme === 3 ? SCALES.minorPenta   // 雪原：小调（清冷）
       : theme === 4 ? SCALES.pentatonic    // 大漠：大调（开阔）
       : theme === 5 ? SCALES.japanese      // 太空：日本音阶（疏离）
       : SCALES.pentatonic;                  // 山/海/城：大调
}
function ambientNote() {
  if (!AC || !sndOn) return;
  const scale = themeScale();
  /* 声道影响音符选择 */
  const warmth = S.fire * 0.5 + S.stream * 0.3;     // 火/溪 → 低音区
  const energy = S.wind * 0.4 + S.rain * 0.3;       // 风/雨 → 高音区
  const idx = Math.floor((0.2 + energy * 0.6 + (Math.random() - 0.5) * 0.3) * scale.length);
  const fq = scale[clamp(idx, 0, scale.length - 1)] * (warmth > 0.4 ? 0.5 : 1);  // 温暖时降八度
  /* 声道影响音符时长 */
  const dur = 1.5 + S.bell * 3 + (1 - S.rain) * 1;   // 远钟→长音，雨大→短音
  const ac2 = AC;
  const o = ac2.createOscillator(), g = ac2.createGain();
  const f = ac2.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 1200 + energy * 2000;
  o.type = 'sine';
  o.frequency.value = fq;
  /* 慢 attack + 慢 release = 环境感 */
  const t0 = ac2.currentTime;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.025, t0 + dur * 0.3);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.1);
  /* 下一次音符间隔 */
  const gap = (2 + Math.random() * 3) * (1 - S.rain * 0.3);
  musicTimer = setTimeout(ambientNote, gap * 1000);
}
function startMusic() {
  if (musicTimer) return;
  ambientNote();
}
function stopMusic() {
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
}

/* ---------- 聆听时长统计（门户读取 scape-stats.minutes） ---------- */
let listenSec = 0;
setInterval(() => {
  if (document.hidden) return;
  if (!sndOn) return;
  listenSec += 5;
  if (listenSec >= 60) {
    try {
      const sc = JSON.parse(localStorage.getItem('scape-stats') || '{"minutes":0}');
      sc.minutes = (sc.minutes || 0) + Math.floor(listenSec / 60);
      localStorage.setItem('scape-stats', JSON.stringify(sc));
      listenSec %= 60;
    } catch (e) {}
  }
}, 5000);

/* ---------- 主循环 ---------- */
let prev = performance.now();
let pageHidden = false;
let clockAcc = 0;
document.addEventListener('visibilitychange', () => {
  pageHidden = document.hidden;
  if (!pageHidden) prev = performance.now();
  if (pageHidden) stopMusic();
  else if (sndOn && AC) startMusic();
});
function loop(now) {
  requestAnimationFrame(loop);
  if (pageHidden) return;
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  if (timeFlow) {
    time = (time + dt * 0.1) % 24; // 24h ≈ 4 分钟
    clockAcc += dt;
    if (clockAcc > 0.4) { clockAcc = 0; updateClock(); }
    saveStateSoon();
  }
  draw(dt);
  schedule();
  updateAudio(2);
  if (hjqT > 0) hjqT -= dt;
  // 睡眠定时：到点后 8 秒渐弱至无声
  if (sleepAt && Date.now() > sleepAt && !sleepFading) {
    sleepFading = true;
    sleepIdx = 0;
    if (master && AC) master.gain.setTargetAtTime(0, AC.currentTime, 3.2);
    timeFlow = false; updFlow();
    toast(T('晚安', 'good night'));
    setTimeout(updSleep, 100);
  }
}

/* ---------- 键盘快捷键 ---------- */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  /* 1-9 预设 */
  if (k >= '1' && k <= '9') {
    const keys = Object.keys(PRESETS);
    const idx = +k - 1;
    if (keys[idx]) {
      applyState(PRESETS[keys[idx]]);
      curPreset = keys[idx];
      document.querySelectorAll('#presets .chip').forEach((c, i) => c.classList.toggle('on', i === idx + 1)); /* +1 跳过每日 chip */
    }
  }
  /* 0 = 每日气象 */
  else if (k === '0') {
    const ds = dailyScene();
    applyState(ds.s);
    curPreset = null;
    document.querySelectorAll('#presets .chip').forEach((c, i) => c.classList.toggle('on', i === 0));
    toast(lang === 'zh' ? `今日气象 · ${ds.name}` : `today · ${ds.nameEn}`);
  }
  /* T = 主题切换 */
  else if (k === 't') { snapshotTheme(); theme = (theme + 1) % 6; updTheme(); saveStateSoon(); }
  /* M = 心境随机 */
  else if (k === 'm') { document.getElementById('moodBtn').click(); }
  /* F = 时光流转 */
  else if (k === 'f') { document.getElementById('flowBtn').click(); }
  /* R = 录制 */
  else if (k === 'r') { document.getElementById('recBtn').click(); }
  /* ←→ = 时刻 */
  else if (e.key === 'ArrowLeft') { time = Math.max(0, time - 0.5); updateClock(); saveStateSoon(); }
  else if (e.key === 'ArrowRight') { time = Math.min(24, time + 0.5); updateClock(); saveStateSoon(); }
});

/* ---------- 启动 ---------- */
restoreState();
document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
updTheme(); updSnd(); updFlow(); updSleep(); buildUI(); updateClock();
if (!recorder && lang === 'en') recBtn.textContent = '● REC';
// 首次手势解锁音频
document.addEventListener('pointerdown', function once() {
  initAudio();
  if (sndOn) startMusic();
  document.removeEventListener('pointerdown', once);
}, { once: true });
requestAnimationFrame(loop);

/* #capture：极夜场景自录（约 14 秒 webm，画面+声音） */
if (location.hash.includes('capture')) {
  const CAPT = 14;
  applyState({ rain: .25, wind: .28, snow: .88, bell: .32, cricket: .3, time: 23, th: 2 });
  theme = 2; updTheme();
  const st = document.createElement('div');
  st.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99;background:#20242c;color:#fff;font:12px monospace;padding:6px 12px;border-radius:6px';
  st.textContent = 'CAP …';
  document.body.appendChild(st);
  setTimeout(() => {
    try {
      initAudio();
      const stream = cv.captureStream(30);
      if (recDest) recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
      const mime = pickMime();
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      const chunks = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: mime || 'video/webm' });
        const a = document.createElement('a');
        a.download = 'scape-demo.' + ((mime || '').includes('mp4') ? 'mp4' : 'webm');
        a.href = URL.createObjectURL(blob);
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        st.textContent = 'CAP saved ✓';
        setTimeout(() => window.close(), 9000);
      };
      rec.start(300);
      const t0 = performance.now();
      const tick = () => {
        const el = (performance.now() - t0) / 1000;
        if (el > CAPT) { st.textContent = 'CAP saved ✓'; rec.stop(); return; }
        st.textContent = 'CAP ' + el.toFixed(1) + 's';
        setTimeout(tick, 200);
      };
      tick();
    } catch (e) { st.textContent = 'CAP err ' + e.message; }
  }, 600);
}
