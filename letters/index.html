<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101a20">
<title>纸间 · LETTERS — 互动书信</title>
<style>
  html { color-scheme: dark; }
  :root {
    --paper: #f0e8d6; --paper2: #e8ddc4; --ink: #33302a;
    --seal: #9e3528; --gold: #d9b57c;
    --ruling: rgba(130,108,64,0.09);
    --bg1: #101a20; --bg2: #1a2732;
    --font: "Songti SC","STSong","SimSun","Noto Serif SC",Georgia,serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:var(--font); background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg1) 75%); color:var(--ink); overflow:hidden; user-select:none; }
  #motes { position:fixed; inset:0; z-index:1; pointer-events:none; }
  .stage { position:fixed; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; padding:20px; }

  /* 选集屏 */
  .select { position:fixed; inset:0; z-index:8; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 32%,rgba(16,26,32,0.96),rgba(8,10,14,0.99)); overflow-y:auto; padding:6vh 20px 40px; }
  .sel-kicker { font-size:12px; letter-spacing:0.6em; color:rgba(217,181,124,0.7); }
  .sel-title { font-size:clamp(30px,6vw,52px); letter-spacing:0.24em; color:#ece5d2; margin-top:12px; font-weight:600; }
  .sel-sub { font-size:12.5px; letter-spacing:0.4em; color:rgba(236,229,210,0.45); margin-top:10px; }
  .story-list { margin-top:30px; display:flex; flex-direction:column; gap:10px; width:min(560px,92vw); }
  .story-card { border:1px solid rgba(240,232,214,0.14); border-radius:8px; cursor:pointer; background:rgba(20,26,32,0.6); padding:16px 20px; text-align:left; color:#ece5d2; font-family:inherit; display:flex; align-items:baseline; gap:14px; transition:border-color .25s,transform .25s; }
  .story-card:hover { border-color:rgba(217,181,124,0.6); transform:translateX(4px); }
  .story-card .tt { font-size:17px; letter-spacing:0.14em; min-width:108px; }
  .story-card .kk { font-size:11.5px; letter-spacing:0.18em; color:rgba(236,229,210,0.5); flex:1; }
  .story-card .prog { font-size:11px; font-family:Georgia,serif; color:rgba(217,181,124,0.8); }

  /* 标题屏 */
  .title { position:fixed; inset:0; z-index:8; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; background:radial-gradient(ellipse at 50% 35%,var(--bg2),rgba(8,10,14,0.985)); transition:opacity 1.2s; gap:6px; }
  .title.show { display:flex; }
  .title.gone { opacity:0; pointer-events:none; display:flex !important; }
  .ts-kicker { font-size:13px; letter-spacing:0.6em; color:rgba(217,181,124,0.75); margin-bottom:14px; }
  .ts-title { font-size:clamp(44px,9vw,84px); font-weight:600; letter-spacing:0.18em; color:#ece5d2; text-shadow:0 0 40px rgba(217,181,124,0.25); }
  .ts-desc { margin-top:26px; font-size:14px; line-height:2.2; letter-spacing:0.12em; color:rgba(236,229,210,0.7); max-width:480px; }
  .ts-actions { margin-top:36px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn-main { border:1px solid var(--gold); background:none; color:var(--gold); font-family:inherit; font-size:15px; letter-spacing:0.3em; padding:13px 30px; border-radius:2px; cursor:pointer; transition:background .3s,color .3s; }
  .btn-main:hover { background:var(--gold); color:#14100a; }
  .btn-sub { border:1px solid rgba(240,232,214,0.3); background:none; color:rgba(240,232,214,0.7); font-family:inherit; font-size:13px; letter-spacing:0.2em; padding:11px 22px; border-radius:2px; cursor:pointer; }
  .btn-sub:hover { color:var(--paper); border-color:var(--paper); }

  /* 信封 */
  .envelope { position:relative; width:min(420px,88vw); aspect-ratio:1.45/1; cursor:pointer; transition:transform .5s; perspective:800px; }
  .envelope:hover { transform:translateY(-6px); }
  .env-body { position:absolute; inset:0; border-radius:6px; background:linear-gradient(160deg,#d9cbae,#cbbc9c); box-shadow:0 24px 60px rgba(0,0,0,0.5); }
  .env-flap { position:absolute; top:0; left:0; right:0; height:56%; background:#cfc09e; clip-path:polygon(0 0,100% 0,50% 100%); border-radius:6px 6px 0 0; transform-origin:top center; transition:transform .8s; z-index:3; }
  .envelope.open .env-flap { transform:rotateX(178deg); }
  .env-peek { position:absolute; left:6%; right:6%; top:12%; bottom:12%; background:var(--paper); border-radius:3px; z-index:2; transition:transform .7s .3s; }
  .envelope.open .env-peek { transform:translateY(-16%) scale(1.04); }
  .seal { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:58px; height:58px; border-radius:50%; background:radial-gradient(circle at 38% 32%,#c65b44,var(--seal) 60%); display:grid; place-items:center; z-index:4; color:var(--paper); font-size:26px; font-weight:600; transition:opacity .4s .5s; }
  .envelope.open .seal { opacity:0; }
  .env-hint { position:absolute; left:50%; bottom:-44px; transform:translateX(-50%); color:rgba(240,232,214,0.55); font-size:13px; letter-spacing:0.4em; white-space:nowrap; }

  /* 信纸 */
  .letter { width:min(680px,94vw); max-height:82vh; overflow-y:auto; overscroll-behavior:contain; background:repeating-linear-gradient(180deg,transparent 0,transparent 36px,var(--ruling) 36px,var(--ruling) 37px),radial-gradient(ellipse at 20% 10%,rgba(0,0,0,0.05),transparent 55%),linear-gradient(165deg,var(--paper),var(--paper2)); border-radius:4px; padding:clamp(28px,5vw,56px) clamp(24px,6vw,64px); box-shadow:0 30px 80px rgba(0,0,0,0.55); position:relative; }
  .letter::before,.letter::after { content:''; position:absolute; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(0,0,0,0.14) 18%,rgba(0,0,0,0.14) 82%,transparent); }
  .letter::before { top:33%; } .letter::after { top:66%; }
  .letter .yr { font-size:12.5px; letter-spacing:0.35em; opacity:0.6; margin-bottom:4px; }
  .letter h2 { font-size:clamp(19px,3vw,25px); font-weight:600; letter-spacing:0.14em; margin-bottom:20px; }
  .letter p { font-size:clamp(15px,2.2vw,17.5px); line-height:2.15; letter-spacing:0.05em; margin-bottom:1.1em; opacity:0; transform:translateY(8px); filter:blur(3px); }
  .letter p.in { opacity:1; transform:none; filter:blur(0); transition:opacity 1.3s ease,transform 1s ease,filter 1.2s ease; }
  .letter p.drop::first-letter { font-size:1.9em; float:left; line-height:1; padding:6px 10px 0 0; color:var(--seal); font-weight:600; }
  .letter.postcard { width:min(480px,92vw); }

  /* 回信 */
  .replies { margin-top:26px; display:none; flex-direction:column; gap:12px; }
  .replies.in { display:flex; }
  .reply { border:1px solid rgba(51,48,42,0.35); background:rgba(240,232,214,0.35); color:var(--ink); font-family:inherit; font-size:15px; line-height:1.8; letter-spacing:0.04em; padding:13px 20px; border-radius:3px; cursor:pointer; text-align:left; transition:background .25s,border-color .25s,transform .25s; }
  .reply:hover { background:rgba(158,53,40,0.1); border-color:var(--seal); transform:translateX(4px); }

  /* 结局 */
  .ending { position:fixed; inset:0; z-index:9; display:none; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 40%,rgba(30,34,44,0.94),rgba(8,10,14,0.985)); text-align:center; padding:34px; overflow-y:auto; }
  .ending.show { display:flex; }
  .en-kicker { font-size:12px; letter-spacing:0.55em; color:rgba(217,181,124,0.7); }
  .en-title { font-size:clamp(34px,6.5vw,58px); letter-spacing:0.22em; color:#ece5d2; margin:18px 0 26px; font-weight:600; }
  .en-text { font-size:clamp(15px,2.2vw,17px); line-height:2.4; letter-spacing:0.08em; color:rgba(236,229,210,0.85); max-width:560px; white-space:pre-line; text-align:left; }

  .corner { position:fixed; z-index:5; top:18px; right:22px; display:flex; gap:8px; }
  .btn-ghost { border:1px solid rgba(240,232,214,0.25); background:rgba(0,0,0,0.35); color:rgba(240,232,214,0.8); font-family:inherit; font-size:12px; letter-spacing:0.12em; padding:6px 13px; border-radius:999px; cursor:pointer; }
  .btn-ghost:hover { color:var(--gold); border-color:var(--gold); }

  .home-link { position:fixed; left:26px; bottom:26px; z-index:6; width:42px; height:42px; border-radius:50%; border:1px solid rgba(240,232,214,0.22); background:rgba(0,0,0,0.4); color:rgba(240,232,214,0.7); display:grid; place-items:center; font-size:16px; text-decoration:none; }
  .home-link:hover { color:var(--gold); border-color:var(--gold); }

  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }
  @media (max-width:640px) { .letter { max-height:76vh; } }
</style>
</head>
<body>
<canvas id="motes"></canvas>

<div class="select" id="selectOv">
  <div class="sel-kicker">拾 遗 · 纸 间</div>
  <div class="sel-title">选 一 个 信 箱</div>
  <div class="sel-sub">三个信箱 · 或导入你的故事</div>
  <div class="story-list" id="storyList"></div>
  <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="btn-sub" id="importBtn">导 入 故 事</button>
    <button class="btn-sub" id="aiBtn">让 AI 写一个</button>
    <button class="btn-sub" id="writeBtn">✎ 手 写 故 事</button>
  </div>
</div>

<div class="title" id="titleScreen">
  <button class="btn-sub" id="backBtn" style="position:absolute;top:20px;left:20px">← 选 集</button>
  <div class="ts-kicker" id="tsKicker"></div>
  <div class="ts-title" id="tsTitle"></div>
  <div class="ts-desc" id="tsDesc"></div>
  <div class="ts-actions">
    <button class="btn-main" id="startBtn">拆 开 第 一 封 信</button>
    <button class="btn-main" id="contBtn" style="display:none">继 续 读 信</button>
    <button class="btn-sub" id="stackBtn">信 堆</button>
    <button class="btn-sub" id="shareStoryBtn">分享此故事</button>
  </div>
  <div style="margin-top:26px;display:flex;gap:10px" id="tsEndings"></div>
  <div style="margin-top:14px;font-size:12px;letter-spacing:0.2em;color:rgba(236,229,210,0.45)" id="tsStats"></div>
</div>

<div class="corner">
  <button class="btn-ghost" id="sndBtn">声 · 开</button>
  <button class="btn-ghost" id="langBtn">EN</button>
</div>

<div class="stage" id="stage"></div>

<div class="ending" id="endingNote">
  <div class="en-kicker">结 局</div>
  <div class="en-title" id="enTitle"></div>
  <div class="en-text" id="enText"></div>
  <div class="ts-actions" style="margin-top:34px">
    <button class="btn-main" id="againBtn">再 读 一 遍</button>
  </div>
</div>

<a class="home-link" href="../index.html" title="拾遗 · 序">序</a>

<script src="story-data.js"></script>
<script>
'use strict';
/* 纸间 v5 — 简洁交互层重建 */

let lang = localStorage.getItem('letters-lang') || (navigator.language.startsWith('zh' ? 'zh' : 'en'));
let pack = null;
let save = null;
let visited = new Set();
let letterCount = 0;
let sealMode = false;

const S = () => pack.letters[lang] || pack.letters.zh;
const SE = () => pack.endings[lang] || pack.endings.zh;
const total = () => pack.order.filter(x => !String(x).startsWith('E')).length;

/* ---------- 故事装载 ---------- */
let imports = [];
try { imports = JSON.parse(localStorage.getItem('letters-imports') || '[]'); } catch(e) {}

function loadPack(p) {
  pack = p;
  const key = 'letters-save-' + p.id;
  save = Object.assign({node:null, read:0, endings:[], readNodes:[], snd:true, readEver:0},
    JSON.parse(localStorage.getItem(key) || '{}'));
  applyStyle();
}
const persist = () => localStorage.setItem('letters-save-' + pack.id, JSON.stringify(save));

function applyStyle() {
  const s = pack.style || {};
  const r = document.documentElement.style;
  r.setProperty('--paper', s.paper || '#f0e8d6');
  r.setProperty('--paper2', s.paper2 || '#e8ddc4');
  r.setProperty('--ink', s.ink || '#33302a');
  r.setProperty('--seal', s.seal || '#9e3528');
  r.setProperty('--gold', s.gold || '#d9b57c');
  r.setProperty('--ruling', s.ruling || 'rgba(130,108,64,0.09)');
  r.setProperty('--bg1', s.bg1 || '#101a20');
  r.setProperty('--bg2', s.bg2 || '#1a2732');
  document.body.style.background = `radial-gradient(ellipse at 50% 30%, ${s.bg2 || '#1a2732'}, ${s.bg1 || '#101a20'} 75%)`;
}

/* ---------- 选集屏 ---------- */
function buildSelect() {
  const list = document.getElementById('storyList');
  list.innerHTML = '';
  [...BUILTIN_STORIES, ...imports].forEach(p => {
    const sv = {};
    try { Object.assign(sv, JSON.parse(localStorage.getItem('letters-save-' + p.id) || '{}')); } catch(e) {}
    const b = document.createElement('button');
    b.className = 'story-card';
    const read = Math.min(sv.readEver || 0, 20);
    const got = (sv.endings || []).length;
    b.innerHTML = `<span class="tt">${lang === 'zh' ? p.title : (p.titleEn || p.title)}</span>
      <span class="kk">${lang === 'zh' ? (p.kicker || '') : (p.kickerEn || p.kicker || '')}</span>
      <span class="prog">${read ? `✉${read} ◈${got}` : 'NEW'}</span>`;
    b.addEventListener('click', () => {
      loadPack(p);
      showTitle();
    });
    list.appendChild(b);
  });
}

function showSelect() {
  document.getElementById('selectOv').style.display = 'flex';
  document.getElementById('titleScreen').classList.remove('show');
  buildSelect();
}

function showTitle() {
  document.getElementById('selectOv').style.display = 'none';
  const ts = document.getElementById('titleScreen');
  ts.classList.remove('gone');
  ts.classList.add('show');
  document.getElementById('tsKicker').textContent = lang === 'zh' ? (pack.kicker || '') : (pack.kickerEn || pack.kicker || '');
  document.getElementById('tsTitle').textContent = lang === 'zh' ? pack.title : (pack.titleEn || pack.title);
  document.getElementById('tsDesc').innerHTML = lang === 'zh' ? (pack.desc || '') : (pack.descEn || pack.desc || '');
  document.getElementById('contBtn').style.display = (save.node && !save.endings.length) ? 'inline-block' : 'none';
  // 结局点
  const es = document.getElementById('tsEndings');
  es.innerHTML = '';
  pack.order.filter(x => String(x).startsWith('E')).forEach(k => {
    const d = document.createElement('div');
    d.style.cssText = `width:12px;height:12px;border-radius:50%;border:1px solid rgba(240,232,214,0.35)`;
    if (save.endings.includes(k)) {
      d.style.background = 'var(--gold)';
      d.style.borderColor = 'var(--gold)';
      d.style.boxShadow = '0 0 12px rgba(217,181,124,0.6)';
    }
    es.appendChild(d);
  });
  document.getElementById('tsStats').textContent =
    `${total()} 封信 · 你读过 ${Math.min(save.readEver || 0, total())} 封 · 结局 ${save.endings.length}`;
}

/* ---------- 信封 & 信纸 ---------- */
const stage = document.getElementById('stage');

function showEnvelope(nextId) {
  stage.innerHTML = '';
  const env = document.createElement('div');
  env.className = 'envelope';
  env.innerHTML = `
    <div class="env-body"></div>
    <div class="env-peek"></div>
    <div class="env-flap"></div>
    <div class="seal">${(pack.title || '信')[0]}</div>
    <div class="env-hint">${lang === 'zh' ? '点 击 拆 封' : 'CLICK TO UNSEAL'}</div>`;
  stage.appendChild(env);
  env.addEventListener('click', () => {
    if (!env.classList.contains('open')) {
      env.classList.add('open');
      setTimeout(() => showLetter(nextId), 900);
    }
  });
}

let revealTimers = [];
function showLetter(id, reread) {
  revealTimers.forEach(clearTimeout); revealTimers = [];
  const nd = S()[id];
  if (!nd) { showEnvelope(Object.keys(S())[0]); return; }
  visited.add('node:' + id);
  if (!reread) {
    letterCount++;
    save.read = letterCount;
    save.node = id;
    save.readNodes = save.readNodes || [];
    if (!save.readNodes.includes(id)) save.readNodes.push(id);
    persist();
  }
  save.readEver = Math.max(save.readEver || 0, letterCount);
  persist();

  stage.innerHTML = '';
  const lt = document.createElement('div');
  lt.className = 'letter' + (nd.postcard ? ' postcard' : '');
  const paras = (nd.text || '').split('\n').map(p => p.trim()).filter(Boolean);
  lt.innerHTML = `<div class="yr">${nd.year || ''}</div><h2>${nd.title || ''}</h2>` +
    paras.map((p, i) => `<p class="${i === 0 ? 'drop' : ''}">${p}</p>`).join('');

  const actions = document.createElement('div');
  actions.className = 'replies';
  if (nd.replies && nd.replies.length) {
    nd.replies.forEach(r => {
      const b = document.createElement('button');
      b.className = 'reply';
      b.textContent = r.label;
      b.addEventListener('click', () => {
        gotoNode(r.to);
      });
      actions.appendChild(b);
    });
  } else if (nd.cont) {
    const b = document.createElement('button');
    b.className = 'reply';
    b.textContent = nd.cont;
    b.addEventListener('click', () => {
      gotoNode(nextAfter(id));
    });
    actions.appendChild(b);
  }
  lt.appendChild(actions);
  stage.appendChild(lt);

  // 逐段渐显
  const ps = lt.querySelectorAll('p');
  let delay = 200;
  ps.forEach((p, i) => {
    revealTimers.push(setTimeout(() => {
      p.classList.add('in');
      if (i === ps.length - 1) {
        revealTimers.push(setTimeout(() => {
          actions.classList.add('in');
        }, 1000));
      }
    }, delay));
    delay += Math.min(1400, 500 + (p.textContent || '').length * 22);
  });
  // 点击跳过
  lt.addEventListener('click', e => {
    if (e.target.closest('.reply')) return;
    if (!actions.classList.contains('in')) {
      revealTimers.forEach(clearTimeout);
      ps.forEach(p => p.classList.add('in'));
      actions.classList.add('in');
    }
  });
}

function nextAfter(id) {
  const ids = pack.order.filter(x => !String(x).startsWith('E'));
  const i = ids.indexOf(id);
  return ids[Math.min(i + 1, ids.length - 1)] || ids[0];
}

function gotoNode(to) {
  if (String(to).startsWith('E')) { showEnding(to); return; }
  showEnvelope(to);
}

/* ---------- 结局 ---------- */
function showEnding(eid) {
  const E = SE()[eid] || {};
  save.node = null;
  if (!save.endings.includes(eid)) save.endings.push(eid);
  persist();
  document.getElementById('enTitle').textContent = E.title || '';
  document.getElementById('enText').textContent = E.text || '';
  document.getElementById('endingNote').classList.add('show');
}

/* ---------- 按钮 ---------- */
document.getElementById('startBtn').addEventListener('click', () => {
  visited = new Set(); letterCount = 0;
  save.read = 0; save.node = null; persist();
  document.getElementById('titleScreen').classList.add('gone');
  showEnvelope(pack.order.find(x => !String(x).startsWith('E')));
});
document.getElementById('contBtn').addEventListener('click', () => {
  document.getElementById('titleScreen').classList.add('gone');
  showEnvelope(save.node || pack.order[0]);
});
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('endingNote').classList.remove('show');
  visited = new Set(); letterCount = 0;
  save.read = 0; save.node = null; persist();
  showEnvelope(pack.order.find(x => !String(x).startsWith('E')));
});
document.getElementById('backBtn').addEventListener('click', showSelect);
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('letters-lang', lang);
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  if (document.getElementById('selectOv').style.display !== 'none') buildSelect();
  else showTitle();
});
document.getElementById('sndBtn').addEventListener('click', () => {
  save.snd = !save.snd; persist();
  document.getElementById('sndBtn').textContent = save.snd ? '声 · 开' : '声 · 关';
});

// 占位按钮（后续可扩展）
document.getElementById('stackBtn').addEventListener('click', () => {});
document.getElementById('shareStoryBtn').addEventListener('click', () => {});
document.getElementById('importBtn').addEventListener('click', () => {});
document.getElementById('aiBtn').addEventListener('click', () => {});
document.getElementById('writeBtn').addEventListener('click', () => {});

/* ---------- 尘埃粒子 ---------- */
const motes = document.getElementById('motes');
const mctx = motes.getContext('2d');
let motesArr = [];
function resizeMotes() {
  motes.width = innerWidth; motes.height = innerHeight;
  motesArr = [];
  for (let i = 0; i < 40; i++)
    motesArr.push({x:Math.random()*motes.width,y:Math.random()*motes.height,r:Math.random()*1.6+0.4,v:6+Math.random()*14,p:Math.random()*Math.PI*2});
}
resizeMotes();
window.addEventListener('resize', resizeMotes);
let prevM = performance.now();
let motesHidden = false;
document.addEventListener('visibilitychange', () => { motesHidden = document.hidden; });
function mframe(now) {
  requestAnimationFrame(mframe);
  if (motesHidden) return;
  const dt = Math.min((now - prevM) / 1000, 0.05);
  prevM = now;
  mctx.clearRect(0, 0, motes.width, motes.height);
  for (const m of motesArr) {
    m.y -= m.v * dt;
    m.x += Math.sin(now / 1000 + m.p) * 0.3;
    if (m.y < -4) { m.y = motes.height + 4; m.x = Math.random() * motes.width; }
    const a = 0.14 + 0.12 * Math.sin(now / 900 + m.p * 3);
    mctx.fillStyle = `rgba(222,204,160,${Math.max(0, a).toFixed(3)})`;
    mctx.beginPath(); mctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); mctx.fill();
  }
}

/* ---------- 启动 ---------- */
document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
loadPack(BUILTIN_STORIES[0]);
// hash 直达
{
  const hm = location.hash.match(/^#p=(\w+)(?:&n=(\w+))?/);
  if (hm) {
    const p = [...BUILTIN_STORIES, ...imports].find(x => x.id === hm[1]);
    if (p) {
      loadPack(p);
      if (hm[2] && S()[hm[2]]) {
        document.getElementById('selectOv').style.display = 'none';
        letterCount = 1;
        showLetter(hm[2]);
      } else {
        showTitle();
      }
    } else showSelect();
  } else showSelect();
}
requestAnimationFrame(mframe);
</script>
