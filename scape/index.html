<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>造境 · SCAPE — 程序化声景</title>
<style>
  html { color-scheme: dark; }
  :root {
    --dock: rgba(12,16,22,0.72);
    --line: rgba(255,255,255,0.14);
    --txt: #e8ecf1;
    --dim: rgba(232,236,241,0.55);
    --gold: #e8c07a;
    --cyan: #8fd8cf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", Georgia, serif;
    background: #0a0e14; color: var(--txt);
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- 标题 / 时间 ---------- */
  .masthead { position: fixed; top: 24px; left: 30px; z-index: 5; pointer-events: none; }
  .masthead h1 { font-size: clamp(24px, 3.4vw, 36px); font-weight: 600; letter-spacing: 0.16em; text-shadow: 0 2px 18px rgba(0,0,0,0.5); }
  .masthead h1 .en { font-size: 0.55em; font-style: italic; letter-spacing: 0.1em; color: var(--gold); margin-left: 0.5em; }
  .masthead .clock { margin-top: 4px; font-size: 15px; letter-spacing: 0.3em; color: var(--dim); text-shadow: 0 1px 10px rgba(0,0,0,0.6); }

  .topright { position: fixed; top: 24px; right: 28px; z-index: 6; display: flex; gap: 10px; align-items: center; }
  .btn-ghost {
    border: 1px solid var(--line); background: var(--dock); backdrop-filter: blur(8px);
    color: var(--txt); font-family: inherit; font-size: 12.5px; letter-spacing: 0.12em;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .2s, opacity .2s;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
  .btn-ghost.on { border-color: var(--gold); color: var(--gold); }
  #recBtn.recording { border-color: #e88; color: #e88; animation: recPulse 1.6s ease-in-out infinite; }
  @keyframes recPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(238,136,136,0.4); } 50% { box-shadow: 0 0 0 6px rgba(238,136,136,0); } }
  @media (prefers-reduced-motion: reduce) { #recBtn.recording { animation: none; } }
  .timer-badge { position: relative; }
  .timer-badge .ring { width: 18px; height: 18px; vertical-align: -4px; margin-right: 7px; }
  .timer-badge.on { border-color: var(--gold); color: var(--gold); }

  /* ---------- 底部控制台 ---------- */
  .dock {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 12px; align-items: center;
    max-width: min(96vw, 900px);
  }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    border: 1px solid var(--line); background: var(--dock); backdrop-filter: blur(8px);
    color: var(--dim); font-family: inherit; font-size: 12.5px; letter-spacing: 0.14em;
    padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .2s, opacity .2s;
  }
  .chip:hover, .chip.on { color: var(--gold); border-color: var(--gold); }

  .board {
    display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; justify-content: center;
    padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--dock); backdrop-filter: blur(14px);
    box-shadow: 0 12px 44px rgba(0,0,0,0.4);
  }
  .ch { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 86px; padding: 4px 2px; }
  .ch .ic { width: 30px; height: 30px; opacity: 0.42; transition: opacity .25s, filter .25s; }
  .ch.on .ic { opacity: 1; filter: drop-shadow(0 0 7px rgba(232,192,122,0.55)); }
  .ch .nm { font-size: 11.5px; letter-spacing: 0.2em; color: var(--dim); white-space: nowrap; }
  .ch.on .nm { color: var(--txt); }
  .ch input[type=range] {
    -webkit-appearance: none; appearance: none; width: 74px; height: 2px;
    background: var(--line); border-radius: 2px; outline: none; cursor: pointer;
  }
  .ch input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--txt); border: none; cursor: grab;
  }
  .ch input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--txt); border: none; }
  .vsep { width: 1px; background: var(--line); margin: 6px 4px; }
  .timecol { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 96px; }
  .timecol .ic { width: 30px; height: 30px; }
  .timecol .nm { font-size: 11.5px; letter-spacing: 0.2em; color: var(--dim); }
  .timecol input[type=range] {
    -webkit-appearance: none; appearance: none; width: 84px; height: 2px;
    background: linear-gradient(90deg, #1a2340, #7fb0e8, #f5d9a0, #e88d5a, #2a2a55, #141a30);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .timecol input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid var(--gold); cursor: grab;
  }
  .timecol input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--gold); }

  .hint {
    position: fixed; left: 50%; bottom: 190px; transform: translateX(-50%);
    z-index: 5; font-size: 12.5px; letter-spacing: 0.3em; color: var(--dim);
    text-shadow: 0 1px 10px rgba(0,0,0,0.7); pointer-events: none;
    transition: opacity 2s; white-space: nowrap;
  }
  .hint.gone { opacity: 0; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .home-link {
    position: fixed; left: 28px; bottom: 28px; z-index: 7;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--dock); backdrop-filter: blur(8px);
    color: var(--txt); display: grid; place-items: center;
    font-size: 16px; text-decoration: none; transition: color .25s, background .25s, border-color .25s, box-shadow .25s, transform .25s, opacity .25s;
  }
  .home-link:hover { color: var(--gold); border-color: var(--gold); transform: translateY(-3px); }

  @media (max-width: 720px) {
    .board { gap: 2px; padding: 10px 8px 8px; }
    .ch { width: 74px; }
    .ch input[type=range] { width: 60px; }
    .timecol input[type=range] { width: 70px; }
    .masthead { top: 14px; left: 16px; }
    .topright { top: 14px; right: 14px; }
    .hint { bottom: 230px; font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<body>
<canvas id="cv"></canvas>

<header class="masthead">

<script>
'use strict';
window.addEventListener('error', e => {
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#401414;color:#ffb4b4;font-size:12px;padding:8px 12px';
  b.textContent = 'ERR: ' + e.message;
  document.body.appendChild(b);
});

/* ================= i18n ================= */
const I18N = {
  zh: {
    sub: '程序化声景 · 声音与画面皆由数学生成',
    channels: { rain: '雨', wind: '风', fire: '篝火', stream: '溪流', cricket: '夜虫', thunder: '雷', birds: '鸟鸣', bell: '远钟', snow: '雪' },
    time: '时刻', presets: {
      rainy: '雨夜读书', morning: '山涧清晨', fireside: '炉边听风', valley: '午后山谷', winter: '冬夜围炉'
    },
    hint: '拨动天气与时刻 · 声画同源',
    random: '随 机', savePreset: '存 为 境',
    customName: i => `境·${'一二三四五六'[i]}`,
    delTip: '长按删除此境',
    sleepTip: '睡眠渐弱', paused: '已暂停 · 空格继续',
    rec: '● 录', recStop: '■ 停止', recDone: '✓ 录像已保存', recFail: '此浏览器不支持录制',
    flowOn: '⏳ 流转 · 开', flowOff: '⏳ 流转', flowTip: '时光流转：昼夜每 4 分钟一轮回',
    timer: ['专注 25 分', '专注 45 分', '专注 60 分', '取消计时'],
    timeNames: ['夜', '晨', '昼', '暮'],
    sndTip: '点任意滑杆开启声音'
  },
  en: {
    sub: 'Procedural soundscape — sound and scene, both born of math',
    channels: { rain: 'RAIN', wind: 'WIND', fire: 'FIRE', stream: 'STREAM', cricket: 'CRICKETS', thunder: 'THUNDER', birds: 'BIRDS', bell: 'BELL', snow: 'SNOW' },
    time: 'HOUR', presets: {
      rainy: 'Rainy Night', morning: 'Mountain Dawn', fireside: 'Fireside', valley: 'Valley Noon', winter: 'Winter Hearth'
    },
    hint: 'DIAL WEATHER & HOUR — SOUND AND SCENE ARE ONE',
    random: 'RANDOM', savePreset: 'SAVE SCENE',
    customName: i => 'Scene ' + (i + 1),
    delTip: 'long-press to delete',
    sleepTip: 'sleep fade', paused: 'PAUSED · SPACE TO RESUME',
    rec: '● REC', recStop: '■ STOP', recDone: '✓ recording saved', recFail: 'recording unsupported here',
    flowOn: '⏳ FLOW ON', flowOff: '⏳ FLOW', flowTip: 'time flows — a full day every 4 minutes',
    timer: ['FOCUS 25', 'FOCUS 45', 'FOCUS 60', 'CANCEL'],
    timeNames: ['NIGHT', 'DAWN', 'DAY', 'DUSK'],
    sndTip: 'touch any dial to start sound'
  }
};
let lang = localStorage.getItem('scape-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
const T = () => I18N[lang];

/* ================= 状态 ================= */
const S = {
  rain: 0, wind: 0.15, fire: 0, stream: 0.3, cricket: 0, thunder: 0,
  birds: 0, bell: 0, snow: 0,
  time: 14, master: 0.8
};
const CH_ORDER = ['rain', 'wind', 'fire', 'stream', 'cricket', 'thunder', 'birds', 'bell', 'snow'];

/* ================= 音频引擎（全合成） ================= */
let AC = null, master = null, nodes = {};
function noiseBuffer(kind) {
  const len = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  if (kind === 'white') {
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } else { // brown
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.5;
    }
  }
  return buf;
}
function loopSrc(buf) {
  const s = AC.createBufferSource();
  s.buffer = buf; s.loop = true; s.start();
  return s;
}
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6;
  master = AC.createGain(); master.gain.value = S.master;
  master.connect(comp); comp.connect(AC.destination);

  const white = noiseBuffer('white'), brown = noiseBuffer('brown');

  // 雨：白噪声低通
  {
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = AC.createGain(); g.gain.value = 0;
    loopSrc(white).connect(f); f.connect(g); g.connect(master);
    nodes.rain = { f, g };
  }
  // 风：布朗噪声 + 截止游走
  {
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
    const g = AC.createGain(); g.gain.value = 0;
    loopSrc(brown).connect(f); f.connect(g); g.connect(master);
    // 啸鸣：窄带通
    const wf = AC.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 950; wf.Q.value = 9;
    const wg = AC.createGain(); wg.gain.value = 0;
    loopSrc(white).connect(wf); wf.connect(wg); wg.connect(master);
    nodes.wind = { f, g, wf, wg, walk: 300 };
  }
  // 篝火：布朗垫底
  {
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    const g = AC.createGain(); g.gain.value = 0;
    loopSrc(brown).connect(f); f.connect(g); g.connect(master);
    nodes.fire = { g };
  }
  // 溪流：带通
  {
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 720; f.Q.value = 1.4;
    const g = AC.createGain(); g.gain.value = 0;
    const src = loopSrc(white);
    const pre = AC.createBiquadFilter(); pre.type = 'lowpass'; pre.frequency.value = 2400;
    src.connect(pre); pre.connect(f); f.connect(g); g.connect(master);
    nodes.stream = { f, g };
  }
  updateAudio(0);
}
function chanGain(k) {
  switch (k) {
    case 'rain': return S.rain * 0.42;
    case 'wind': return S.wind * 0.5;
    case 'fire': return S.fire * 0.3;
    case 'stream': return S.stream * 0.26;
    default: return 0;
  }
}
function updateAudio(smooth = 0.5) {
  if (!AC) return;
  const t = AC.currentTime;
  const set = (p, v) => p.setTargetAtTime(v, t, smooth);
  set(nodes.rain.g.gain, chanGain('rain'));
  set(nodes.rain.f.frequency, 500 + S.rain * 2800);
  set(nodes.wind.g.gain, chanGain('wind'));
  set(nodes.wind.wg.gain, Math.max(0, S.wind - 0.55) * 0.1);
  set(nodes.fire.g.gain, chanGain('fire'));
  set(nodes.stream.g.gain, chanGain('stream'));
  if (master) set(master.gain, S.master);
}
/* 一次性音效 */
function plink() { // 雨滴
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = 2400 + Math.random() * 3200;
  g.gain.setValueAtTime(0.0012 + Math.random() * 0.004, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.08);
}
function crackle() { // 火爆裂
  const t = AC.currentTime;
  const len = 0.05, buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1400;
  const g = AC.createGain(); g.gain.value = 0.02 + Math.random() * 0.05;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function cricketChirp() { // 虫鸣：4 连拍
  const t0 = AC.currentTime;
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  if (pan) pan.pan.value = Math.random() * 1.6 - 0.8;
  const out = pan || master;
  if (pan) pan.connect(master);
  const base = 4100 + Math.random() * 500;
  for (let i = 0; i < 4; i++) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = base;
    const t = t0 + i * 0.052;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.022, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.05);
  }
}
function birdCall() { // 鸟鸣：2-4 声 FM 滑音，随机声像
  const t0 = AC.currentTime;
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  if (pan) { pan.pan.value = Math.random() * 1.4 - 0.7; pan.connect(master); }
  const out = pan || master;
  const calls = 2 + Math.floor(Math.random() * 3);
  const base = 1900 + Math.random() * 1400;
  for (let i = 0; i < calls; i++) {
    const o = AC.createOscillator(), m = AC.createOscillator(), mg = AC.createGain(), g = AC.createGain();
    o.type = 'sine';
    m.type = 'sine'; m.frequency.value = 55 + Math.random() * 40;
    mg.gain.value = 120 + Math.random() * 160;
    m.connect(mg); mg.connect(o.frequency);
    const t = t0 + i * (0.16 + Math.random() * 0.1);
    o.frequency.setValueAtTime(base * (0.9 + Math.random() * 0.2), t);
    o.frequency.exponentialRampToValueAtTime(base * (1.15 + Math.random() * 0.25), t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.028 * (0.5 + S.birds * 0.8), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.16);
    m.start(t); m.stop(t + 0.16);
  }
}
function distantBell() { // 远钟：低频双分音长衰减
  const t = AC.currentTime;
  const vol = 0.05 + S.bell * 0.07;
  [164.8, 246.9, 392.0].forEach((fq, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = fq * (1 + (Math.random() - 0.5) * 0.002);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol / (i + 1.6), t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 5.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 5.6);
  });
}
function thunderRumble() { // 雷声 + 闪电
  const t = AC.currentTime;
  const len = 3.2, buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < d.length; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.04 * w) / 1.04;
    d[i] = last * 4 * Math.pow(1 - i / d.length, 1.4);
  }
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 140;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.55, t + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
  flash = 1; nextThunder = performance.now() + (14 + Math.random() * 30) * 1000 / Math.max(S.thunder, 0.05);
}
function bell() { // 计时结束钟声
  const t = AC.currentTime;
  [880, 1108.7, 1318.5].forEach((fq, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = fq;
    const st = t + i * 0.5;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.2, st + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 2.4);
    o.connect(g); g.connect(master); o.start(st); o.stop(st + 2.5);
  });
}

/* ================= 场景生成 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 天空调色关键帧：t, [top, mid, hor], 光照 */
const SKY = [
  { t: 0,  top: [8, 10, 24],    mid: [14, 18, 38],   hor: [24, 28, 52],   L: 0.04 },
  { t: 4.5,top: [10, 12, 30],   mid: [22, 24, 52],   hor: [56, 42, 60],   L: 0.08 },
  { t: 6,  top: [46, 58, 96],   mid: [176, 120, 108],hor: [244, 168, 110],L: 0.45 },

function lerpC(a, b, t) {

function skyAt(time) {

let ridges = [];
function makeRidge(w, h, seed, yBase, amp, color) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(0, h);
  let y = yBase + (rnd() - 0.5) * amp * 0.4;
  const pts = [[0, y]];
  const n = 9;
  for (let i = 1; i <= n; i++) {
    y = yBase + (rnd() - 0.5) * amp;
    pts.push([w * i / n, y]);
  }
  // Catmull-Rom 平滑
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    g.moveTo(p1[0], p1[1]);
    for (let s = 0; s <= 8; s++) {
      const t = s / 8, t2 = t * t, t3 = t2 * t;
      const x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
      const yy = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
      g.lineTo(x, yy);
    }

  g.lineTo(w, h); g.lineTo(0, h);

}
function rebuildScenery() {

    makeRidge(W, H, 71, H * 0.52, H * 0.09, 'rgba(0,0,0,0.24)'),
    makeRidge(W, H, 72, H * 0.62, H * 0.10, 'rgba(0,0,0,0.42)'),
    makeRidge(W, H, 73, H * 0.74, H * 0.08, 'rgba(0,0,0,0.66)')
  ];
  stars = [];
  const rnd = mulberry32(99);
  for (let i = 0; i < 130; i++)
    stars.push({ x: rnd() * W, y: rnd() * H * 0.55, r: rnd() * 1.3 + 0.3, p: rnd() * Math.PI * 2 });
  clouds = [];
  for (let i = 0; i < 7; i++) {
    const puffs = [];

    for (let j = 0; j < pn; j++)
      puffs.push({ dx: (rnd() - 0.5) * 160, dy: (rnd() - 0.5) * 34, r: 34 + rnd() * 46 });
    clouds.push({ x: rnd() * W, y: H * (0.1 + rnd() * 0.26), s: 0.6 + rnd() * 0.8, v: 4 + rnd() * 9, puffs });
  }
  raindrops = [];
  for (let i = 0; i < 240; i++)
    raindrops.push({ x: Math.random() * W * 1.2 - W * 0.1, y: Math.random() * H, v: 620 + Math.random() * 380, l: 9 + Math.random() * 13 });

  for (let i = 0; i < 190; i++)

let stars = [], clouds = [], raindrops = [], embers = [], snowflakes = [];

function resize() {

/* ================= 主渲染 ================= */
let flash = 0, nextThunder = Infinity, time = 0;
function scene(dt) {
  time += dt;

  const L = Math.max(0.03, sky.L * Math.max(0.45, darken));

  // 天空

  g.addColorStop(0, rgb(sky.top.map(v => v * Math.max(0.5, darken))));
  g.addColorStop(0.62, rgb(sky.mid.map(v => v * Math.max(0.5, darken))));
  g.addColorStop(1, rgb(sky.hor.map(v => v * Math.max(0.55, darken))));

  ctx.fillRect(0, 0, W, H);

  // 星

  if (starA > 0.01) {
    for (const st of stars) {
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(time * 1.4 + st.p));
      ctx.fillStyle = `rgba(240,244,255,${(starA * tw * 0.85).toFixed(3)})`;
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    // 流星：深夜更密，雨雪时无
    if (S.rain < 0.1 && S.snow < 0.3 && time > nextMeteor) {
      nextMeteor = time + 6 + Math.random() * 20;
      const nightDeep = Math.max(0, 1 - sky.L * 6);
      meteors.push({
        x: W * (0.15 + Math.random() * 0.7), y: H * (0.04 + Math.random() * 0.2),
        vx: (Math.random() > 0.5 ? 1 : -1) * (420 + Math.random() * 300),
        vy: 150 + Math.random() * 110,
        life: 1
      });
      if (Math.random() < 0.4 * nightDeep) meteors.push({ // 偶发双流星
        x: W * (0.15 + Math.random() * 0.7), y: H * (0.04 + Math.random() * 0.2),
        vx: (Math.random() > 0.5 ? 1 : -1) * (420 + Math.random() * 300),
        vy: 150 + Math.random() * 110, life: 1, delay: 0.4 + Math.random() * 0.5
      });
    }
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    if (m.delay > 0) { m.delay -= dt; continue; }
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.life -= dt * 0.85;
    if (m.life <= 0 || m.y > H * 0.7) { meteors.splice(i, 1); continue; }

    const y = H * 0.62 - Math.cos(ang) * H * 0.5;

    glow.addColorStop(0, isSun ? 'rgba(255,222,150,0.55)' : 'rgba(210,224,255,0.3)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');

      const y = H * (0.62 + i * 0.09);
      const off = (time * (12 + i * 9) * (0.3 + S.wind)) % (W + 400) - 200;

      fg.addColorStop(0, 'rgba(220,226,232,0)');
      fg.addColorStop(0.5, `rgba(220,226,232,${(fa * 0.5).toFixed(3)})`);

    sg.addColorStop(0, `rgba(90,120,150,${(0.14 + S.stream * 0.2).toFixed(3)})`);

    for (let i = 0; i < count; i++) {

    const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, 150 * S.fire * flick + 40);

      const x = (Math.sin(ph * 0.35 + i) * 0.5 + 0.5) * W * 0.8 + W * 0.1;

        ag.addColorStop(1, `hsla(${hue + 30},80%,70%,${(aa * 0.14).toFixed(3)})`);
        ctx.fillStyle = ag;
        ctx.fill();
      }
    }
  }

  if (S.birds > 0.05 && L > 0.25) {
    for (let i = 0; i < 4; i++) {
      const ph = time * (0.06 + i * 0.013) + i * 2.6;
      const bx = ((ph % 1.4) / 1.4) * (W + 160) - 80;
      const by = H * (0.16 + 0.09 * (i % 3)) + Math.sin(time * 1.1 + i * 2) * 12;
      const flap = Math.sin(time * 7 + i * 1.7) * 4.2;
      const sc = 0.7 + (i % 3) * 0.25;
      ctx.strokeStyle = `rgba(20,26,34,${(0.35 * S.birds + 0.12).toFixed(3)})`;
      ctx.lineWidth = 1.6 * sc;
      ctx.beginPath();
      ctx.moveTo(bx - 7 * sc, by - flap * sc * 0.5);
      ctx.quadraticCurveTo(bx, by + 2 * sc, bx + 0.1, by);
      ctx.quadraticCurveTo(bx, by + 2 * sc, bx + 7 * sc, by - flap * sc * 0.5);
      ctx.stroke();
    }
  }

  // 雨后彩虹（雨≥0.35 且日光充足时的彩蛋）
  if (S.rain > 0.3 && sky.L > 0.55) {
    const ra = Math.min(0.34, (S.rain - 0.3) * 1.6) * Math.min(1, (sky.L - 0.55) * 4);
    const cx0 = W * 0.5, cy0 = H * 0.98, R = H * 0.62;
    const hues = ['rgba(148,112,196,', 'rgba(96,132,208,', 'rgba(112,178,190,', 'rgba(140,196,140,', 'rgba(224,190,110,', 'rgba(222,150,100,', 'rgba(206,110,96,'];
    for (let i = 0; i < 7; i++) {
      ctx.strokeStyle = hues[i] + (ra * 0.5 * (1 - i * 0.06)).toFixed(3) + ')';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(cx0, cy0, R + i * 8, Math.PI * 1.05, Math.PI * 1.95);
      ctx.stroke();
    }
  }

  // 闪电
  if (flash > 0) {
    flash -= dt * 2.4;
    ctx.fillStyle = `rgba(255,255,255,${(Math.max(0, flash) * 0.55).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 暗角
  const vg = ctx.createRadialGradient(W / 2, H * 0.44, Math.min(W, H) * 0.36, W / 2, H * 0.5, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(4,6,10,0.46)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}
function cricketActive() {
  return S.time >= 19.5 || S.time <= 5.2;
}

/* ================= 音频调度（帧循环内） ================= */
let plinkT = 0, crackleT = 0, cricketT = 0, birdT = 0, bellT = 0;
function birdsActive() { return S.time > 6 && S.time < 19.2; }
function audioTick(now, dt) {
  if (!AC) return;
  // 雨滴
  if (S.rain > 0.06 && now > plinkT) {
    plink();
    plinkT = now + (40 + Math.random() * 320 / S.rain);
  }
  // 爆裂
  if (S.fire > 0.08 && now > crackleT) {
    crackle();
    crackleT = now + (60 + Math.random() * 700 / S.fire);
  }
  // 虫鸣（仅夜间）
  if (cricketActive() && S.cricket > 0.05 && now > cricketT) {
    cricketChirp();
    cricketT = now + (300 + Math.random() * 1600 / S.cricket);
  }
  // 鸟鸣（仅日间，雨天更稀）
  if (birdsActive() && S.birds > 0.05 && now > birdT) {
    birdCall();
    birdT = now + (900 + Math.random() * 4200 / S.birds) * (1 + S.rain * 1.2);
  }
  // 远钟
  if (S.bell > 0.05 && now > bellT) {
    distantBell();
    bellT = now + (16000 + Math.random() * 42000) / (0.3 + S.bell);
  }
  // 风：截止游走
  const wn = nodes.wind;
  if (wn) {
    wn.walk += (Math.random() - 0.5) * 60 * dt * 3;
    wn.walk = Math.max(140, Math.min(900, wn.walk));
    wn.f.frequency.setTargetAtTime(wn.walk * (0.4 + S.wind), AC.currentTime, 0.3);
  }
  // 雷
  if (S.thunder > 0.03 && now > nextThunder) thunderRumble();
  if (S.thunder <= 0.03) nextThunder = Infinity;
}

/* ================= 计时器 ================= */
let timerMode = 0, timerEnd = 0, timerLen = 25 * 60;
const timerBtn = document.getElementById('timerBtn'), timerTxt = document.getElementById('timerTxt'), ringFg = document.getElementById('ringFg');
timerBtn.addEventListener('click', () => {
  initAudio();
  timerMode = (timerMode + 1) % 4;
  if (timerMode < 3) {
    timerLen = [25, 45, 60][timerMode] * 60;
    timerEnd = performance.now() + timerLen * 1000;
    timerBtn.classList.add('on');
  } else {
    timerMode = 3; timerBtn.classList.remove('on');
  }
  updTimerUI();
});
function updTimerUI() {
  if (timerMode === 3 || timerMode === 0 && timerEnd === 0) {
    timerTxt.textContent = T().timer[Math.min(timerMode, 3)];
    if (timerMode === 3) { ringFg.style.strokeDashoffset = 50.3; }
  }
}
function timerTick(now) {
  if (timerMode > 2 || timerEnd === 0) return;
  const rem = Math.max(0, (timerEnd - now) / 1000);
  const mm = Math.floor(rem / 60), ss = Math.floor(rem % 60);
  timerTxt.textContent = `${mm}:${ss.toString().padStart(2, '0')}`;
  const frac = 1 - rem / timerLen;
  ringFg.style.strokeDashoffset = (50.3 * (1 - frac)).toFixed(1);
  if (rem <= 0) {
    timerEnd = 0; timerMode = 3; timerBtn.classList.remove('on');
    if (AC) bell();
    timerTxt.textContent = T().timer[3];
  }
}

/* ================= UI 构建 ================= */
const ICONS = {
  rain: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 12a5 5 0 0 1 .5-9.97A6 6 0 0 1 18 5.5 4 4 0 0 1 18 12z" transform="translate(0,-1)"/><path d="M8 15l-1.5 3M12 15l-1.5 3M16 15l-1.5 3"/></svg>',
  wind: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h9a2.5 2.5 0 1 0-2.4-3.2M3 12h14a2.5 2.5 0 1 1-2.4 3.2M3 16h7a2 2 0 1 1-1.9 2.6"/></svg>',
  fire: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3-4 5-4 9a4 4 0 0 0 8 .5C16 9 12 8 12 3z"/><path d="M7.5 13a5.5 5.5 0 1 0 11-.5c0-2-1-3.5-2-4.5"/></svg>',
  stream: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h5l2-2 3 2h8M3 13h6l2 2 3-2h7M3 18h5l2-2"/></svg>',
  cricket: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 19c0-6 3-9 7-10M9 19c0-4 2-6 5-7M12 9l4-4M14 11l5-3M13 7l3-5"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg>',
  thunder: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14a5 5 0 0 1 .3-9.97A6 6 0 0 1 18 7.5 3.5 3.5 0 0 1 17.5 14z"/><path d="M12 12l-2.5 4.5H13L10.5 21"/></svg>',
  birds: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 12c2-2.5 4-2.5 6 0M9 12c2-2.5 4-2.5 6 0M15 9c1.6-2 3.2-2 4.8 0"/><path d="M6 17c2-2.5 4-2.5 6 0M14 16c1.6-2 3.2-2 4.8 0" opacity=".55"/></svg>',
  bell: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a5.5 5.5 0 0 0-5.5 5.5c0 4-2 5-2 5h15s-2-1-2-5A5.5 5.5 0 0 0 12 4z"/><path d="M10.5 18a1.8 1.8 0 0 0 3 0"/><path d="M12 2v1" opacity=".5"/></svg>',
  snow: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/><path d="M12 3l-2 2.2M12 3l2 2.2M12 21l-2-2.2M12 21l2-2.2" opacity=".8"/><path d="M4.2 7.5l2.9.4M4.2 7.5l-.4-2.9M19.8 16.5l-2.9-.4M19.8 16.5l.4 2.9" opacity=".8"/><path d="M19.8 7.5l-2.9.4M19.8 7.5l.4-2.9M4.2 16.5l2.9-.4M4.2 16.5l-.4 2.9" opacity=".8"/></svg>'
};
function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (const k of CH_ORDER) {
    const div = document.createElement('div');
    div.className = 'ch' + (S[k] > 0.02 ? ' on' : '');
    div.innerHTML = `${ICONS[k]}<div class="nm">${T().channels[k]}</div>
      <input type="range" min="0" max="1" step="0.01" value="${S[k]}" aria-label="${T().channels[k]}">`;
    const input = div.querySelector('input');
    input.addEventListener('input', () => {
      S[k] = +input.value;
      div.classList.toggle('on', S[k] > 0.02);
      initAudio(); updateAudio();
      applyPresetActive(null);
      if (k === 'thunder' && S.thunder > 0.03 && nextThunder === Infinity)
        nextThunder = performance.now() + 3000 + Math.random() * 8000;
      document.getElementById('hint').classList.add('gone');
    });
    board.appendChild(div);
  }
  // 分隔 + 时刻
  const sep = document.createElement('div');
  sep.className = 'vsep'; board.appendChild(sep);
  const tc = document.createElement('div');
  tc.className = 'timecol';
  tc.innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3.5 2" stroke-linecap="round"/></svg>
    <div class="nm">${T().time}</div>
    <input type="range" id="timeR" min="0" max="24" step="0.1" value="${S.time}" aria-label="${T().time}">`;
  const tinput = tc.querySelector('input');
  tinput.addEventListener('input', () => {
    S.time = +tinput.value;
    initAudio(); updateAudio();
    applyPresetActive(null);
    updateClock();
  });
  board.appendChild(tc);
}
const PRESETS = {
  rainy:   () => ({ rain: 0.65, wind: 0.18, fire: 0, stream: 0, cricket: 0, thunder: 0.35, birds: 0, bell: 0, snow: 0, time: 22 }),
  morning: () => ({ rain: 0, wind: 0.12, fire: 0, stream: 0.6, cricket: 0.35, thunder: 0, birds: 0.4, bell: 0, snow: 0, time: 6.2 }),
  fireside:() => ({ rain: 0.3, wind: 0.28, fire: 0.75, stream: 0, cricket: 0.2, thunder: 0, birds: 0, bell: 0.15, snow: 0, time: 20.5 }),
  valley:  () => ({ rain: 0, wind: 0.38, fire: 0, stream: 0.32, cricket: 0, thunder: 0, birds: 0.5, bell: 0, snow: 0, time: 14 }),
  winter:  () => ({ rain: 0, wind: 0.22, fire: 0.55, stream: 0, cricket: 0, thunder: 0, birds: 0, bell: 0.3, snow: 0.85, time: 21.5 })
};
function loadCustoms() {
  try { return JSON.parse(localStorage.getItem('scape-customs') || '[]'); } catch (e) { return []; }
}
function saveCustoms(a) { localStorage.setItem('scape-customs', JSON.stringify(a)); }
function randomize() {
  const chans = ['rain', 'wind', 'fire', 'stream', 'cricket', 'birds', 'thunder', 'bell'];
  const zero = {};
  chans.forEach(c => zero[c] = 0);
  const picks = 1 + Math.floor(Math.random() * 2);
  const pool = [...chans];
  for (let i = 0; i < picks; i++) {
    const c = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    if (c === 'cricket' || c === 'bell') zero[c] = 0.25 + Math.random() * 0.45;
    else if (c === 'thunder') zero[c] = 0.15 + Math.random() * 0.4;
    else zero[c] = 0.25 + Math.random() * 0.6;
  }
  const hour = Math.random() * 24;
  Object.assign(S, zero, { time: hour });
  if (S.thunder > 0.05 && S.rain < 0.3) S.rain = 0.35 + Math.random() * 0.3; // 雷随雨来
  initAudio(); updateAudio(1.2);
  buildBoard(); updateClock();
  applyPresetActive(null);
  if (S.thunder > 0.03) nextThunder = performance.now() + 4000 + Math.random() * 9000;
  else nextThunder = Infinity;
  document.getElementById('hint').classList.add('gone');
}
function applyPresetActive(name) {
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.p === name));
}
function buildPresets() {
  const box = document.getElementById('presets');
  box.innerHTML = '';
  const keys = Object.keys(PRESETS);
  keys.forEach((key, idx) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.p = key;
    b.textContent = T().presets[key];
    b.addEventListener('click', () => {
      Object.assign(S, PRESETS[key]());
      initAudio(); updateAudio(1.2);
      buildBoard(); updateClock();
      applyPresetActive(key);
      if (S.thunder > 0.03) nextThunder = performance.now() + 4000 + Math.random() * 9000;
      else nextThunder = Infinity;
      document.getElementById('hint').classList.add('gone');
    });
    box.appendChild(b);
  });
  // 随机
  const rb = document.createElement('button');
  rb.className = 'chip'; rb.dataset.p = '__rand';
  rb.textContent = T().random;
  rb.addEventListener('click', randomize);
  box.appendChild(rb);
  // 自定义境
  const customs = loadCustoms();
  customs.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.p = 'custom' + i;
    b.textContent = T().customName(i);
    b.title = T().delTip;
    b.addEventListener('click', () => {
      Object.assign(S, JSON.parse(JSON.stringify(c)));
      initAudio(); updateAudio(1.2);
      buildBoard(); updateClock();
      applyPresetActive('custom' + i);
      if (S.thunder > 0.03) nextThunder = performance.now() + 4000 + Math.random() * 9000;
      else nextThunder = Infinity;
      document.getElementById('hint').classList.add('gone');
    });
    let lp = null;
    b.addEventListener('pointerdown', () => {
      lp = setTimeout(() => {
        const arr = loadCustoms(); arr.splice(i, 1); saveCustoms(arr);
        buildPresets(); applyPresetActive(null);
        lp = null;
      }, 700);
    });
    const cancelLp = () => { if (lp) { clearTimeout(lp); lp = null; } };
    b.addEventListener('pointerup', cancelLp);
    b.addEventListener('pointerleave', cancelLp);
    box.appendChild(b);
  });
  // 存为境
  const sb = document.createElement('button');
  sb.className = 'chip'; sb.dataset.p = '__save';
  sb.textContent = T().savePreset;
  sb.addEventListener('click', () => {
    const arr = loadCustoms();
    const snap = {};
    CH_ORDER.forEach(c => snap[c] = S[c]);
    snap.time = S.time;
    arr.push(snap);
    while (arr.length > 6) arr.shift();
    saveCustoms(arr);
    buildPresets();
    applyPresetActive('custom' + (arr.length - 1));
  });
  box.appendChild(sb);
}
function updateClock() {
  const h = Math.floor(S.time) % 24, m = Math.floor((S.time % 1) * 60);
  document.getElementById('clock').textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
}
function applyI18n() {
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
  document.title = lang === 'zh' ? '造境 · SCAPE — 程序化声景' : 'SCAPE — procedural soundscape';
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  if (!recorder) document.getElementById('recBtn').textContent = T().rec;
  updFlowBtn();
  document.getElementById('hint').textContent = T().hint;
  updTimerUI();
  buildPresets(); buildBoard(); updateClock();
}
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('scape-lang', lang);
  applyI18n();
});

/* ================= 睡眠定时 / 暂停 / 后台 ================= */
let sleepIdx = 0, sleepDeadline = 0, sleepFading = false;
const SLEEP_MINS = [0, 15, 30, 60];
const sleepBtn = document.getElementById('sleepBtn');
function updSleepBtn() {
  sleepBtn.textContent = sleepIdx === 0 ? '☾ ∞' : '☾ ' + SLEEP_MINS[sleepIdx] + 'm';
  sleepBtn.title = T().sleepTip;
  sleepBtn.classList.toggle('on', sleepIdx > 0 || sleepFading);
}
sleepBtn.addEventListener('click', () => {
  initAudio();
  sleepIdx = (sleepIdx + 1) % SLEEP_MINS.length;
  sleepFading = false;
  sleepDeadline = sleepIdx === 0 ? 0 : performance.now() + SLEEP_MINS[sleepIdx] * 60000;
  updSleepBtn();
});
function sleepTick(now) {
  if (sleepDeadline && now >= sleepDeadline && !sleepFading && AC && master) {
    sleepFading = true;
    const t = AC.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(0.0001, t + 45);
  }
}
function wake() {
  if (sleepFading && AC && master) {
    sleepFading = false; sleepDeadline = 0; sleepIdx = 0;
    const t = AC.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(S.master, t, 0.5);
    updSleepBtn();
  }
}
window.addEventListener('pointerdown', wake);

/* 时光流转 */
let timeFlow = false;
const flowBtn = document.getElementById('flowBtn');
function updFlowBtn() {
  flowBtn.textContent = timeFlow ? T().flowOn : T().flowOff;
  flowBtn.classList.toggle('on', timeFlow);
  flowBtn.title = T().flowTip;
}
flowBtn.addEventListener('click', () => {
  timeFlow = !timeFlow;
  updFlowBtn();
});

/* 音画录制 */
let recorder = null, recChunks = [], recDest = null;
const recBtn = document.getElementById('recBtn');
function updRecBtn() { recBtn.textContent = recorder ? T().recStop : T().rec; recBtn.classList.toggle('recording', !!recorder); }
recBtn.addEventListener('click', () => {
  initAudio();
  if (recorder) { recorder.stop(); return; }
  if (!AC || !window.MediaRecorder || !cv.captureStream) {
    recBtn.textContent = T().recFail;
    setTimeout(updRecBtn, 1800);
    return;
  }
  try {
    const stream = cv.captureStream(30);
    recDest = AC.createMediaStreamDestination();
    master.connect(recDest);
    recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm' });
    recChunks = [];
    recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    recorder.onstop = () => {
      try { master.disconnect(recDest); } catch (e) {}
      recDest = null;
      const blob = new Blob(recChunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.download = `scape-${Date.now()}.webm`;
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      recorder = null;
      updRecBtn();
      recBtn.textContent = T().recDone;
      setTimeout(updRecBtn, 1800);
    };
    recorder.start(500);
    updRecBtn();
  } catch (e) {
    recorder = null;
    recBtn.textContent = T().recFail;
    setTimeout(updRecBtn, 1800);
  }
});

/* 空格暂停 / 数字键预设（1-5） */
let audioPaused = false;
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') {
    e.preventDefault();
    initAudio();
    audioPaused = !audioPaused;
    if (AC && master) master.gain.setTargetAtTime(audioPaused ? 0 : S.master, AC.currentTime, 0.3);
    const h = document.getElementById('hint');
    if (audioPaused) { h.textContent = T().paused; h.classList.remove('gone'); }
    else h.classList.add('gone');
  } else if (e.key >= '1' && e.key <= '5') {
    const key = Object.keys(PRESETS)[+e.key - 1];
    if (key) Object.assign(S, PRESETS[key]()), initAudio(), updateAudio(1.2), buildBoard(), updateClock(), applyPresetActive(key);
  }
});

/* 后台保活：rAF 停摆时仍调度事件音 */
setInterval(() => { if (document.hidden) audioTick(performance.now(), 0.25); }, 600);

/* ================= 主循环 ================= */
let prev = performance.now();
let listenMs = 0, listenFlush = 0;
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  if (timeFlow) {           // 4 分钟一昼夜
    S.time = (S.time + dt * 0.1) % 24;
    const ti = document.getElementById('timeR');
    if (ti) ti.value = S.time.toFixed(1);
    updateClock();
    updateAudio(2);
  }
  scene(dt);
  audioTick(now, dt);
  timerTick(now);
  sleepTick(now);
  // 跨站统计：聆听时长（有声且未暂停时累计）
  if (AC && !audioPaused && !sleepFading) {
    listenMs += dt * 1000;
    if (now - listenFlush > 10000) {
      listenFlush = now;
      try {
        const s = JSON.parse(localStorage.getItem('scape-stats') || '{"minutes":0}');
        s.minutes = Math.round((s.minutes * 60000 + listenMs) / 60000);
        localStorage.setItem('scape-stats', JSON.stringify(s));
        listenMs = 0;
      } catch (e) { listenMs = 0; }
    }
  }
  requestAnimationFrame(frame);
}

/* ================= 启动 ================= */
resize();
applyI18n();
// 开卷：午后山谷
Object.assign(S, PRESETS.valley());
// #key=val&… 测试直达：snow=0.9&time=23&rain=0.7 等（覆盖默认预设）
location.hash.slice(1).split('&').forEach(kv => {
  const [k, v] = kv.split('=');
  if (k && v !== undefined && (k === 'time' || CH_ORDER.includes(k))) {
    S[k] = +v;
  }
});
buildBoard(); updateClock();
requestAnimationFrame(frame);
</script>
